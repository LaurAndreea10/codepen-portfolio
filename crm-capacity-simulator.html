<!doctype html><html lang="ro" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulator capacitate CRM — Practice Lab 16</title><meta name="description" content="Simulator CRM bilingv pentru capacitatea echipei, încărcare și personal suplimentar."><link rel="canonical" href="https://laurandreea10.github.io/codepen-portfolio/crm-capacity-simulator.html"><style>
:root{color-scheme:dark;--bg:#091322;--panel:#14243b;--ink:#f2f6ff;--muted:#bdcde3;--line:#526d8e;--accent:#9bc6ff;--focus:#ffda77;--error:#ffabb4}[data-theme=light]{color-scheme:light;--bg:#edf3fc;--panel:#fff;--ink:#14263e;--muted:#425977;--line:#8197b3;--accent:#174f9f;--focus:#874300;--error:#a31531}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,sans-serif}main{width:min(55rem,100% - 2rem);margin:2rem auto}header,.controls{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:space-between}a{color:var(--accent)}h1{font-size:clamp(2rem,7vw,3rem);line-height:1.15}p{color:var(--muted)}form,section{border:1px solid var(--line);border-radius:1rem;padding:1.25rem;background:var(--panel);margin:1rem 0}.fields{display:grid;gap:1rem}.field{min-width:0}label{display:block;font-weight:700}input,button{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:.6rem;background:var(--panel);color:var(--ink);padding:.6rem}input{width:100%}button{cursor:pointer;margin-top:.5rem}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.error{color:var(--error);min-height:1.5em;margin:.3rem 0}input[aria-invalid=true]{border:2px solid var(--error)}dl{display:grid;gap:1rem;grid-template-columns:repeat(2,minmax(0,1fr))}dt{color:var(--muted)}dd{margin:0;font-size:1.5rem;font-weight:750;overflow-wrap:anywhere}meter{display:block;width:100%;height:1.5rem}#status{min-height:3.2em}#results[hidden]{display:none}@media(min-width:700px){.fields{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(forced-colors:active){form,section,input,button{border:2px solid CanvasText}}
</style></head><body><main><header><a href="evolution-lab.html">Evolution Lab</a><div class="controls"><button id="language" type="button">English</button><button id="theme" type="button">Temă deschisă</button></div></header><p>Practice Lab · 16</p><h1 data-copy="title">Simulator de capacitate CRM</h1><p data-copy="intro">Estimare demonstrativă pentru o zi, presupunând aceeași capacitate pentru fiecare persoană.</p><form id="capacityForm" novalidate><div class="fields">
<div class="field"><label for="incoming" data-copy="incomingLabel"></label><input id="incoming" name="incoming" type="number" min="0" max="500" step="1" required value="24" aria-describedby="incomingError"><p class="error" id="incomingError"></p></div><div class="field"><label for="people" data-copy="peopleLabel"></label><input id="people" name="people" type="number" min="1" max="20" step="1" required value="3" aria-describedby="peopleError"><p class="error" id="peopleError"></p></div><div class="field"><label for="perPerson" data-copy="perPersonLabel"></label><input id="perPerson" name="perPerson" type="number" min="1" max="50" step="1" required value="10" aria-describedby="perPersonError"><p class="error" id="perPersonError"></p></div>
</div><button type="submit" data-copy="calculate">Calculează</button></form><p id="status" role="status" aria-live="polite" aria-atomic="true"></p><section id="results" aria-labelledby="resultsTitle" hidden><h2 id="resultsTitle" data-copy="resultsTitle"></h2><dl><div><dt data-copy="capacity"></dt><dd id="capacity"></dd></div><div><dt data-copy="remaining"></dt><dd id="remaining"></dd></div><div><dt data-copy="load"></dt><dd id="load"></dd></div><div><dt data-copy="extra"></dt><dd id="extra"></dd></div></dl><label for="loadMeter" data-copy="load"></label><meter id="loadMeter" min="0" max="100" value="0" aria-describedby="meterHelp"></meter><p id="meterHelp" data-copy="meterHelp"></p></section><noscript>Activează JavaScript / Enable JavaScript.</noscript></main><script>
(()=>{"use strict";
function calculateCapacity(incoming,people,perPerson){if(!Number.isInteger(incoming)||incoming<0||incoming>500||!Number.isInteger(people)||people<1||people>20||!Number.isInteger(perPerson)||perPerson<1||perPerson>50)throw new RangeError("Invalid capacity inputs");const capacity=people*perPerson;return{capacity,remaining:Math.max(0,incoming-capacity),loadPercent:incoming/capacity*100,extraPeople:Math.max(0,Math.ceil(incoming/perPerson)-people)}}
const copy={ro:{title:"Simulator de capacitate CRM",intro:"Estimare demonstrativă pentru o zi, presupunând aceeași capacitate pentru fiecare persoană.",incomingLabel:"Solicitări primite (0–500)",peopleLabel:"Persoane disponibile (1–20)",perPersonLabel:"Solicitări / persoană (1–50)",calculate:"Calculează",resultsTitle:"Rezultatul estimării",capacity:"Capacitate totală",remaining:"Solicitări neacoperite",load:"Grad de încărcare",extra:"Persoane suplimentare necesare",within:"În capacitate",over:"Capacitate depășită",invalid:"Corectează câmpurile marcate înainte de calcul.",error:"Introdu un număr întreg între {min} și {max}.",meterHelp:"Scala grafică se oprește la 100%; procentul textual păstrează valoarea reală.",light:"Temă deschisă",dark:"Temă închisă"},en:{title:"CRM capacity simulator",intro:"Demo estimate for one day, assuming equal capacity for each team member.",incomingLabel:"Incoming requests (0–500)",peopleLabel:"Available people (1–20)",perPersonLabel:"Requests / person (1–50)",calculate:"Calculate",resultsTitle:"Capacity estimate",capacity:"Total capacity",remaining:"Uncovered requests",load:"Capacity utilization",extra:"Additional people needed",within:"Within capacity",over:"Over capacity",invalid:"Correct the marked fields before calculating.",error:"Enter a whole number between {min} and {max}.",meterHelp:"The graphic stops at 100%; the text shows the actual percentage.",light:"Light theme",dark:"Dark theme"}};
const $=id=>document.getElementById(id),ids=["incoming","people","perPerson"];let language="ro",theme="dark",result=null,errors=[];
function render(){const t=copy[language];document.documentElement.lang=language;document.documentElement.dataset.theme=theme;document.querySelectorAll("[data-copy]").forEach(node=>node.textContent=t[node.dataset.copy]);$("language").textContent=language==="ro"?"English":"Română";$("language").lang=language==="ro"?"en":"ro";$("theme").textContent=t[theme==="dark"?"light":"dark"];ids.forEach(id=>{const input=$(id),invalid=errors.includes(id);input.setAttribute("aria-invalid",String(invalid));$(id+"Error").textContent=invalid?t.error.replace("{min}",input.min).replace("{max}",input.max):""});$("results").hidden=!result;const format=new Intl.NumberFormat(language,{maximumFractionDigits:1});if(result){$("capacity").textContent=format.format(result.capacity);$("remaining").textContent=format.format(result.remaining);$("load").textContent=format.format(result.loadPercent)+"%";$("extra").textContent=format.format(result.extraPeople);$("loadMeter").value=Math.min(100,result.loadPercent);$("status").textContent=t[result.remaining>0?"over":"within"]+". "+t.load+": "+format.format(result.loadPercent)+"%."}else $("status").textContent=errors.length?t.invalid:""}
$("capacityForm").addEventListener("submit",event=>{event.preventDefault();errors=ids.filter(id=>{const input=$(id);return !input.checkValidity()||!Number.isInteger(input.valueAsNumber)});result=errors.length?null:calculateCapacity(...ids.map(id=>$(id).valueAsNumber));render();if(errors.length)$(errors[0]).focus()});
$("capacityForm").addEventListener("input",event=>{if(!ids.includes(event.target.id))return;result=null;errors=errors.filter(id=>id!==event.target.id);render()});
$("language").addEventListener("click",()=>{language=language==="ro"?"en":"ro";render()});$("theme").addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";render()});render();
})();
</script></body></html>
