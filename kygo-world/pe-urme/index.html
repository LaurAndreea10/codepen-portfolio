<style>
:root{
  --bg:#070d1c; --panel:rgba(12,21,42,.94); --panel2:#111d3a; --ink:#e9efff; --muted:#a3b3d6;
  --cyan:#4fe3ff; --amber:#ffb547; --violet:#b48cff; --ok:#5ee6a0; --bad:#ff8a80;
  --border:rgba(79,227,255,.28); --shadow:0 18px 50px rgba(0,0,0,.55);
  --font-body:'Inter',system-ui,sans-serif; --font-head:'Fraunces',Georgia,serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:16px;
}
body.light{ --panel:rgba(246,248,255,.97); --panel2:#e7ecfa; --ink:#0d1630; --muted:#3e4b6b; --border:rgba(13,60,120,.3); --cyan:#006d8f; --amber:#9a5800; --violet:#5b2fb3; --ok:#0b7a43; --bad:#b3261e; }
body.hc{ --panel:#000; --panel2:#000; --ink:#fff; --muted:#fff; --cyan:#ffff00; --amber:#ffff00; --violet:#00ffff; --border:#fff; --ok:#00ff66; --bad:#ff6b6b; }
body.hc.light{ --panel:#fff; --panel2:#fff; --ink:#000; --muted:#000; --cyan:#0000c8; --amber:#0000c8; --border:#000; --ok:#006400; --bad:#a00000; }
body.legible{ --font-body:'Atkinson Hyperlegible',Verdana,sans-serif; --font-head:'Atkinson Hyperlegible',Verdana,sans-serif; letter-spacing:.01em }
html.large{ font-size:125% }
*{ box-sizing:border-box }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
#game{ position:fixed; inset:0; outline:none }
#game canvas{ display:block; width:100%; height:100% }
#game:focus-visible{ box-shadow:inset 0 0 0 4px var(--amber) }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0 }
button,select,input{ font:inherit; color:inherit }
button{ cursor:pointer }
:focus-visible{ outline:3px solid var(--amber); outline-offset:3px }
.btn{ min-height:44px; padding:.6rem 1rem; border-radius:12px; border:1.5px solid var(--border); background:var(--panel2); color:var(--ink); font-weight:600; display:inline-flex; align-items:center; gap:.5rem; justify-content:center; transition:transform .15s, background .15s }
.btn:hover{ background:color-mix(in srgb, var(--panel2) 70%, var(--cyan)) }
.btn.primary{ background:var(--cyan); color:#04121c; border-color:var(--cyan) }
body.hc .btn.primary{ color:#000 }
body.light .btn.primary{ color:#fff }
.btn.amber{ background:var(--amber); color:#1d1200; border-color:var(--amber) }
.btn kbd{ font-family:var(--font-mono); font-size:.75em; padding:.1em .4em; border-radius:6px; border:1px solid currentColor; opacity:.8 }
kbd{ font-family:var(--font-mono) }

/* HUD */
#hud{ position:fixed; inset:0; pointer-events:none; display:none }
body.playing #hud{ display:block }
.hud-top{ position:absolute; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap }
.hud-card{ pointer-events:auto; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:.55rem .8rem; box-shadow:var(--shadow); backdrop-filter:blur(8px) }
.region{ font-family:var(--font-head); font-size:1.05rem; font-weight:700; margin:0 }
.slots{ display:flex; gap:6px; margin-top:6px; list-style:none; padding:0 }
.slot{ width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:1.25rem; border:1.5px dashed var(--muted); opacity:.45; filter:grayscale(1) }
.slot.found{ opacity:1; filter:none; border:1.5px solid var(--amber); background:color-mix(in srgb, var(--amber) 18%, transparent) }
.hud-actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end }
.hud-actions .btn{ min-height:42px; padding:.45rem .7rem; font-size:.9rem }
.event{ position:absolute; top:max(10px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); font-size:.85rem; padding:.35rem .8rem; border-radius:999px; background:var(--panel); border:1px solid var(--amber); color:var(--amber); white-space:nowrap }
@media (max-width:1180px){ .event{ top:auto; bottom:calc(150px + env(safe-area-inset-bottom)); } }
#prompt{ position:absolute; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none; pointer-events:auto; align-items:center; gap:.8rem; }
#prompt.show{ display:flex }
#captions{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none }
.cap{ background:rgba(0,0,0,.82); color:#fff; padding:.3rem .7rem; border-radius:8px; font-size:.95rem; animation:capIn .2s ease-out }
body.light .cap{ background:#0d1630 }
@keyframes capIn{ from{opacity:0; transform:translateY(6px)} }
body.rm .cap{ animation:none }
#statusline{ position:absolute; left:10px; bottom:calc(10px + env(safe-area-inset-bottom)); font-size:.8rem; color:var(--muted); background:var(--panel); padding:.3rem .6rem; border-radius:8px; border:1px solid var(--border) }
body.touch #statusline{ display:none }

/* touch */
#touch{ display:none }
body.touch.playing #touch{ display:block }
#joy{ position:absolute; left:calc(18px + env(safe-area-inset-left)); bottom:calc(18px + env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; background:rgba(255,255,255,.07); border:2px solid var(--border); pointer-events:auto; touch-action:none }
#knob{ position:absolute; left:41px; top:41px; width:50px; height:50px; border-radius:50%; background:var(--cyan); opacity:.85 }
.tbtns{ position:absolute; right:calc(14px + env(safe-area-inset-right)); bottom:calc(18px + env(safe-area-inset-bottom)); display:grid; gap:10px; pointer-events:auto }
.tbtns .btn{ min-width:120px; min-height:54px }
body.touch #prompt{ bottom:calc(170px + env(safe-area-inset-bottom)) }
body.touch #captions{ bottom:calc(240px + env(safe-area-inset-bottom)) }

/* dialogs */
dialog{ border:none; padding:0; background:transparent; color:var(--ink); max-width:min(680px, 94vw); width:100%; max-height:92vh }
dialog::backdrop{ background:rgba(3,6,15,.72); backdrop-filter:blur(3px) }
.panel{ background:var(--panel); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:clamp(1rem,3vw,1.8rem); max-height:92vh; overflow:auto }
.kicker{ font-family:var(--font-mono); font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--cyan); margin:0 0 .4rem }
h1,h2,h3{ font-family:var(--font-head); margin:.1rem 0 .6rem; line-height:1.15 }
h1{ font-size:clamp(2rem,6vw,3.1rem) }
h1 .accent{ color:var(--amber) }
h2{ font-size:1.55rem }
p{ line-height:1.55 }
.muted{ color:var(--muted) }
.modes{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:1rem 0 }
.mode{ text-align:left; display:block; padding:.9rem; border-radius:14px; border:2px solid var(--border); background:var(--panel2) }
.mode[aria-pressed="true"]{ border-color:var(--amber); box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 35%, transparent) }
.mode strong{ display:block; font-size:1.05rem; margin-bottom:.2rem }
.mode span{ color:var(--muted); font-size:.9rem }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.row.end{ justify-content:flex-end }
.event-card{ border:1px dashed var(--amber); border-radius:14px; padding:.7rem .9rem; margin:.4rem 0 1rem; font-size:.92rem }
.event-card strong{ color:var(--amber) }
@media (max-width:520px){ .modes{ grid-template-columns:1fr } }

/* settings */
.set-group{ margin:1rem 0 .4rem; font-family:var(--font-mono); text-transform:uppercase; font-size:.75rem; letter-spacing:.12em; color:var(--cyan) }
.set{ display:grid; grid-template-columns:1fr auto; gap:.2rem 1rem; padding:.65rem 0; border-bottom:1px solid var(--border); align-items:center }
.set label{ font-weight:600 }
.set .d{ grid-column:1/-1; color:var(--muted); font-size:.85rem; margin:0 }
.set input[type=checkbox]{ width:26px; height:26px; accent-color:var(--cyan) }
.set select{ min-height:40px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); padding:.3rem .5rem }
.set input[type=range]{ width:150px; accent-color:var(--cyan) }
.help-list{ padding-left:1.1rem; line-height:1.7 }
.help-list kbd{ border:1px solid var(--border); border-radius:6px; padding:0 .35em; background:var(--panel2) }

/* challenge */
.timer{ height:8px; border-radius:99px; background:var(--panel2); overflow:hidden; margin:.4rem 0 1rem }
.timer span{ display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--amber),var(--cyan)) }
.timer.off{ display:none }
.q-prompt{ text-align:center; margin:.6rem 0 1rem }
.big-num{ font-family:var(--font-head); font-size:clamp(3rem,12vw,5rem); font-weight:700; color:var(--amber); display:block; line-height:1 }
.ghost-phrase{ font-family:var(--font-mono); font-size:clamp(1.6rem,6vw,2.4rem); color:var(--violet); display:block }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
.opt{ min-height:60px; font-size:1.05rem; border-radius:14px }
.opt.right{ background:color-mix(in srgb, var(--ok) 30%, var(--panel2)); border-color:var(--ok) }
.opt.wrong{ background:color-mix(in srgb, var(--bad) 30%, var(--panel2)); border-color:var(--bad) }
#chFeedback{ min-height:1.6em; font-weight:600; text-align:center; margin:.8rem 0 .2rem }
#chFeedback.good{ color:var(--ok) } #chFeedback.bad{ color:var(--bad) }
.chfoot{ display:flex; justify-content:space-between; color:var(--muted); font-size:.85rem; margin-top:.4rem }
.dict{ list-style:none; padding:0; margin:0 0 1rem; display:grid; gap:8px }
.dict li{ display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:center; background:var(--panel2); border-radius:12px; padding:.5rem .7rem }
.dict .g{ font-family:var(--font-mono); color:var(--violet) }
.doors{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:.6rem 0 }
.door{ min-height:120px; border-radius:16px 16px 6px 6px; flex-direction:column; font-size:1rem; border-width:3px; border-color:var(--c) }
.door .sym{ font-size:2.2rem; line-height:1 }
.door.lit{ background:var(--c); color:#000; transform:scale(1.06) }
body.rm .door.lit{ transform:none }
.door.hint{ outline:4px dashed var(--amber); outline-offset:3px }
.door:disabled{ cursor:default; opacity:.92 }
@media (max-width:520px){ .doors{ grid-template-columns:1fr 1fr } .opts{ grid-template-columns:1fr } }
.pumpkin-svg{ display:block; margin:0 auto .3rem }
.stars{ font-size:2rem; letter-spacing:.2em; color:var(--amber); text-align:center }
.badges{ display:flex; gap:8px; flex-wrap:wrap; margin:.8rem 0 }
.badge{ border:1px solid var(--amber); color:var(--amber); border-radius:999px; padding:.3rem .8rem; font-weight:600; font-size:.9rem }
#nogl{ display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; max-width:420px; color:var(--muted) }
body.nogl #nogl{ display:block }

#backKW{ color:var(--cyan) }
.regions{ list-style:none; padding:0; margin:1rem 0; display:grid; gap:10px }
.regions li{ display:grid; grid-template-columns:auto 1fr auto; gap:.8rem; align-items:center; background:var(--panel2); border:1.5px solid var(--border); border-radius:14px; padding:.7rem .9rem }
.regions li.current{ border-color:var(--amber) }
.regions li.locked{ opacity:.6 }
.regions .ico{ font-size:1.8rem }
.regions .meta{ color:var(--muted); font-size:.85rem; display:block }
.meter{ position:relative; height:46px; border-radius:12px; background:var(--panel2); border:1.5px solid var(--border); overflow:hidden; margin:1rem 0 }
.meter .zone{ position:absolute; top:0; bottom:0; background:color-mix(in srgb, var(--ok) 45%, transparent); border-left:2px solid var(--ok); border-right:2px solid var(--ok) }
.meter .mark{ position:absolute; top:-2px; bottom:-2px; width:6px; margin-left:-3px; background:var(--amber); border-radius:3px; box-shadow:0 0 0 2px #0008 }
.court{ text-align:center; font-size:3rem; line-height:1.1; margin:.4rem 0 }
.goal{ position:relative; height:150px; border:5px solid #e9efff; border-bottom:none; border-radius:6px 6px 0 0; background:repeating-linear-gradient(90deg,#ffffff14 0 2px,transparent 2px 16px),repeating-linear-gradient(0deg,#ffffff14 0 2px,transparent 2px 16px); margin:.6rem auto 0; max-width:420px }
body.light .goal{ border-color:#0d1630 }
.goal .keeper{ position:absolute; bottom:6px; left:50%; font-size:3rem; transform:translateX(-50%); transition:left .45s cubic-bezier(.3,1.4,.5,1), transform .45s }
.goal .ball{ position:absolute; bottom:-46px; left:50%; font-size:2rem; transform:translateX(-50%); transition:left .5s ease-out, bottom .5s ease-out }
body.rm .goal .keeper, body.rm .goal .ball{ transition:none }
.pitch-line{ height:54px }
.aimwrap{ display:flex; justify-content:center }
.aimwrap canvas{ max-width:100%; border-radius:14px; border:1.5px solid var(--border); background:#0b3d2e }
.lanes{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; height:190px; margin:.6rem 0; position:relative }
.lane{ position:relative; border-radius:12px; background:linear-gradient(180deg,#1f6fa833,#1fa3d655); border:1.5px solid var(--border); overflow:hidden }
.lane.cue{ border-color:var(--amber); box-shadow:inset 0 0 0 3px var(--amber) }
.ringfx{ position:absolute; left:50%; top:-40px; font-size:2.2rem; transform:translateX(-50%) }
.kygo-slider{ position:absolute; bottom:4px; font-size:2.2rem; transition:left .2s }
body.rm .kygo-slider{ transition:none }
.lane-btns{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-roledescription="joc" aria-label="Kygo: Pe Urme"></div>
<p id="nogl" data-i18n="nogl"></p>
<div id="sr" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-card">
      <p class="region" id="regionName"></p>
      <ul class="slots" id="slots" aria-label=""></ul>
    </div>
    <div class="hud-actions">
      <button class="btn hud-card" id="bBark"><span aria-hidden="true">🐾</span> <span data-i18n="bark"></span> <kbd>B</kbd></button>
      <button class="btn hud-card" id="bFollow" aria-pressed="false"><span aria-hidden="true">👃</span> <span id="followLbl" data-i18n="follow"></span> <kbd data-i18n="spaceKey"></kbd></button>
      <button class="btn hud-card" id="bMap" data-i18n-aria="map"><span aria-hidden="true">🗺</span></button>
      <button class="btn hud-card" id="bHelp" data-i18n-aria="help"><span aria-hidden="true">?</span></button>
      <button class="btn hud-card" id="bSet" data-i18n-aria="settings"><span aria-hidden="true">⚙</span></button>
      <button class="btn hud-card" id="bLang" data-i18n="langShort" data-i18n-aria="langAria"></button>
      <button class="btn hud-card" id="bPause" data-i18n-aria="pause"><span aria-hidden="true">❚❚</span></button>
    </div>
  </div>
  <div class="event" id="eventBadge"></div>
  <div id="captions" aria-hidden="true"></div>
  <div id="prompt" class="hud-card"><span id="promptTxt"></span><button class="btn amber" id="bAction"><span data-i18n="action"></span> <kbd>E</kbd></button></div>
  <div id="statusline" data-i18n="keysHint"></div>
</div>

<div id="touch" aria-hidden="true">
  <div id="joy"><div id="knob"></div></div>
  <div class="tbtns">
    <button class="btn hud-card" id="tBark" tabindex="-1">🐾 <span data-i18n="bark"></span></button>
    <button class="btn hud-card" id="tFollow" tabindex="-1">👃 <span data-i18n="follow"></span></button>
  </div>
</div>

<!-- START -->
<dialog id="dlgStart" aria-labelledby="stTitle">
  <div class="panel">
    <p class="kicker" id="stKicker"></p>
    <h1 id="stTitle"><span data-i18n="titleA"></span> <span class="accent" data-i18n="titleB"></span></h1>
    <p id="stTagline"></p>
    <div class="event-card"><strong id="evTitle"></strong><br><span id="evText"></span></div>
    <h2 style="font-size:1.1rem" data-i18n="chooseMode"></h2>
    <div class="modes" role="group" data-i18n-aria="chooseMode">
      <button class="mode btn" data-mode="adventure" aria-pressed="true"><strong data-i18n="mode_adventure"></strong><span data-i18n="mode_adventure_d"></span></button>
      <button class="mode btn" data-mode="walk" aria-pressed="false"><strong data-i18n="mode_walk"></strong><span data-i18n="mode_walk_d"></span></button>
    </div>
    <div class="row">
      <button class="btn primary" id="bPlay" autofocus>▶ <span data-i18n="play"></span></button>
      <button class="btn" id="bStMap">🗺 <span data-i18n="map"></span></button>
      <button class="btn" id="bStSet">⚙ <span data-i18n="settings"></span></button>
      <button class="btn" id="bStHelp">? <span data-i18n="help"></span></button>
      <button class="btn" id="bStLang" data-i18n="langBtn" data-i18n-aria="langAria"></button>
    </div>
    <p class="muted" style="font-size:.85rem;margin-bottom:0"><span data-i18n="credits"></span> <a href="../" id="backKW" data-i18n="backKW"></a></p>
  </div>
</dialog>

<!-- SETTINGS -->
<dialog id="dlgSet" aria-labelledby="setTitle">
  <div class="panel">
    <p class="kicker" data-i18n="kickerSet"></p>
    <h2 id="setTitle" data-i18n="settings"></h2>
    <div id="setBody"></div>
    <div class="row end" style="margin-top:1rem"><button class="btn primary" data-close data-i18n="close"></button></div>
  </div>
</dialog>

<!-- HELP -->
<dialog id="dlgHelp" aria-labelledby="helpTitle">
  <div class="panel">
    <h2 id="helpTitle" data-i18n="help"></h2>
    <ul class="help-list" id="helpList"></ul>
    <div class="row end"><button class="btn primary" data-close data-i18n="close"></button></div>
  </div>
</dialog>

<!-- PAUSE -->
<dialog id="dlgPause" aria-labelledby="pTitle">
  <div class="panel">
    <h2 id="pTitle" data-i18n="paused"></h2>
    <p id="pStatus" class="muted"></p>
    <div class="row">
      <button class="btn primary" data-close autofocus>▶ <span data-i18n="resume"></span></button>
      <button class="btn" id="bPSet">⚙ <span data-i18n="settings"></span></button>
      <button class="btn" id="bPHelp">? <span data-i18n="help"></span></button>
      <button class="btn" id="bPMap">🗺 <span data-i18n="map"></span></button>
      <button class="btn" id="bPRestart">↺ <span data-i18n="restart"></span></button>
    </div>
  </div>
</dialog>

<!-- CHALLENGE -->
<dialog id="dlgCh" aria-labelledby="chTitle" aria-describedby="chDesc">
  <div class="panel">
    <p class="kicker" id="chKicker"></p>
    <h2 id="chTitle"></h2>
    <p id="chDesc" class="muted"></p>
    <div class="timer" id="chTimer"><span></span></div>
    <div id="chBody"></div>
    <p id="chFeedback" role="status" aria-live="polite"></p>
    <div class="chfoot"><span id="chScore"></span><span id="chRound"></span></div>
  </div>
</dialog>

<!-- MAP -->
<dialog id="dlgMap" aria-labelledby="mapTitle">
  <div class="panel">

    const placeKygo = () => { kygo.style.left = `calc(${lane * 33.33 + 16.66}% - 1.1rem)`; };
    const btns = LANES.map((l, i) => { const b = document.createElement('button'); b.className = 'btn opt'; b.textContent = t('sl_' + l); b.addEventListener('click', () => choose(i)); bb.appendChild(b); return b; });
    let ringEl = null;
    const spawn = () => {
      busy = false; cur = Math.floor(Math.random() * 3); laneEls.forEach(e => e.classList.remove('cue')); laneEls[cur].classList.add('cue');
      ringEl = document.createElement('span'); ringEl.className = 'ringfx'; ringEl.textContent = '🛟'; laneEls[cur].appendChild(ringEl);
      const win = tolerant() ? 0 : 3200 / S.speed;
      if (!S.reducedMotion){ ringEl.animate([{ top:'-40px' }, { top:'calc(100% - 50px)' }], { duration: win || 2200, fill:'forwards', easing:'ease-in' }); }
      else ringEl.style.top = '40%';
      tone({ f:F[cur], type:'triangle', dur:.35, vol:.2, pan:PAN[cur] }); SFX.splash(PAN[cur]); announce(`${t('sl_cue')} ${t('sl_lane_' + LANES[cur])}`);
      $('#chRound').textContent = t('tryOf', { i:k + 1, n:total }); $('#chScore').textContent = t('score', { c:got, t:k });
      btns[1].focus(); startScan();
      if (win) startTimer(win, () => choose(-1));
    };
    const choose = i => {
      if (busy) return; busy = true; clearInterval(chTimerI); clearInterval(scanI); k++;
      if (i >= 0){ lane = i; placeKygo(); }
      laneEls.forEach(e => e.classList.remove('cue'));
      if (i === cur){ got++; SFX.chime(); feedback(t('sl_got'), true); announce(t('sl_got')); buzz(40); }
      else { SFX.soft(); const m = (i < 0 ? t('time_up') + ' ' : '') + t('sl_miss', { lane:t('sl_lane_' + LANES[cur]) }); feedback(m, false); speak(m); }
      if (ringEl) ringEl.remove();
      $('#chScore').textContent = t('score', { c:got, t:k });
      later(() => { if (k >= total){ CH.total = total; CH.correct = got; finishChallenge(starsFrom(got / total)); } else { feedback('', true); spawn(); } }, 900 / S.speed);
    };
    CH.onKey = e => { const m = { ArrowLeft:0, ArrowUp:1, ArrowDown:1, ArrowRight:2 }[e.key]; if (m !== undefined && !busy){ e.preventDefault(); choose(m); } };
    placeKygo(); speak(t('sl_desc'));
    later(spawn, 1800 / S.speed);
  }
};
$('#dlgCh').addEventListener('keydown', e => { if (CH && CH.onKey) CH.onKey(e); });

/* ================= win / run / regions ================= */
const fmtTime = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const elapsed = () => elapsedBeforePause + (startTime ? performance.now() - startTime : 0);
function saveRun(){ store.set('kygo-pe-urme-run-' + REG.id, { found:toys().map(o => [o.found, o.stars]), elapsed:elapsed() }); }
function loadRun(reg){
  const saved = store.get('kygo-pe-urme-run-' + reg.id, null) || (reg.id === 'manor' ? store.get('kygo-pe-urme-run', null) : null);
  reg.toys.forEach((o, i) => { const f = saved && saved.found && saved.found[i]; o.found = !!(f && f[0]); o.stars = f ? f[1] : 0; });
  return saved ? saved.elapsed || 0 : 0;
}
function nextRegionId(){ return REG.id === 'manor' ? 'arena' : null; }
function win(){
  state = 'win'; setFollow(false, true);
  const stars = toys().reduce((a, o) => a + o.stars, 0);
  const el = elapsed(); elapsedBeforePause = el; startTime = 0;
  $('#wKicker').textContent = `${t('worldName')} · ${regName(REG.id)}`;
  $('#wTitle').textContent = t('win_title_' + REG.id); $('#wText').textContent = t('win_text_' + REG.id);
  $('#wStars').textContent = '★'.repeat(stars) + '☆'.repeat(12 - stars);
  $('#wInfo').textContent = t('win_info', { s:stars, t:fmtTime(el) });
  $('#wNext').textContent = t('win_next_' + REG.id);
  const badges = [REG.id === 'manor' ? t('badge_nose') : t('badge_champ')];
  if (REG.id === 'manor' && HALLOWEEN) badges.push(t('badge_hw')); if (S.mode === 'walk') badges.push(t('badge_calm')); if (stars === 12) badges.push(t('badge_perfect'));
  $('#wBadges').innerHTML = badges.map(b => `<span class="badge">${b}</span>`).join('');
  const nx = nextRegionId(); $('#bNextRegion').textContent = nx ? t('next_go', { reg:regName(nx) }) : t('next_map');
  const done = doneMap(); const prev = done[REG.id]; if (!prev || stars > prev.stars || (stars === prev.stars && el < prev.time)) done[REG.id] = { stars, time:el }; store.set('kygo-pe-urme-done', done);
  caption(t('cap_win')); SFX.fanfare(); setTimeout(SFX.fanfare, 900); if (REG.id === 'arena') setTimeout(SFX.cheer, 400);
  if (glOK && !S.reducedMotion){ let k = 0; const fw = setInterval(() => { spawnFirework(); if (++k > 14) clearInterval(fw); }, 380); }
  speak(`${t('win_title_' + REG.id)} ${t('win_text_' + REG.id)} ${t('win_info', { s:stars, t:fmtTime(el) })}. ${badges.join(', ').replace(/[^\p{L}\p{N}\s,:.]/gu, '')}`);
  store.set('kygo-pe-urme-run-' + REG.id, null);
  openDialog('#dlgWin');
}
function resetRun(){
  toys().forEach(o => { o.found = false; o.stars = 0; });
  dog.x = REG.start.x; dog.z = REG.start.z; dog.rot = Math.PI; elapsedBeforePause = 0; startTime = performance.now();
  nearAnnounced = null; hidePrompt(); renderSlots(); store.set('kygo-pe-urme-run-' + REG.id, null); showRegion();
}
function travel(id, announceIt = true){
  if (!REGIONS[id]) return;
  if (state === 'play' || state === 'paused') saveRun();
  setFollow(false, true);
  REG = REGIONS[id]; S.region = id; saveSettings();
  elapsedBeforePause = loadRun(REG); startTime = state === 'menu' ? 0 : performance.now();
  dog.x = REG.start.x; dog.z = REG.start.z; dog.rot = Math.PI; nearAnnounced = null; hidePrompt();
  showRegion(); applyI18n();
  if (announceIt) speak(t('travel', { reg:regName(id) }) + ' ' + t('intro_' + id));
}
function renderMap(){
  const done = doneMap();
  const list = $('#regionList'); list.innerHTML = '';
  ['manor', 'arena'].forEach(id => {
    const reg = REGIONS[id]; const n = id === REG.id ? toys().filter(o => o.found).length : (store.get('kygo-pe-urme-run-' + id, null)?.found || []).filter(f => f[0]).length;
    const li = document.createElement('li'); if (id === REG.id) li.className = 'current';
    const meta = done[id] ? t('reg_done', { s:done[id].stars }) + ' · ' + t('reg_progress', { n }) : t('reg_progress', { n });
    li.innerHTML = `<span class="ico" aria-hidden="true">${reg.emoji}</span><span><strong>${regName(id)}</strong><span class="meta">${t('kick_' + id)} · ${meta}</span></span>`;
    const b = document.createElement('button'); b.className = 'btn' + (id === REG.id ? '' : ' primary');
    b.textContent = id === REG.id ? t('here_now') : t('go'); b.disabled = id === REG.id;
    b.setAttribute('aria-label', `${b.textContent}: ${regName(id)}`);
    b.addEventListener('click', () => { $('#dlgMap').close(); const wasMenu = state === 'menu'; travel(id, !wasMenu); if (!wasMenu){ state = 'play'; startTime = performance.now(); $('#game').focus(); } });
    li.appendChild(b); list.appendChild(li);
  });
  FUTURE.forEach(id => { const li = document.createElement('li'); li.className = 'locked';
    li.innerHTML = `<span class="ico" aria-hidden="true">${{ coast:'🌊', garden:'🌻', kitchen:'🍕', more:'✨' }[id]}</span><span><strong>${regName(id)}</strong><span class="meta">${t('soon')}</span></span><span></span>`; list.appendChild(li); });
}

/* ================= UI ================= */
function renderSlots(){
  const ul = $('#slots'); ul.setAttribute('aria-label', `${t('slotsLabel')} · ${regName(REG.id)}`);
  ul.innerHTML = toys().map(o => `<li class="slot ${o.found ? 'found' : ''}" aria-label="${toyName(o)}: ${o.found ? t('slotFound') : t('slotMissing')}"><span aria-hidden="true">${o.emoji}</span></li>`).join('');
}
function eventInfo(){ return REG.id === 'arena' ? ['event_games', 'event_d_games'] : HALLOWEEN ? ['event_hw', 'event_d_hw'] : ['event_night', 'event_d_night']; }
function applyI18n(){
  document.documentElement.lang = S.lang;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('#regionName').textContent = regName(REG.id);
  $('#stKicker').textContent = `${t('worldName')} · ${t('kick_' + REG.id)}`; $('#stTagline').textContent = t('tag_' + REG.id);
  $('#game').setAttribute('aria-label', `${t('titleA')} ${t('titleB')} — ${regName(REG.id)}. ${t('keysHint')}`);
  $('#game').setAttribute('aria-roledescription', S.lang === 'ro' ? 'joc' : 'game');
  const [ev, evd] = eventInfo(); $('#eventBadge').textContent = t(ev); $('#evTitle').textContent = t(ev); $('#evText').textContent = t(evd);
  $('#helpList').innerHTML = t('help_items').map(h => `<li>${h}</li>`).join('');
  $('#followLbl').textContent = autoFollow ? t('following') : t('follow');
  document.title = `${t('titleA')} ${t('titleB')} — ${regName(REG.id)}`;
  try { const u = new URL('../', location.href); u.searchParams.set('lang', S.lang); $('#backKW').href = '../'; } catch(e){}
  renderSlots();
  if (glOK && REG.id === 'arena') drawScoreboard(REG, toys().filter(o => o.found).length);
  if ($('#dlgSet').open) renderSettings();
  if ($('#dlgMap').open) renderMap();
}
function applySettings(){
  const b = document.body;
  b.classList.toggle('hc', S.highContrast); b.classList.toggle('rm', S.reducedMotion); b.classList.toggle('legible', S.legible); b.classList.toggle('light', S.light);
  document.documentElement.classList.toggle('large', S.largeText);
  $$('.mode').forEach(m => m.setAttribute('aria-pressed', String(m.dataset.mode === S.mode)));
  applyVolumes(); refreshColors(); applyI18n();
}
const SCHEMA = [
  ['g_see', [['highContrast','check'], ['colorblind','select',['none','protan','deutan','tritan']], ['largeText','check'], ['legible','check'], ['light','check'], ['reducedMotion','check'], ['trailVisual','check']]],
  ['g_hear', [['narration','check'], ['captions','check'], ['trailAudio','check'], ['music','range',0,1,.1], ['sfx','range',0,1,.1]]],
  ['g_motor', [['oneSwitch','check'], ['haptics','check'], ['trailHaptic','check'], ['speed','range',.5,1.5,.25]]],
  ['g_game', [['mode','select',['adventure','walk']]]]
];
function renderSettings(){
  const body = $('#setBody'); body.innerHTML = '';
  SCHEMA.forEach(([g, items]) => {
    const h = document.createElement('h3'); h.className = 'set-group'; h.textContent = t(g); body.appendChild(h);
    items.forEach(([k, type, a, b, c]) => {
      const row = document.createElement('div'); row.className = 'set'; const id = 'set-' + k;
      const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = t('set_' + k); row.appendChild(lab);
      let inp;
      if (type === 'check'){ inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!S[k]; inp.addEventListener('change', () => { S[k] = inp.checked; commit(); }); }
      else if (type === 'select'){ inp = document.createElement('select'); a.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = k === 'mode' ? t('mode_' + v) : t('cb_' + v); inp.appendChild(o); }); inp.value = S[k]; inp.addEventListener('change', () => { S[k] = inp.value; commit(); }); }
      else { inp = document.createElement('input'); inp.type = 'range'; inp.min = a; inp.max = b; inp.step = c; inp.value = S[k];
        const fmt = () => `${Math.round(S[k] * 100)}%`; inp.setAttribute('aria-valuetext', fmt());
        inp.addEventListener('input', () => { S[k] = parseFloat(inp.value); inp.setAttribute('aria-valuetext', fmt()); commit(); }); }
      inp.id = id; inp.setAttribute('aria-describedby', id + '-d'); row.appendChild(inp);
      const d = document.createElement('p'); d.className = 'd'; d.id = id + '-d'; d.textContent = t('setd_' + k); row.appendChild(d);
      body.appendChild(row);
    });
  });
}
function commit(){ saveSettings(); applySettings(); }

let returnFocus = null;
function openDialog(sel){ clearKeys(); const d = $(sel); if (d.open) return; returnFocus = document.activeElement; try { d.showModal(); } catch(e){ d.setAttribute('open', ''); } }
$$('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target.closest('[data-close]')) d.close(); });
  d.addEventListener('close', () => {
    if (d.id === 'dlgPause' && state === 'paused'){ state = 'play'; startTime = performance.now(); }
    const anyOpen = $$('dialog').some(x => x.open);
    if (!anyOpen && (state === 'play' || state === 'win')) $('#game').focus();
    else if (returnFocus && document.contains(returnFocus) && d.id !== 'dlgCh') try { returnFocus.focus(); } catch(e){}
  });
});
$('#dlgCh').addEventListener('cancel', e => e.preventDefault());
$('#dlgStart').addEventListener('cancel', e => e.preventDefault());

function toggleLang(){ S.lang = S.lang === 'ro' ? 'en' : 'ro'; commit(); speak(t('langChanged')); }
function toggleMute(){ A.muted = !A.muted; applyVolumes(); if (A.muted) try { speechSynthesis.cancel(); } catch(e){} announce(A.muted ? t('muted') : t('unmuted')); }
function openPause(){ if (state !== 'play') return; elapsedBeforePause = elapsed(); startTime = 0; state = 'paused'; setFollow(false, true); $('#pStatus').textContent = statusText(); openDialog('#dlgPause'); }
function openSettings(){ renderSettings(); openDialog('#dlgSet'); setTimeout(() => { const f = $('#setBody input, #setBody select'); if (f) f.focus(); }, 50); }
function openMap(){ renderMap(); openDialog('#dlgMap'); setTimeout(() => { const f = $('#regionList button:not([disabled])'); if (f) f.focus(); }, 50); }
function clearKeys(){ for (const k in keys) keys[k] = false; joy.x = joy.z = 0; }

$('#bPlay').addEventListener('click', () => {
  initAudio(); $('#dlgStart').close(); document.body.classList.add('playing');
  elapsedBeforePause = loadRun(REG); showRegion(); renderSlots();
  state = 'play'; startTime = performance.now(); $('#game').focus();
  setTimeout(() => speak(toys().some(o => o.found) ? statusText() : t('intro_' + REG.id)), 300);
});
$$('.mode').forEach(m => m.addEventListener('click', () => { S.mode = m.dataset.mode; commit(); }));
$('#bStSet').addEventListener('click', openSettings);
$('#bStHelp').addEventListener('click', () => openDialog('#dlgHelp'));
$('#bStLang').addEventListener('click', toggleLang);
$('#bStMap').addEventListener('click', openMap);
$('#bBark').addEventListener('click', bark); $('#tBark').addEventListener('click', bark);
$('#bFollow').addEventListener('click', () => setFollow(!autoFollow)); $('#tFollow').addEventListener('click', () => setFollow(!autoFollow));
$('#bHelp').addEventListener('click', () => openDialog('#dlgHelp'));
$('#bSet').addEventListener('click', openSettings);
$('#bMap').addEventListener('click', () => { if (state === 'play'){ elapsedBeforePause = elapsed(); startTime = 0; } openMap(); });
$('#bLang').addEventListener('click', toggleLang);
$('#bPause').addEventListener('click', openPause);
$('#bAction').addEventListener('click', tryInteract);
$('#bPSet').addEventListener('click', openSettings);
$('#bPHelp').addEventListener('click', () => openDialog('#dlgHelp'));
$('#bPMap').addEventListener('click', () => { $('#dlgPause').close(); openMap(); });
$('#bPRestart').addEventListener('click', () => { $('#dlgPause').close(); resetRun(); speak(t('intro_' + REG.id)); });
$('#bExplore').addEventListener('click', () => $('#dlgWin').close());
$('#bReplay').addEventListener('click', () => { $('#dlgWin').close(); resetRun(); state = 'play'; speak(t('intro_' + REG.id)); });
$('#bNextRegion').addEventListener('click', () => { $('#dlgWin').close(); const nx = nextRegionId(); if (nx){ state = 'play'; travel(nx); } else openMap(); });
$('#dlgMap').addEventListener('close', () => { if (state === 'play' && !startTime) startTime = performance.now(); });

addEventListener('keydown', e => {
  if ($$('dialog').some(d => d.open)) return;
  if (state !== 'play' && state !== 'win') return;
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (e.repeat && !['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) return;
  keys[k] = true;
  if (k === 'b') bark();
  else if (k === ' ') setFollow(!autoFollow);
  else if (k === 'e' || k === 'enter'){ if (document.activeElement === $('#game') || document.activeElement === document.body) tryInteract(); }
  else if (k === 'escape' || k === 'p') openPause();
  else if (k === 'h') openDialog('#dlgHelp');
  else if (k === 'g') openMap();
  else if (k === 'm') toggleMute();
  else if (k === 'l') toggleLang();
  else if (k === 't') speak(statusText());
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', clearKeys);
(() => {
  const base = $('#joy'), knob = $('#knob'); let id = null;
  const move = e => { const r = base.getBoundingClientRect(); let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2); const m = r.width / 2 - 20, l = Math.hypot(x, y); if (l > m){ x *= m / l; y *= m / l; }
    knob.style.transform = `translate(${x}px,${y}px)`; joy.x = x / m; joy.z = y / m; };
  base.addEventListener('pointerdown', e => { id = e.pointerId; base.setPointerCapture(id); move(e); initAudio(); });
  base.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
  const end = () => { id = null; joy.x = joy.z = 0; knob.style.transform = ''; };
  base.addEventListener('pointerup', end); base.addEventListener('pointercancel', end);
})();
document.body.classList.toggle('touch', matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window);
addEventListener('resize', () => { if (!glOK) return; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') openPause(); });

/* ================= boot ================= */
glOK = initThree();
if (!glOK) document.body.classList.add('nogl');
Object.values(REGIONS).forEach(r => { if (!r.apply) r.apply = () => {}; if (!r.restore) r.restore = []; if (!r.npcs) r.npcs = []; });
loadRun(REG); showRegion(); applySettings();
let last = performance.now();
(function loop(){ requestAnimationFrame(loop); const n = performance.now(); const dt = Math.min(.05, (n - last) / 1000); last = n; update(dt); if (glOK) renderer.render(scene, camera); })();
openDialog('#dlgStart');
setTimeout(() => $('#bPlay').focus(), 50);
window.__kygo = { REGIONS, get REG(){ return REG; }, get TOYS(){ return REG.toys; }, dog, get state(){ return state; }, startChallenge:o => startChallenge(o), setFollow, travel, version:VERSION };
})();
</script>
