<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>SEO Inspector</title>
<style>
  body{width:360px;margin:0;font:13px/1.45 Inter,system-ui,sans-serif;background:#0a1424;color:#e7eef9}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #24406a}
  h1{font:600 15px Georgia,serif;margin:0} .score{font:700 14px ui-monospace,monospace;padding:3px 9px;border-radius:99px;background:#182c4c}
  main{padding:10px 14px;max-height:480px;overflow:auto}
  h2{font:600 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:#9db0cc;margin:12px 0 6px}
  .i{border-left:3px solid #ffb547;background:#13243f;padding:5px 8px;margin-bottom:4px;border-radius:0 6px 6px 0}
  .pass{border-color:#4ade80}.err{border-color:#f87171}
  .serp{background:#fff;border-radius:8px;padding:10px;font-family:Arial,sans-serif;margin-top:6px}
  .serp .t{color:#1a0dab;font-size:16px}.serp .d{color:#4d5156;font-size:12px}
  footer{padding:8px 14px;color:#9db0cc;font-size:11px;border-top:1px solid #24406a}
</style>
</head>
<body>
<header><h1>SEO Inspector</h1><span class="score" id="score">…</span></header>
<main id="out" aria-live="polite">Se analizează pagina…</main>
<footer>Marketing Lab · Laura Andreea</footer>
<script src="popup.js"></script>
</body>
</html>
