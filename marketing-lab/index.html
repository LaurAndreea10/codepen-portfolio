<style>
/* ===== Marketing Lab — Laura Andreea ===== */
:root{
  --bg:#0a1424; --bg2:#0f1d33; --panel:#13243f; --panel2:#182c4c; --line:#24406a;
  --text:#e7eef9; --muted:#9db0cc; --cyan:#4fd8eb; --cyan2:#1fb5cc; --amber:#ffb547;

  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f5f7fb; --bg2:#eef2f8; --panel:#ffffff; --panel2:#f2f5fa; --line:#d5deeb;
  --text:#0d1b2e; --muted:#46586f; --cyan:#066877; --cyan2:#055c69; --amber:#8f5200;

}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--f-body);min-height:100vh}
a{color:var(--cyan)}

p{margin:0 0 var(--s3)}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}

.drawer header{display:flex;align-items:center;gap:8px;padding:var(--s4);border-bottom:1px solid var(--line)}

/* home */

<script>
/* ===== Shared SEO analyzer — used by the in-app inspector (#12) and the Chrome extension ===== */
function seoAnalyze(doc, lang) {
  const L = (ro, en) => (lang === 'en' ? en : ro);
  const q = (s) => doc.querySelector(s);
  const qa = (s) => Array.from(doc.querySelectorAll(s));
  const meta = (n) => { const el = q(`meta[name="${n}"]`) || q(`meta[property="${n}"]`); return el ? (el.getAttribute('content') || '').trim() : ''; };
  const checks = [];
  const add = (group, level, msg) => checks.push({ group, level, msg });

  const title = (q('title') && q('title').textContent.trim()) || '';
  if (!title) add('Meta', 'err', L('Lipsește <title>', 'Missing <title>'));
  else if (title.length < 30 || title.length > 60) add('Meta', 'warn', L(`Titlu de ${title.length} caractere (ideal 30–60)`, `Title is ${title.length} chars (ideal 30–60)`));
  else add('Meta', 'pass', L(`Titlu: ${title.length} caractere`, `Title: ${title.length} chars`));

  const desc = meta('description');
  if (!desc) add('Meta', 'err', L('Lipsește meta description', 'Missing meta description'));
  else if (desc.length < 70 || desc.length > 160) add('Meta', 'warn', L(`Descriere de ${desc.length} caractere (ideal 70–160)`, `Description is ${desc.length} chars (ideal 70–160)`));
  else add('Meta', 'pass', L(`Descriere: ${desc.length} caractere`, `Description: ${desc.length} chars`));

  const canonical = q('link[rel="canonical"]');
  add('Meta', canonical ? 'pass' : 'warn', canonical ? 'Canonical: ' + canonical.getAttribute('href') : L('Lipsește link canonical', 'Missing canonical link'));
  const robots = meta('robots');
  if (/noindex/i.test(robots)) add('Meta', 'err', L('Pagina are noindex — nu va apărea în Google', 'Page is noindex — it will not appear in Google'));
  add('Meta', q('meta[name="viewport"]') ? 'pass' : 'err', q('meta[name="viewport"]') ? 'Viewport OK' : L('Lipsește meta viewport (mobil)', 'Missing meta viewport (mobile)'));
  const htmlLang = doc.documentElement.getAttribute('lang');
  add('Meta', htmlLang ? 'pass' : 'warn', htmlLang ? `lang="${htmlLang}"` : L('Lipsește atributul lang pe <html>', 'Missing lang attribute on <html>'));

  const h1 = qa('h1');
  add(L('Structură', 'Structure'), h1.length === 1 ? 'pass' : h1.length ? 'warn' : 'err', L(`${h1.length} × H1 (ideal: exact unul)`, `${h1.length} × H1 (ideal: exactly one)`));
  const heads = qa('h1,h2,h3,h4,h5,h6').map(h => +h.tagName[1]);
  let skips = 0; for (let i = 1; i < heads.length; i++) if (heads[i] - heads[i - 1] > 1) skips++;
  add(L('Structură', 'Structure'), skips ? 'warn' : 'pass', skips ? L(`${skips} salturi în ierarhia titlurilor (ex. H2 → H4)`, `${skips} heading-level skips (e.g. H2 → H4)`) : L('Ierarhia titlurilor e corectă', 'Heading hierarchy is correct'));
  const imgs = qa('img'); const noAlt = imgs.filter(i => !i.hasAttribute('alt'));
  add(L('Structură', 'Structure'), noAlt.length ? 'err' : 'pass', L(`${imgs.length} imagini, ${noAlt.length} fără alt`, `${imgs.length} images, ${noAlt.length} without alt`));
  const links = qa('a[href]'); const empty = links.filter(a => !(a.textContent.trim() || a.getAttribute('aria-label') || a.querySelector('img[alt]')));
  add(L('Structură', 'Structure'), empty.length ? 'warn' : 'pass', L(`${links.length} linkuri, ${empty.length} fără text`, `${links.length} links, ${empty.length} without text`));

  const og = { title: meta('og:title'), description: meta('og:description'), image: meta('og:image'), url: meta('og:url'), type: meta('og:type') };
  const ogMissing = Object.entries(og).filter(([, v]) => !v).map(([k]) => 'og:' + k);
  add('Social', ogMissing.length ? (ogMissing.length > 2 ? 'err' : 'warn') : 'pass', ogMissing.length ? L('Lipsesc: ', 'Missing: ') + ogMissing.join(', ') : 'Open Graph ' + L('complet', 'complete'));
  const tw = meta('twitter:card');
  add('Social', tw ? 'pass' : 'warn', tw ? 'twitter:card = ' + tw : L('Lipsește twitter:card', 'Missing twitter:card'));

  const ld = qa('script[type="application/ld+json"]'); let ldTypes = [];
  ld.forEach(s => { try { const j = JSON.parse(s.textContent); (Array.isArray(j) ? j : [j]).forEach(x => x['@type'] && ldTypes.push(x['@type'])); } catch (e) { add(L('Date structurate', 'Structured data'), 'err', L('JSON-LD invalid', 'Invalid JSON-LD')); } });
  add(L('Date structurate', 'Structured data'), ld.length ? 'pass' : 'warn', ld.length ? 'Schema.org: ' + ldTypes.join(', ') : L('Fără JSON-LD (Schema.org)', 'No JSON-LD (Schema.org)'));

  const words = (doc.body ? doc.body.textContent : '').trim().split(/\s+/).filter(Boolean).length;
  add(L('Conținut', 'Content'), words > 300 ? 'pass' : 'warn', L(`${words} cuvinte`, `${words} words`));

  /* ---------- render ---------- */
  function render(focus = true) {
    const id = currentId();

  }

  function setLang(l) { state.lang = l; store.set('lang', l); render(false); }
  function setTheme(t) { state.theme = t; store.set('theme', t); document.documentElement.dataset.theme = t; renderChrome(); }

  function init() {
    document.documentElement.dataset.theme = state.theme;

    $('#fwdBtn').onclick = forward;
    $('#histBtn').onclick = () => ($('#drawer').classList.contains('open') ? closeDrawer() : openDrawer());

  }

  return { register, routes, byId, state, store, L, T, esc, $, $$, fmt, uid, toast, copy, download, pageHead, go, init, visits, recent, timeAgo, CATS, setTheme };
})();

  /* ---------- 02 A/B testing calculator ---------- */

  const ncdf = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)); const d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };

    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];

    if (p > 1 - pl) { q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    q = p - 0.5; r = q * q; return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  };
  let ab = { nA: 5000, cA: 400, nB: 5000, cB: 460, conf: 95, base: 8, mde: 10, power: 80, tails: 2 };
  register({
    id: 'ab-test', n: 2, cat: 'mkt',
    title: { ro: 'Calculator A/B testing', en: 'A/B testing calculator' },
    desc: { ro: 'Semnificație statistică (test z pe două proporții), intervale de încredere vizualizate și mărimea eșantionului necesară.', en: 'Statistical significance (two-proportion z-test), visualised confidence intervals and required sample size.' },
    shows: ['statistică', 'SVG', 'z-test', 'power analysis'],
    render(root) {
      const calc = () => {
        const pA = ab.cA / ab.nA, pB = ab.cB / ab.nB;
        const pool = (ab.cA + ab.cB) / (ab.nA + ab.nB);

      };
      const sampleSize = () => {
        const p1 = ab.base / 100, p2 = p1 * (1 + ab.mde / 100);
        const za = ninv(1 - (1 - ab.conf / 100) / (ab.tails === 2 ? 2 : 1)), zb = ninv(ab.power / 100);

      };
      const ciSvg = (r) => {
        const lo = Math.min(r.ciA[0], r.ciB[0]), hi = Math.max(r.ciA[1], r.ciB[1]); const pad = (hi - lo) * 0.25 || 0.01;
        const x0 = lo - pad, x1 = hi + pad, W = 560, X = v => 60 + (v - x0) / (x1 - x0) * (W - 80);

(() => {

  /* ---------- 06 Cohort Retention Heatmap ---------- */
  const seeded = (s) => () => (s = (s * 16807) % 2147483647) / 2147483647;
  function sampleCsv() {
    const r = seeded(7); const rows = ['user_id,date'];
    const start = new Date(2026, 0, 1); let id = 1;
    for (let m = 0; m < 10; m++) {
      const users = 120 + Math.floor(r() * 80);
      for (let u = 0; u < users; u++, id++) {
        const signup = new Date(start.getFullYear(), start.getMonth() + m, 1 + Math.floor(r() * 27));
        rows.push(`u${id},${signup.toISOString().slice(0, 10)}`);
        let p = 0.55 + m * 0.015;                        // later cohorts retain a bit better (product improves)
        for (let k = 1; m + k < 10; k++) {
          if (r() < p) { const d = new Date(signup.getFullYear(), signup.getMonth() + k, 1 + Math.floor(r() * 27)); rows.push(`u${id},${d.toISOString().slice(0, 10)}`); }
          p *= 0.86;
        }
      }
    }
    return rows.join('\n');
  }
  function parseCsv(text) {
    const lines = text.trim().split(/\r?\n/); const head = lines.shift().toLowerCase().split(/[;,]/).map(s => s.trim().replace(/"/g, ''));
    const iu = head.findIndex(h => /user|client|customer|id/.test(h)); const id = head.findIndex(h => /^(date|data|activity|event|activity_date|timestamp)/.test(h));
    const is = head.findIndex(h => /signup|registr|first/.test(h));
    if (iu < 0 || id < 0) throw new Error(L('Am nevoie de coloanele user_id și date', 'Need user_id and date columns'));
    return lines.map(l => l.split(/[;,]/).map(s => s.trim().replace(/"/g, ''))).filter(c => c[iu] && c[id]).map(c => ({ u: c[iu], d: new Date(c[id]), s: is >= 0 && c[is] ? new Date(c[is]) : null })).filter(x => !isNaN(x.d));
  }
  function cohorts(rows, gran) {
    const key = d => gran === 'week' ? Math.floor((d - new Date(2020, 0, 6)) / 604800000) : d.getFullYear() * 12 + d.getMonth();
    const label = k => { if (gran === 'week') { const d = new Date(new Date(2020, 0, 6).getTime() + k * 604800000); return d.toISOString().slice(5, 10); } return `${Math.floor(k / 12)}-${String(k % 12 + 1).padStart(2, '0')}`; };
    const first = new Map();
    rows.forEach(r => { const s = r.s || r.d; const k = key(s); if (!first.has(r.u) || first.get(r.u) > k) first.set(r.u, k); });
    const act = new Map();
    rows.forEach(r => { const c = first.get(r.u); const p = key(r.d) - c; if (p < 0) return; if (!act.has(c)) act.set(c, new Map()); const m = act.get(c); if (!m.has(p)) m.set(p, new Set()); m.get(p).add(r.u); });
    const keys = [...act.keys()].sort((a, b) => a - b);
    const maxP = Math.max(...keys.map(k => Math.max(...act.get(k).keys())));
    return keys.map(k => { const m = act.get(k); const size = [...first.values()].filter(v => v === k).length; return { label: label(k), size, vals: Array.from({ length: maxP + 1 }, (_, p) => (m.has(p) ? m.get(p).size : (keys[keys.length - 1] - k >= p ? 0 : null))) }; });

              <div class="hint">${L('Coloane: user_id, date (opțional signup_date). O linie = o activitate.', 'Columns: user_id, date (optional signup_date). One row = one activity.')}</div></div>

            : `<div class="overlay-wrap" style="aspect-ratio:16/9;isolation:isolate">${hero()}<img src="${cvImg}" alt="${L('Design Canva suprapus', 'Canva design overlaid')}" id="cvImgEl" style="${cvMode === 'overlay' ? `opacity:${cvOpacity / 100}` : cvMode === 'diff' ? 'mix-blend-mode:difference' : `clip-path:inset(0 ${100 - cvSwipe}% 0 0)`}">${cvMode === 'swipe' ? `<div id="cvLine" style="position:absolute;top:0;bottom:0;left:${cvSwipe}%;width:2px;background:#ffb547;pointer-events:none"></div>` : ''}</div>`}

          <p class="hint" style="margin-top:8px">${cvMode === 'diff' ? L('În modul Diferență, zonele negre = identice; orice contur luminos arată unde implementarea se abate de design.', 'In Difference mode, black = identical; any bright outline shows where the build deviates from the design.') : L('Exportă din Canva la aceeași proporție ca secțiunea (aici 16:9) pentru o comparație corectă.', 'Export from Canva at the same ratio as the section (16:9 here) for a fair comparison.')}</p>
        </section>`;
        const im = new Image(); im.onload = () => { const np = palette(im); if (JSON.stringify(np) !== JSON.stringify(cvPalette)) { cvPalette = np; draw(); } }; im.src = cvImg;
        const load = f => { if (!f || !f.type.startsWith('image/')) return toast(L('Alege o imagine', 'Pick an image')); const r = new FileReader(); r.onload = () => { cvImg = r.result; cvIsDemo = false; cvPalette = []; cvPick = null; draw(); toast(L('Design încărcat', 'Design loaded')); }; r.readAsDataURL(f); };
        const dz = $('#cvdz', root);
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); }); dz.addEventListener('dragleave', () => dz.classList.remove('over'));
        dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); load(e.dataTransfer.files[0]); });
        $('#cvfile', root).onchange = e => load(e.target.files[0]);
        $('#cvDemo', root).onclick = () => { cvImg = demoDesign(); cvIsDemo = true; cvPalette = []; cvPick = null; draw(); };
        $$('[data-hex]', root).forEach(b => b.onclick = () => copy(b.dataset.hex));
        $('#cvCssCp', root).onclick = () => copy(css());
        $$('[data-cv]', root).forEach(i => i.addEventListener(i.type === 'color' ? 'change' : 'input', () => { cv[i.dataset.cv] = i.value; store.set('canva', cv); const id = i.id, pos = i.selectionStart; draw(); const n = $('#' + id, root); n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }));
        $$('[data-m]', root).forEach(b => b.onclick = () => { cvMode = b.dataset.m; draw(); $(`[data-m="${cvMode}"]`, root).focus(); });
        const o = $('#cvo', root); if (o) o.addEventListener('input', () => { cvOpacity = +o.value; $('#cvImgEl', root).style.opacity = cvOpacity / 100; root.querySelector('label[for=cvo]').textContent = L('Opacitate design', 'Design opacity') + ': ' + cvOpacity + '%'; });
        const sw = $('#cvs', root); if (sw) sw.addEventListener('input', () => { cvSwipe = +sw.value; $('#cvImgEl', root).style.clipPath = `inset(0 ${100 - cvSwipe}% 0 0)`; $('#cvLine', root).style.left = cvSwipe + '%'; root.querySelector('label[for=cvs]').textContent = L('Poziție', 'Position') + ': ' + cvSwipe + '%'; });
        const imgEl = $('#cvImgEl', root);
        if (imgEl && cvMode === 'side') imgEl.addEventListener('click', e => {
          const r = imgEl.getBoundingClientRect(); const c = document.createElement('canvas'); c.width = imgEl.naturalWidth; c.height = imgEl.naturalHeight; const x = c.getContext('2d'); x.drawImage(imgEl, 0, 0);
          const scale = Math.min(r.width / c.width, r.height / c.height); const ox = (r.width - c.width * scale) / 2, oy = (r.height - c.height * scale) / 2;
          const px = Math.floor((e.clientX - r.left - ox) / scale), py = Math.floor((e.clientY - r.top - oy) / scale);
          if (px < 0 || py < 0 || px >= c.width || py >= c.height) return;
          const d = x.getImageData(px, py, 1, 1).data; cvPick = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join(''); copy(cvPick); draw();
        });
      };
      draw();
    }
  });
})();


App.init();
</script>
</body>
</html>
