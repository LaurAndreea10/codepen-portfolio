function go(v){if(v==='forge'){location.href='funnel-forge.html';return}view=v;filter='';render();$('#main').focus();window.scrollTo({top:0,behavior:'auto'})}function btn(label,action,cls=''){return `<button class="${cls}" ${action}>${label}</button>`}function field(key,value='',type='text',full=false,extra=''){return `<label class="field ${full?'full':''}">${T(key)}<input name="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`}function area(key,value='',full=true){return `<label class="field ${full?'full':''}">${T(key)}<textarea name="${key}" maxlength="5000">${esc(value)}</textarea></label>`}function currencyField(v){return `<label class="field">${L('Monedă','Currency')}<select name="currency"><option value="RON" ${v!=='EUR'?'selected':''}>RON · lei</option><option value="EUR" ${v==='EUR'?'selected':''}>EUR · €</option></select></label>`}function select(key,options,val){return `<label class="field">${T(key)}<select name="${key}">${options.map(x=>`<option value="${x}" ${val===x?'selected':''}>${T(x)}</option>`).join('')}</select></label>`}function head(title,sub,action=''){return `<div class="head"><div><p class="eyebrow">LAURAI / ${state.mode==='play'?'GROWTH QUEST':'WORKSPACE'}</p><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}function empty(){return `<div class="empty">${T('empty')}</div>`}function stats(items){return `<div class="stats">${items.map(([name,note,value])=>`<div class="stat"><small>${name}</small><strong>${value}</strong><span>${note}</span></div>`).join('')}</div>`}
function captureFocus(){const a=document.activeElement;if(!a||!a.dataset)return null;return {id:a.id,tag:a.tagName,data:{...a.dataset}}}function restoreFocus(f){if(!f)return;let a=f.id?document.getElementById(f.id):null;if(!a&&Object.keys(f.data).length)a=[...document.querySelectorAll('button,input,select')].find(n=>n.tagName===f.tag&&Object.entries(f.data).every(([k,v])=>n.dataset[k]===v));if(a&&!a.disabled)a.focus({preventScroll:true});else if(Object.keys(f.data).length)$('#main').focus({preventScroll:true})}
function render(){const focusBefore=captureFocus();document.documentElement.lang=state.lang;document.body.className=[state.prefs.dark?'dark':'',state.prefs.high?'high':'',state.prefs.reduce?'reduce':''].join(' ');$('#navlabel').textContent=L('SPAȚIUL TĂU DE LUCRU','YOUR WORKSPACE');const nav=['overview',...(state.mode==='play'?['quests']:[]),'office','forge','crm','campaigns','calendar','analytics','library','tasks',...(state.mode==='play'?['shop']:[])];const icons={office:'▧',forge:'◉',overview:'◈',quests:'⚑',crm:'◎',campaigns:'▣',calendar:'▦',analytics:'▥',library:'✧',tasks:'☑',shop:'✦'};$('#nav').innerHTML=nav.map(k=>`<button data-go="${k}" class="${view===k?'active':''}" ${view===k?'aria-current="page"':''}><span class="ico" aria-hidden="true">${icons[k]}</span>${T(k)}</button>`).join('');$('#mode').innerHTML=['play','work'].map(k=>`<button data-mode="${k}" class="${state.mode===k?'active':''}" aria-pressed="${state.mode===k}">${T(k)}</button>`).join('');$('#lang').textContent=state.lang==='ro'?'EN':'RO';$('#lang').ariaLabel=L('Schimbă în engleză','Switch to Romanian');$('#theme').ariaLabel=T('dark');$('#theme').setAttribute('aria-pressed',state.prefs.dark);$('#settings').ariaLabel=T('settings');$('#sidefoot').innerHTML=`<strong>${state.mode==='play'?T('level')+' '+(1+Math.floor(state.game.xp/200)):L('Spațiul tău de lucru','Your workspace')}</strong>${state.mode==='play'?state.game.xp+' XP · '+state.game.coins+' '+T('coins'):T('local')}<div class="progress" style="--p:${state.game.xp%200/2}%"><i></i></div>${L('Idei. Relații. Rezultate.','Ideas. Relationships. Results.')}`;const pages={office:officePage,overview:overview,quests:questPage,crm:crmPage,campaigns:campaignPage,calendar:calendarPage,analytics:analyticsPage,library:libraryPage,tasks:taskPage,shop:shopPage,settings:settingsPage};$('#main').innerHTML=transferBanner()+(pages[view]||overview)()+`<p class="bottom-note">${T(state.mode==='play'?'demo':'local')} · Growth Quest v2.0.1</p>`;bindPage();restoreFocus(focusBefore)}
const missions=[{id:'brief',name:['Un brief care dă direcția','A brief with direction'],desc:['Luna Bakery pregătește o campanie de Halloween. Definește publicul, un obiectiv măsurabil și un mesaj clar.','Luna Bakery is planning Halloween. Define the audience, a measurable goal and a clear message.'],view:'campaigns',xp:100},{id:'content',name:['Trei postări, o poveste','Three posts, one story'],desc:['Planifică trei postări în canale relevante, cu date și descrieri.','Plan three posts with relevant channels, dates and descriptions.'],view:'calendar',xp:100},{id:'crm',name:['De la interes la relație','From interest to relationship'],desc:['Notează nevoia clientului, stabilește un follow-up și avansează contactul până la Client.','Record the client need, set a follow-up and advance the contact to Client.'],view:'crm',xp:100},{id:'analysis',name:['Citește rezultatele','Read the results'],desc:['Introdu datele simulate și interpretează conversia: 1.000 vizite, 40 comenzi, 1.200 lei cost, 4.000 lei venit.','Enter simulated results and interpret conversion: 1,000 visits, 40 orders, 1,200 lei cost, 4,000 lei revenue.'],view:'analytics',xp:100},{id:'service',name:['Un client nemulțumit','An unhappy client'],desc:['Alege răspunsul potrivit când o comandă întârzie.','Choose an appropriate reply when an order is late.'],view:'decision-service',xp:100},{id:'access',name:['O campanie pentru toți','A campaign for everyone'],desc:['Verifică accesibilitatea și adaugă un material cu o descriere utilă.','Check accessibility and add an asset with a useful description.'],view:'library',xp:100},{id:'budget',name:['Priorități sub presiune','Priorities under pressure'],desc:['Decide cum gestionezi un buget mic fără promisiuni imposibile.','Manage a small budget without impossible promises.'],view:'decision-budget',xp:100},{id:'delivery',name:['Dosarul de livrare','The delivery dossier'],desc:['Închide sarcinile și exportă un raport după primele șapte misiuni.','Close tasks and export a report after the first seven quests.'],view:'tasks',xp:100}];
function ready(id){const w=state.spaces.play;switch(id){case'brief':return w.campaigns.some(c=>c.title.trim().length>=3&&c.audience.trim().length>=10&&/\d/.test(c.objective)&&c.message.trim().length>=10&&c.budget>0&&c.accessibility.trim().length>=10);case'content':return w.posts.filter(p=>p.description.trim().length>=10&&p.title.trim().length>=3&&p.date).length>=3;case'crm':return w.contacts.some(c=>c.stage==='won'&&c.notes.trim().length>=10&&c.followup);case'analysis':return w.metrics.visits===1000&&w.metrics.orders===40&&w.metrics.spend===1200&&w.metrics.revenue===4000;case'access':return w.assets.some(a=>a.description.trim().length>=20)&&w.campaigns.some(c=>c.accessibility.trim().length>=20);case'delivery':return missions.slice(0,7).every(m=>state.game.completed.includes(m.id))&&w.tasks.every(t=>t.done);default:return false}}
function rewardQuest(id){if(state.game.completed.includes(id))return;const m=missions.find(m=>m.id===id);state.game.completed.push(id);state.game.xp+=m.xp;state.game.coins+=50;persist();ping();notify(L('Misiune finalizată! +100 XP · +50 credite','Quest complete! +100 XP · +50 credits'));render()}
function overview(){const w=W(),count=state.game.completed.length,next=missions.find(m=>!state.game.completed.includes(m.id));return head(L('Bun venit în agenția ta.','Welcome to your agency.'),state.mode==='play'?L('Următoarea idee bună începe cu o misiune.','Your next good idea starts with a quest.'):L('Clienții, campaniile și prioritățile tale, împreună.','Your clients, campaigns and priorities, together.'),`<div class="actions" style="margin:0">${btn(T('office'),'data-go="office"','primary')}${btn(T('help'),'data-help')}</div>`)+stats(state.mode==='play'?[[T('level'),state.game.xp+' XP',1+Math.floor(state.game.xp/200)],[T('missions'),L('8 misiuni în poveste','8 story quests'),count+'/8'],[T('coins'),L('Pentru personalizarea agenției','Customize your agency'),state.game.coins],[T('contacts'),T('demo'),w.contacts.length]]:[[T('contacts'),T('crm'),w.contacts.length],[T('active'),T('campaigns'),w.campaigns.length],[T('task'),T('pending'),w.tasks.filter(t=>!t.done).length],[L('Venit introdus','Recorded revenue'),T('analytics'),money(w.metrics.revenue)]])+`<div class="grid"><section class="panel"><div class="panel-top"><h2>${state.mode==='play'?L('Povestea agenției','Agency story'):L('Spațiul de lucru','Workspace')}</h2><span class="chip">${state.mode==='play'?L('CAPITOLUL 01','CHAPTER 01'):T('local')}</span></div>${state.mode==='play'?`<div class="mission-hero"><p class="eyebrow">LUNA BAKERY / HALLOWEEN</p><h2>${next?L(...next.name):L('Ai livrat prima campanie.','Your first campaign is delivered.')}</h2><p>${next?L(...next.desc):L('Continuă cu provocări zilnice sau folosește instrumentele pentru proiectele tale.','Continue with daily challenges or use the tools for your own projects.')}</p><div class="mission-meta"><span class="chip">${L('Date fictive','Fictional data')}</span><span class="chip">+100 XP</span><span class="chip">+50 ${T('coins')}</span></div><div class="progress" style="--p:${count/8*100}%"><i></i></div>${btn(next?T('start'):T('quests'),'data-go="quests"','lime')}</div><div class="steps">${missions.slice(0,4).map((m,i)=>step(m,i)).join('')}</div>`:`<div class="agency ${state.game.decor}">${['crm','campaigns','analytics','calendar','library','tasks'].map(k=>`<button class="station" data-go="${k}"><b>${T(k)}</b><small>${L('Deschide instrumentul','Open tool')}</small></button>`).join('')}</div>`}</section><div class="stack">${panel(L('Priorități de azi','Today’s priorities'),w.tasks.length?w.tasks.slice(0,4).map(taskRow).join('')+`<div class="actions">${btn(T('tasks'),'data-go="tasks"','small')}</div>`:empty()+btn(T('add'),'data-add="task"','small'))}${panel(state.mode==='play'?L('Provocarea zilei','Daily challenge'):L('Privire asupra rezultatelor','Results at a glance'),state.mode==='play'?`<p class="muted">${L('Un mesaj promoțional trebuie să aibă contrast bun și informații clare. Care variantă este corectă?','A promotional message needs contrast and clear information. Which choice is best?')}</p><div class="reward"><strong aria-hidden="true">✦</strong><div><b>+30 XP · +15 ${T('coins')}</b><p class="tiny muted">${today()}</p></div></div><div class="actions">${btn(state.game.daily.includes(today())?T('complete'):L('Rezolvă provocarea','Take challenge'),'data-daily '+(state.game.daily.includes(today())?'disabled':''),'primary')}</div>`:metricChart(w.metrics))}</div></div>`}

function questPage(){return head(T('quests'),L('Învață construind o campanie completă.','Learn by building a complete campaign.'))+`<div class="cards">${missions.map((m,i)=>`<section class="card"><span class="chip ${state.game.completed.includes(m.id)?'':'orange'}">${state.game.completed.includes(m.id)?T('complete'):L('Misiunea ','Quest ')+(i+1)}</span><h3>${L(...m.name)}</h3><p class="muted">${L(...m.desc)}</p><p class="tiny">${m.xp} XP · 50 ${T('coins')}</p><div class="actions">${btn(T('start'),`data-mission="${m.id}"`,'primary')}${!state.game.completed.includes(m.id)&&!m.view.startsWith('decision')?btn(T('submit'),`data-evaluate="${m.id}"`,'small'):''}</div></section>`).join('')}</div>`}
function crmPage(){const leads=W().contacts.filter(c=>(c.name+' '+c.company+' '+c.email).toLowerCase().includes(filter.toLowerCase()));return head(T('crm'),L('Fiecare relație are un următor pas.','Every relationship has a next step.'),btn(L('Contact nou','Add contact'),'data-add="contact"','primary'))+`<label class="field" style="max-width:420px;margin-bottom:22px">${T('search')}<input id="search" value="${esc(filter)}" placeholder="${L('Nume, companie, email…','Name, company, email…')}"></label><div class="kanban">${stages.map(s=>`<section class="column"><h3>${T(s)} <span class="chip">${leads.filter(c=>c.stage===s).length}</span></h3>${leads.filter(c=>c.stage===s).map(c=>`<article class="lead"><b>${esc(c.name)}</b><small>${esc(c.company)}</small><p style="margin:9px 0">${money(c.value,c.currency||'RON')}</p>${c.followup?`<small>${T('followup')}: ${esc(c.followup)}</small>`:''}<label class="field">${T('stage')}<select data-stage="${c.id}">${stages.map(k=>`<option value="${k}" ${c.stage===k?'selected':''}>${T(k)}</option>`).join('')}</select></label>${btn(T('edit'),`data-edit="contact" data-id="${c.id}"`,'small')}</article>`).join('')||`<p class="tiny muted">${L('Niciun contact','No contacts')}</p>`}</section>`).join('')}</div>`+missionHint('crm')}
function missionHint(id){if(state.mode!=='play'||state.game.completed.includes(id))return '';const m=missions.find(m=>m.id===id);return `<div class="panel" style="margin-top:22px"><h3>${L(...m.name)}</h3><p class="muted">${L(...m.desc)}</p>${btn(T('submit'),`data-evaluate="${id}"`,'primary')}</div>`}
function campaignPage(){return head(T('campaigns'),L('Public, obiectiv, mesaj. O direcție clară.','Audience, goal, message. A clear direction.'),btn(L('Campanie nouă','New campaign'),'data-add="campaign"','primary'))+(W().campaigns.length?`<div class="cards">${W().campaigns.map(c=>`<section class="card"><span class="chip">${T(c.status)}</span><h3>${esc(c.title)}</h3><p>${esc(c.audience)}</p><p class="muted">${esc(c.objective)}</p><p><b>${money(c.budget,c.currency||'RON')}</b></p><div class="actions">${btn(T('edit'),`data-edit="campaign" data-id="${c.id}"`)}${btn(T('export'),`data-report="${c.id}"`,'small')}</div></section>`).join('')}</div>`:panel(T('brief'),empty()+`<p class="muted">${L('Începe cu publicul și un obiectiv care poate fi măsurat.','Start with the audience and a goal you can measure.')}</p>`))+missionHint('brief')}
function calendarPage(){const first=new Date(calYear,calMonth,1),offset=(first.getDay()+6)%7,days=new Date(calYear,calMonth+1,0).getDate(),names=state.lang==='ro'?['Lu','Ma','Mi','Jo','Vi','Sâ','Du']:['Mo','Tu','We','Th','Fr','Sa','Su'];return head(T('calendar'),L('Planifică mesajele înainte să le publici.','Plan your messages before publishing.'),btn(L('Postare nouă','New post'),'data-add="post"','primary'))+`<section class="panel"><div class="panel-top"><h2>${new Intl.DateTimeFormat(state.lang==='ro'?'ro-RO':'en-GB',{month:'long',year:'numeric'}).format(first)}</h2><div>${btn('‹','data-month="-1" aria-label="'+L('Luna precedentă','Previous month')+'"')}${btn('›','data-month="1" aria-label="'+L('Luna următoare','Next month')+'"')}</div></div><div class="calendar">${names.map(n=>`<div class="day-name">${n}</div>`).join('')}${Array.from({length:offset},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{const d=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<div class="day"><b>${i+1}</b>${W().posts.filter(p=>p.date===d).map(p=>`<span class="entry">${esc(p.title)}</span>`).join('')}</div>`}).join('')}</div></section><section class="panel" style="margin-top:22px"><h2>${L('Plan editorial','Editorial plan')}</h2>${W().posts.length?`<div class="table-wrap"><table><thead><tr><th>${T('title')}</th><th>${T('date')}</th><th>${T('channel')}</th><th>${T('status')}</th><th>${T('edit')}</th></tr></thead><tbody>${[...W().posts].sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.date)}</td><td>${esc(p.channel)}</td><td>${T(p.status)}</td><td>${btn(T('edit'),`data-edit="post" data-id="${p.id}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty()}</section>`+missionHint('content')}
function calc(m){return{conversion:m.visits?m.orders/m.visits*100:0,cpl:m.leads?m.spend/m.leads:0,cpa:m.orders?m.spend/m.orders:0,roas:m.spend?m.revenue/m.spend:0}}

function analyticsPage(){const m=W().metrics,c=calc(m),has=m.visits||m.spend||m.revenue;const defs={spend:['Cost (lei)','Spend (lei)'],visits:['Vizite','Visits'],leads:['Leaduri','Leads'],orders:['Comenzi','Orders'],revenue:['Venit (lei)','Revenue (lei)']};return head(T('analytics'),state.mode==='play'?L('Introdu date fictive și înțelege formulele.','Enter fictional data and understand the formulas.'):L('Introdu rezultatele campaniei tale.','Enter your campaign results.'))+`<section class="panel"><form id="metricform"><div class="metricform">${Object.keys(defs).map(k=>`<label class="field">${L(...defs[k])}<input name="${k}" type="number" min="0" max="1000000000" step="${['visits','leads','orders'].includes(k)?1:'.01'}" value="${m[k]}" required></label>`).join('')}</div><div class="actions">${btn(T('save'),'type="submit"','primary')}${state.mode==='play'?btn(L('Încarcă exemplul simulat','Load simulated example'),'type="button" data-example'):''}${btn(T('export'),'type="button" data-report="all"')}</div></form></section><div style="margin-top:22px">${stats([[L('Conversie','Conversion'),L('Comenzi / vizite × 100','Orders / visits × 100'),m.visits?c.conversion.toFixed(2)+'%':'—'],['CPL',L('Cost / leaduri','Spend / leads'),m.leads?money(c.cpl):'—'],['CPA',L('Cost / comenzi','Spend / orders'),m.orders?money(c.cpa):'—'],['ROAS',L('Venit / cost','Revenue / spend'),m.spend?c.roas.toFixed(2)+'×':'—']])}</div><div class="grid">${panel(L('De la vizită la comandă','From visit to order'),metricChart(m))}${panel(L('Interpretarea rezultatelor','Understanding results'),`<p>${has?L('Aceste valori se calculează exclusiv din datele introduse. ROAS arată venitul raportat la costul campaniei; nu reprezintă profitul.','These values use only your entered data. ROAS compares revenue to campaign spend; it is not profit.'):L('Adaugă date pentru a calcula rezultatele. Un numitor zero este afișat prin „—”.','Add data to calculate results. A zero denominator is shown as “—”.')}</p><p class="muted">${L('Conversia folosește comenzile, nu leadurile. Pentru profit trebuie luate în calcul și alte costuri.','Conversion uses orders, not leads. Profit requires accounting for other costs.')}</p>`)}</div>`+missionHint('analysis')}

function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.version!==1||!['ro','en'].includes(raw.lang)||!['play','work'].includes(raw.mode))return null;const obj=x=>x&&typeof x==='object'&&!Array.isArray(x),str=(x,max=5000)=>typeof x==='string'&&x.length<=max,num=x=>typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=1e9,date=x=>str(x,10)&&(!x||/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(Date.parse(x))),bool=x=>typeof x==='boolean';if(!obj(raw.prefs)||!['dark','high','reduce','sound'].every(k=>bool(raw.prefs[k]))||!obj(raw.game)||!obj(raw.spaces))return null;const g=raw.game,themes=['forest','blue','violet','gold'];if(!num(g.xp)||!num(g.coins)||!Array.isArray(g.completed)||!g.completed.every(x=>['brief','content','crm','analysis','service','access','budget','delivery'].includes(x))||new Set(g.completed).size!==g.completed.length||!Array.isArray(g.daily)||g.daily.length>10000||!g.daily.every(date)||!Array.isArray(g.owned)||!g.owned.every(x=>themes.includes(x))||!themes.includes(g.decor)||!g.owned.includes(g.decor))return null;const clean={version:1,lang:raw.lang,mode:raw.mode,prefs:{dark:raw.prefs.dark,high:raw.prefs.high,reduce:raw.prefs.reduce,sound:raw.prefs.sound},game:{xp:g.xp,coins:g.coins,completed:[...g.completed],daily:[...new Set(g.daily)],owned:[...new Set(g.owned)],decor:g.decor},spaces:{}};const fields={contacts:['name','company','email','notes'],campaigns:['title','audience','objective','message','accessibility'],posts:['title','channel','description'],tasks:['title'],assets:['title','link','description']};for(const mode of ['play','work']){const w=raw.spaces[mode];if(!obj(w)||!obj(w.metrics)||!['spend','visits','leads','orders','revenue'].every(k=>num(w.metrics[k]))||!['visits','leads','orders'].every(k=>Number.isInteger(w.metrics[k]))||w.metrics.orders>w.metrics.visits||w.metrics.leads>w.metrics.visits)return null;const result={metrics:Object.fromEntries(['spend','visits','leads','orders','revenue'].map(k=>[k,w.metrics[k]]))};for(const [collection,keys] of Object.entries(fields)){const list=w[collection];if(!Array.isArray(list)||list.length>5000)return null;const ids=new Set();result[collection]=[];for(const r of list){if(!obj(r)||!str(r.id,100)||!/^[a-zA-Z0-9_-]+$/.test(r.id)||ids.has(r.id)||!keys.every(k=>str(r[k])))return null;ids.add(r.id);const item={id:r.id,...Object.fromEntries(keys.map(k=>[k,r[k]]))};if(collection==='contacts'){if(!num(r.value)||!stagesForValidation().includes(r.stage)||!date(r.followup))return null;if(r.currency!==undefined&&!['RON','EUR'].includes(r.currency))return null;Object.assign(item,{value:r.value,stage:r.stage,followup:r.followup,currency:r.currency||'RON'})}if(collection==='campaigns'){if(!num(r.budget)||!['draft','ready','published'].includes(r.status))return null;if(r.currency!==undefined&&!['RON','EUR'].includes(r.currency))return null;Object.assign(item,{budget:r.budget,status:r.status,currency:r.currency||'RON'})}if(collection==='posts'){if(!date(r.date)||!r.date||!['draft','ready','published'].includes(r.status))return null;Object.assign(item,{date:r.date,status:r.status})}if(collection==='tasks'){if(!date(r.date)||!bool(r.done))return null;Object.assign(item,{date:r.date,done:r.done})}if(collection==='assets'&&r.link&&!safeUrl(r.link))return null;result[collection].push(item)}}clean.spaces[mode]=result}return clean}function stagesForValidation(){return ['new','contacted','proposal','won']}

let officeSimple;try{officeSimple=localStorage.getItem('growth-office-simple')==='true'}catch{officeSimple=true}
function officePage(){const simple=officeSimple||state.prefs.high;return head(T('office'),L('Alege zona în care vrei să lucrezi.','Choose the area you want to work in.'),`<div class="actions" style="margin:0">${btn(simple?L('Vedere 3D','3D view'):L('Vedere simplă','Simple view'),'data-office-toggle')}${btn(L('Ecran complet','Fullscreen'),'data-office-full')}</div>`)+`<section class="panel office-panel" id="office-panel"><div class="office-stage ${simple?'simple':''}">${simple?'':`<img src="agency-office.webp" width="1536" height="1024" alt="${L('Birou izometric cu studio de creație în stânga, spațiu pentru clienți în centru și analiză în dreapta.','Isometric office with a creative studio on the left, client space in the center and analytics on the right.')}" decoding="async">`}<div class="office-zones">${[['campaigns',L('Marketing & creație','Marketing & creation'),L('Brief, mesaj și calendar','Brief, copy and calendar')],['crm',L('Relații & clienți','Relationships & clients'),L('Contacte, oferte și follow-up','Contacts, proposals and follow-up')],['analytics',L('Analiză & rezultate','Analytics & results'),L('Date, conversie și raport','Data, conversion and report')]].map(([v,title,desc],i)=>`<button class="office-zone z${i}" data-go="${v}"><b>${title}</b><span>${desc}</span></button>`).join('')}</div></div><div class="actions office-links">${['calendar','library','tasks','forge'].map(v=>btn(T(v),`data-go="${v}"`)).join('')}</div><p class="muted tiny" style="margin-top:15px">${L('Toate zonele sunt disponibile și în meniul principal. Vederea simplă este activă automat în contrast ridicat.','All areas are also available in the main menu. Simple view is automatic in high contrast.')}</p></section>`}
function readTransfer(){try{const p=JSON.parse(localStorage.getItem('ff_transfer_v1'));if(!p||p.version!==1||typeof p.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(p.id)||!Number.isInteger(p.week)||p.week<1||p.week>12)return null;const fake=initial();for(const k of ['campaigns','contacts','posts','assets','tasks']){if(!Array.isArray(p[k])||p[k].length>20)return null;fake.spaces.play[k]=p[k]}const checked=normalize(fake);if(!checked||checked.spaces.play.campaigns.length!==1||checked.spaces.play.posts.length!==3||checked.spaces.play.assets.length!==1)return null;return {id:p.id,week:p.week,space:checked.spaces.play}}catch{return null}}
function transferBanner(){const p=readTransfer();return p?`<section class="transfer-banner"><div><b>${L('Un dosar din Funnel Forge este pregătit.','A Funnel Forge dossier is ready.')}</b><p>${L('Revizuiește brief-ul, cele trei postări și raportul simulat.','Review the brief, three posts and simulated report.')}</p></div>${btn(L('Revizuiește dosarul','Review dossier'),'data-transfer-review','primary')}${btn(T('cancel'),'data-transfer-dismiss')}</section>`:''}
function previewTransfer(){const p=readTransfer();if(!p)return;const c=p.space.campaigns[0];modal(L('Dosar din simulator','Simulator dossier'),`<span class="chip">${T('demo')}</span><h3 style="margin-top:18px">${esc(c.title)}</h3><p>${esc(c.audience)}</p><p><b>${T('objective')}:</b> ${esc(c.objective)}</p><p><b>${T('budget')}:</b> ${money(c.budget,c.currency)}</p><p>${L('Adaugă un brief, trei postări, un raport, o sarcină și până la zece clienți fictivi în modul Joacă și învață. Datele existente sunt păstrate.','Add a brief, three posts, a report, one task and up to ten fictional customers to Play & learn. Existing data is preserved.')}</p><div class="actions">${btn(L('Adaugă în spațiul de practică','Add to practice workspace'),'id="accept-transfer"','primary')}</div>`);$('#accept-transfer').onclick=()=>acceptTransfer(p)}
function acceptTransfer(p){const fresh=readTransfer();if(!fresh||fresh.id!==p.id)return;const target=structuredClone(state);for(const k of ['campaigns','contacts','posts','assets','tasks'])for(const r of fresh.space[k])if(!target.spaces.play[k].some(old=>old.id===r.id))target.spaces.play[k].push(r);const checked=normalize(target);if(!checked){notify(T('invalid'));return false}try{localStorage.setItem(KEY,JSON.stringify(checked))}catch{notify(T('storage'));return false}state=checked;state.mode='play';persist();try{localStorage.removeItem('ff_transfer_v1')}catch{}$('#modal').close();view='campaigns';render();notify(L('Dosarul este pregătit pentru editare.','The dossier is ready to edit.'));return true}
function bindUpgrade(){if($('[data-office-toggle]'))$('[data-office-toggle]').onclick=()=>{officeSimple=!(officeSimple||state.prefs.high);if(state.prefs.high){notify(L('Dezactivează contrastul ridicat pentru vederea 3D.','Turn off high contrast for 3D view.'));return}try{localStorage.setItem('growth-office-simple',officeSimple)}catch{}render()};if($('[data-office-full]'))$('[data-office-full]').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#office-panel').requestFullscreen)await $('#office-panel').requestFullscreen();else notify(L('Ecranul complet nu este disponibil în acest browser.','Fullscreen is unavailable in this browser.'))}catch{notify(L('Ecranul complet nu este disponibil în acest browser.','Fullscreen is unavailable in this browser.'))}};if($('[data-transfer-review]'))$('[data-transfer-review]').onclick=previewTransfer;if($('[data-transfer-dismiss]'))$('[data-transfer-dismiss]').onclick=()=>{try{localStorage.removeItem('ff_transfer_v1')}catch{}render()}}

$('#nav').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};$('#mode').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;state.mode=b.dataset.mode;view='overview';persist();render()};$('#lang').onclick=()=>{state.lang=state.lang==='ro'?'en':'ro';persist();render()};$('#theme').onclick=()=>{state.prefs.dark=!state.prefs.dark;persist();render()};$('#settings').onclick=()=>go('settings');$('#importfile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>5e6){notify(T('invalid'));return}try{const checked=normalize(JSON.parse(await file.text()));if(!checked){notify(T('invalid'));return}if(!confirm(L('Înlocuiești datele și progresul ambelor moduri cu acest backup?','Replace data and progress for both modes with this backup?')))return;state=checked;persist();view='overview';render();notify(T('confirmed'))}catch{notify(T('invalid'))}};
render();
