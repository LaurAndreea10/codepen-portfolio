let progress={unlocked:1,completed:[]};function validProgress(p){return p&&Number.isInteger(p.unlocked)&&p.unlocked>=1&&p.unlocked<=4&&Array.isArray(p.completed)&&p.completed.every(id=>window.GrowthScenarios.some(c=>c.id===id))&&new Set(p.completed).size===p.completed.length}try{const p=JSON.parse(localStorage.getItem('ff_progress_v1'));if(validProgress(p))progress=p}catch{}
function completeSeason(){if(!S.over)return;saveRun();const c=window.GrowthScenarios.find(c=>c.id===S.scenario);if(!c)return;if(!progress.completed.includes(c.id))progress.completed.push(c.id);progress.unlocked=Math.max(progress.unlocked,Math.min(4,c.level+1))}
function showScenarios(){let sessions={};try{sessions=JSON.parse(localStorage.getItem('ff_sessions_v2')||'{}')}catch{}let runs=[];try{runs=JSON.parse(localStorage.getItem('ff_runs_v2')||'[]')}catch{}openModal(`<h2>${L('Campanii sezoniere','Seasonal campaigns')}</h2><p>${L('Încheie un sezon pentru a debloca următorul nivel. Poți relua orice nivel deblocat.','Finish a season to unlock the next level. Replay any unlocked level.')}</p><div class="scenario-list">${window.GrowthScenarios.map(c=>`<section class="box"><span class="tag">${L('Nivel','Level')} ${c.level}</span><h3>${esc(L(...c.name))}</h3><p>${esc(c.client)} · ${eur(c.cash)} ${t('cash')} · ${eur(c.target)} MRR</p><button data-act="choose" data-scenario="${c.id}" ${c.level>progress.unlocked?'disabled':''}>${c.level>progress.unlocked?L('Blocat','Locked'):L('Sezon nou','New season')}</button>${sessions[c.id+'-'+selectedMode]&&!sessions[c.id+'-'+selectedMode].over?` <button data-act="resume" data-scenario="${c.id}">${L('Continuă progresul','Resume progress')}</button>`:''}</section>`).join('')}</div><h3 style="margin-top:20px">${L('Clasament local de sezoane','Local season rankings')}</h3><p>${runs.slice().sort((a,b)=>b.score-a.score).slice(0,5).map(r=>esc(r.scenario)+' · '+r.score+' · '+eur(r.mrr)).join('<br>')||L('Niciun sezon încheiat.','No completed seasons.')}</p><button class="mini-btn" data-act="closemodal" style="margin-top:14px">${t('close')}</button>`)}
function resumeScenario(id){let sessions;try{sessions=JSON.parse(localStorage.getItem('ff_sessions_v2')||'{}')}catch{return}const prior=validate(sessions[id+'-'+selectedMode]);if(!prior||prior.over)return;if(S&&!S.over)save();closeModal();S=prior;gameUndo=[];save();render()}
function chooseScenario(id){const c=window.GrowthScenarios.find(c=>c.id===id);if(!c||c.level>progress.unlocked)return;if(S&&!S.over&&!confirm(t('reset')))return;closeModal();newGame(id);tab='dash';save();render();showHelp()}
function transferDossier(){const c=configFor(S.customConfig||S.scenario),prefix=`ff-${S.runId}-w${S.week}`,day=new Date();const date=i=>{const d=new Date(day);d.setDate(d.getDate()+i*2);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},mark=L('[SIMULARE]','[SIMULATION]'),channels=CH.filter(x=>S.alloc[x.id]>0);const rows=channels.length?channels:[CH[0]],map={email:'Email',social:'Instagram',ads:'Search Ads',content:'Blog',events:'Webinar'};const sourceSummary=`${mark} Funnel Forge · ${c.client} · ${L('Nivel','Level')} ${c.level} · ${t('week')} ${S.week}\n${t('mrr')}: ${eur(S.mrr)} / ${eur(TARGET)}\n${t('cash')}: ${eur(S.cash)}\n${t('mkt_total')}: ${eur(marketingSpend())}\n${t('clients')}: ${S.clients.length}\n${t('won')}: ${S.stats.won} / ${S.stats.gen}\n${L('Canale alese','Selected channels')}: ${rows.map(x=>t('ch_'+x.id)+' ×'+S.alloc[x.id]).join(', ')}\n${t('sim')}`;
const packet={version:1,id:prefix,scenario:c.id,week:S.week,lang,campaigns:[{id:prefix+'-brief',title:`${mark} ${c.client} · ${L(...c.name)}`,audience:L(...c.audience),objective:L(...c.goal),message:L(...c.message),budget:marketingSpend(),currency:'EUR',status:'draft',accessibility:L('Contrast, text alternativ descriptiv, subtitrări, mesaj clar și fără informații doar prin culoare.','Contrast, descriptive alternative text, captions, clear copy and no colour-only information.')}],posts:Array.from({length:3},(_,i)=>({id:prefix+'-post'+i,title:`${mark} ${c.client} · ${(lang==='ro'?c.formats:c.formatsEN)[i]}`,date:date(i),channel:map[rows[i%rows.length].id],status:'draft',description:`${L(...c.message)} ${L('Draft bazat pe alegerile din joc; adaptează înainte de publicare.','Draft based on game decisions; adapt before publishing.')}`})),contacts:S.clients.slice(0,10).map((x,i)=>({id:prefix+'-client'+i,name:x.company,company:x.company,email:'',value:x.value,currency:'EUR',stage:'won',notes:mark+' · Funnel Forge · '+L('Client fictiv din simulator. Venit lunar.','Fictional simulator customer. Monthly revenue.'),followup:date(0)})),assets:[{id:prefix+'-report',title:`${mark} ${c.client} · ${L('Raport','Report')} · ${t('week')} ${S.week}`,link:'',description:sourceSummary}],tasks:[{id:prefix+'-task',title:`${mark} ${L('Revizuiește brief-ul și cele trei postări','Review the brief and three posts')}`,date:date(0),done:false}]};
try{localStorage.setItem('ff_transfer_v1',JSON.stringify(packet));location.href='index.html?from=funnel-forge'}catch{toast(L('Nu am putut transfera dosarul. Exportă backupul.','Could not transfer the dossier. Export a backup.'))}}

if(typeof ResizeObserver!=='undefined'){new ResizeObserver(()=>{const h=document.querySelector('.endbar').getBoundingClientRect().height;document.querySelector('.app').style.paddingBottom=(h+32)+'px';$('toasts').style.bottom=(h+12)+'px'}).observe(document.querySelector('.endbar'))}
let saved=null;try{saved=validate(JSON.parse(localStorage.getItem(KEY)))}catch{}let requested=null,custom=null;try{requested=localStorage.getItem('ff_start_mode');localStorage.removeItem('ff_start_mode');custom=JSON.parse(localStorage.getItem('growth_custom_game')||'null')}catch{}if(['season','training','free'].includes(requested)){selectedMode=requested;if(custom&&validCustom(custom)){localStorage.removeItem('growth_custom_game');newGame(custom)}else newGame(saved?.scenario||'halloween')}else if(saved){S=saved;selectedMode=S.mode}else newGame();if(S.over)completeSeason();save();render();if(S.over)showEnd();else if(!saved)showHelp();
})();
</script><script src="offline.js"></script></body></html>
