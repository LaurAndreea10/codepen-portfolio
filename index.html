<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="10;url=portfolio.html#home">
  <title>Laura Andreea — Portfolio Intro</title>
  <meta name="description" content="Intro pentru portofoliul Laura Andreea — Front-end CRM & Dashboard Developer.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://laurandreea10.github.io/codepen-portfolio/">
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;overflow:hidden;padding:24px;background:#030711;color:#f5f8ff;font-family:Inter,system-ui,sans-serif}
    .space,.space::before,.space::after{position:fixed;inset:-30%;content:"";pointer-events:none}
    .space{background:radial-gradient(circle at 20% 25%,rgba(36,103,230,.32),transparent 28%),radial-gradient(circle at 82% 72%,rgba(148,65,230,.24),transparent 26%),linear-gradient(145deg,#02040a,#071327 56%,#050815)}
    .space::before{background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:47px 47px;opacity:.18;animation:drift 18s linear infinite}
    .space::after{inset:50%;width:min(76vw,900px);height:min(76vw,900px);transform:translate(-50%,-50%);border:1px solid rgba(111,171,255,.25);border-radius:50%;box-shadow:0 0 120px rgba(61,126,232,.18),inset 0 0 90px rgba(132,77,226,.12);animation:orbit 14s linear infinite}
    .card{position:relative;width:min(780px,94vw);padding:clamp(34px,7vw,76px);overflow:hidden;border:1px solid rgba(136,183,255,.38);border-radius:28px;background:linear-gradient(145deg,rgba(10,25,51,.88),rgba(5,9,20,.94));box-shadow:0 44px 140px rgba(0,0,0,.65),0 0 90px rgba(55,119,230,.18);text-align:center;animation:enter .7s ease-out both}
    .card::before{position:absolute;inset:0;content:"";background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.09),transparent 65%);transform:translateX(-120%);animation:shine 4s 1s ease-in-out infinite}
    .kicker{position:relative;margin:0 0 22px;color:#75adff;font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase}
    h1{position:relative;margin:0;font:600 clamp(52px,11vw,112px)/.88 Georgia,serif;letter-spacing:-.06em;text-shadow:0 0 44px rgba(117,173,255,.22)}
    .role{position:relative;margin:25px 0 0;color:#c1cce0;font:500 clamp(13px,2vw,18px)/1.6 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
    .proof{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 28px;margin:30px 0;color:#8f9db7;font:500 13px/1.5 ui-monospace,monospace}.proof strong{color:#fff}
    .progress{position:relative;height:2px;margin:30px 0 12px;overflow:hidden;background:rgba(255,255,255,.12)}
    .progress::after{display:block;width:100%;height:100%;content:"";background:linear-gradient(90deg,#6aa6ff,#a873ff);transform-origin:left;animation:progress 10s linear forwards}
    .timing{position:relative;margin:0 0 25px;color:#7d8ba5;font:500 11px/1.5 ui-monospace,monospace;letter-spacing:.08em}
    .cta{position:relative;z-index:3;display:inline-block;padding:15px 24px;border-radius:999px;background:linear-gradient(110deg,#72adff,#aa78ff);box-shadow:0 12px 42px rgba(94,145,255,.34);color:#061022;font:800 12px/1 ui-monospace,monospace;letter-spacing:.15em;text-decoration:none;text-transform:uppercase;transition:transform .2s,box-shadow .2s}
    .cta:hover,.cta:focus-visible{transform:translateY(-2px);box-shadow:0 16px 54px rgba(94,145,255,.5);outline:3px solid rgba(126,177,255,.35);outline-offset:4px}
    @keyframes enter{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes drift{to{transform:translate3d(47px,47px,0)}}@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes shine{45%,100%{transform:translateX(120%)}}
    @media(max-width:560px){.card{padding:38px 22px}.proof{display:grid;gap:7px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.progress::after{transform:none}}
  </style>
</head>
<body>
  <div class="space" aria-hidden="true"></div>
  <main class="card">
    <p class="kicker">// portfolio · 2026</p>
    <h1>Laura<br>Andreea</h1>
    <p class="role">Front-end · CRM · Dashboard Developer</p>
    <div class="proof"><span><strong>84</strong> proiecte CodePen</span><span><strong>20+</strong> repo-uri publice</span><span><strong>RO / EN</strong></span></div>
    <div class="progress" aria-hidden="true"></div>
    <p class="timing">Portofoliul se deschide automat în 10 secunde</p>
    <a class="cta" href="portfolio.html#home">Explorează portofoliul →</a>
  </main>
</body>
</html>
