<!doctype html><html lang="en"><meta charset="utf-8"><title>Carpați Enduro runtime checks</title><style>body{font:16px system-ui;background:#0b1424;color:#e8eef8;margin:24px}iframe{width:390px;height:844px;border:1px solid #97a8c6}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Runtime checks</h1><p>Isolated preview checks. Existing local save is restored after completion.</p><button id="run">Run checks</button><pre id="out" role="status">Ready</pre><iframe title="Game under test" src="../index.html?qa=1"></iframe><script>
const out=document.querySelector('#out'),frame=document.querySelector('iframe');document.querySelector('#run').onclick=async()=>{out.textContent='Running…';const saved=localStorage.getItem('carpati-enduro-v1'),rows=[],errors=[];let w,api,originalError;const check=(name,fn)=>{try{fn();rows.push('PASS '+name)}catch(e){rows.push('FAIL '+name+': '+e.message)}};const assert=(a,m)=>{if(!a)throw Error(m||'assertion')};try{
for(let i=0;i<100;i++){w=frame.contentWindow;if(w.__CE)break;await new Promise(r=>setTimeout(r,100))}api=w.__CE;assert(api,'game boot');originalError=w.console.error;w.console.error=(...a)=>errors.push(a.join(' '));
api.SV.set.gfx='2d';api.SV.set.vEng=api.SV.set.vSfx=api.SV.set.vMus=0;api.SV.set.reduce=true;
check('RO and EN Studio tabs render',()=>{for(const lang of ['ro','en']){api.SV.set.lang=lang;for(const tab of ['rides','editor','missions','tuning','friends','replays','analysis','access','saves','about']){api.expedition.open(tab);assert(w.document.querySelector('#ce-panel h2'),'Studio title')}}});api.SV.set.lang='ro';
check('Studio fits 320, 390 and 768px widths with 130% text',()=>{const original=frame.style.width;w.document.documentElement.style.setProperty('--ts','1.3');for(const width of [320,390,768]){frame.style.width=width+'px';for(const id of ['rides','editor','missions','tuning','friends','replays','analysis','access','saves','about']){api.expedition.open(id);const el=w.document.querySelector('#ce-panel');assert(el.scrollWidth<=el.clientWidth+1,width+' '+id+' overflow '+el.scrollWidth+'/'+el.clientWidth)}}frame.style.width=original;w.document.documentElement.style.setProperty('--ts','1')});
check('All 8 regions × 9 existing modes initialize and simulate',()=>{for(let r=0;r<8;r++)for(const mode of ['race','tt','trial','hill','surv','stunt','elim','duel','free']){api.startRace({mode,r,seed:100+r,diff:1,opp:3,w:'c',tod:'d'});api.sim(220);assert(api.G.bike.pts.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)),r+' '+mode)}});
check('All 10 new disciplines initialize with valid geometry',()=>{for(const id of ['sprint','hard','precision','rush','delivery','rescue','rally','rogue','boss','explore']){api.expedition.launch(id);api.sim(210);assert(api.G.opts.discipline===id,id);assert(api.G.tr.finish<Infinity,id);assert(api.G.bike.pts.every(p=>Number.isFinite(p.x)),id)}});
check('Editor generates reproducible terrain and surface overrides',()=>{const c={format:'CE-TRACK-2',name:'Pădure',seed:42,region:0,weather:'c',tod:'d',segments:[{kind:'flat',grade:1,surface:5},{kind:'roots',grade:1},{kind:'bridge',grade:1},{kind:'stairs',grade:1}]};api.expedition.ceStartCourse(c,true);const first=JSON.stringify(api.G.tr.ys);assert(api.G.tr.sf.includes(5),'surface override');api.expedition.ceStartCourse(c,true);assert(first===JSON.stringify(api.G.tr.ys),'seed determinism')});
check('Malformed legacy challenge rejected',()=>{assert(api.expedition.parseCode('CE-tt-8-abc-cd')===null);assert(api.expedition.parseCode('CE-tt-0-abc-cd').r===0)});
check('Unicode custom challenges round-trip and preserve easy difficulty',()=>{const c={format:'CE-TRACK-2',name:'Pădure șî ț',seed:42,region:0,weather:'c',tod:'d',profile:[{at:.5,dy:-100}],segments:[{kind:'flat'},{kind:'logs'},{kind:'table'}]};const o={mode:'tt',r:0,seed:42,w:'c',tod:'d',diff:0,opp:0,course:c};const encoded=api.expedition.chCode(o),decoded=api.expedition.parseCode(encoded);assert(decoded.course.name===c.name);assert(decoded.diff===0);api.expedition.ceStartCourse(decoded.course,true);assert(api.G.tr.ys.some(y=>y< -50))});
check('Replay retains expedition terrain and route',()=>{api.expedition.launch('sprint');const ys=JSON.stringify(api.G.tr.ys),g={format:'CE-GHOST-2',name:'Sprint ghost',opts:{...api.G.opts},frames:[120,-21,198,-21,148,-95,130,-21,208,-21,158,-95]};api.expedition.cePlayReplay(w.CEExpedition.ghost(g));assert(ys===JSON.stringify(api.G.tr.ys))});
check('Tire pressure creates a real grip/speed tradeoff',()=>{const state=api.expedition.state;state.tuning.enduro={pressure:.7,spring:.7};const low=api.bikeStats('enduro');state.tuning.enduro={pressure:1.3,spring:1.3};const high=api.bikeStats('enduro');assert(low.grip>high.grip&&low.vmax<high.vmax);state.tuning.enduro={pressure:1,spring:1}});
check('Rules isolate bonus and assisted leaderboards',()=>{api.expedition.state.settings.power='none';api.startRace({mode:'tt',r:0,seed:5,diff:1,w:'c',tod:'d'});const a=api.G.key;api.expedition.state.settings.power='boost';api.startRace({mode:'tt',r:0,seed:5,diff:1,w:'c',tod:'d'});assert(api.G.key!==a)});
check('Power-up activates at most once',()=>{api.G.state='race';api.expedition.cePower();const run=api.expedition.run;assert(run.powerUsed);api.expedition.cePower();assert(run.powerUsed)});
check('Practice has no currency or XP rewards',()=>{api.startRace({mode:'tt',r:0,seed:5,diff:1,w:'c',tod:'d',practice:true});const coins=api.SV.coins,xp=api.SV.xp;api.G.done=true;api.expedition.results(true,1);assert(api.SV.coins===coins,'coins');assert(api.SV.xp===xp,'xp')});
check('Result rewards are idempotent',()=>{api.startRace({mode:'race',r:0,seed:7,diff:1,w:'c',tod:'d'});api.G.t=12;api.G.done=true;api.expedition.results(true,1);const a=api.SV.coins,x=api.SV.xp;api.expedition.results(true,1);assert(api.SV.coins===a&&api.SV.xp===x)});
check('Rush timeout ends run',()=>{api.expedition.launch('rush');api.G.state='race';api.G.t=46;api.sim(1);assert(api.G.done)});
check('Rescue and precision cannot finish without objectives',()=>{api.expedition.launch('rescue');assert(!api.expedition.ceCanFinish());api.expedition.launch('precision');assert(!api.expedition.ceCanFinish());api.G.cleanL=3;assert(api.expedition.ceCanFinish())});
check('Replay poses remain finite when seeking',()=>{const g={format:'CE-GHOST-2',name:'Test',opts:{mode:'tt',r:0,seed:5,w:'c',tod:'d'},frames:[120,-21,198,-21,148,-95,130,-21,208,-21,158,-95]};api.expedition.cePlayReplay(g);api.expedition.ceReplayFrame(.025);assert(api.G.state==='replay');assert(api.G.bike.pts.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)))});
check('Invalid restore preserves current save',()=>{const previous=api.SV.coins;try{api.expedition.ceRestore({v:1,coins:-1})}catch{}assert(api.SV.coins===previous)});
check('Suspended checkpoint resumes in practice',()=>{api.startRace({mode:'tt',r:0,seed:5,diff:1,w:'c',tod:'d'});api.G.respX=3000;api.expedition.ceSuspend();api.expedition.ceResume();assert(api.G.opts.practice);assert(api.G.bike.pts[0].x>2900)});
api.expedition.goMenu();await new Promise(r=>setTimeout(r,1400));check('Stale result timers do not reopen results',()=>assert(api.G.state==='attract'));
check('No game runtime errors',()=>assert(!errors.length,errors.join(' | ')));
}catch(e){rows.push('FAIL harness: '+e.stack)}finally{if(w&&originalError)w.console.error=originalError;if(saved===null)localStorage.removeItem('carpati-enduro-v1');else localStorage.setItem('carpati-enduro-v1',saved);out.textContent=rows.join('\n')+'\n\n'+rows.filter(r=>r.startsWith('PASS')).length+' passed, '+rows.filter(r=>r.startsWith('FAIL')).length+' failed';document.title=rows.some(r=>r.startsWith('FAIL'))?'FAIL runtime checks':'PASS runtime checks'}
};
</script></html>
