.sp{flex:1}

.btn.danger:hover{border-color:var(--red);color:var(--red)}

.stat input{width:92px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:600 11px var(--mono)}

.col.over{box-shadow:0 0 0 2px var(--cyan)}

.col h2 span{color:var(--muted);font-weight:400}
.col h2 em{margin-left:auto;font-style:normal;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.cards{flex:1;padding:4px 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:60px}

.card.sel{border-color:var(--amber)}
.card.dragging{opacity:.3}

.pr{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}

.tag{font:400 10.5px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ph{border:2px dashed var(--cyan);border-radius:10px;flex:none}
.ghost{position:fixed;z-index:80;pointer-events:none;box-shadow:var(--shadow);transform:rotate(2deg);opacity:.95;margin:0}
.add{margin:0 8px 8px;background:none;border:1px dashed var(--line);border-radius:9px;padding:6px;color:var(--muted);cursor:pointer;min-height:34px}

  .search{order:5;max-width:none;flex-basis:100%}

    const focusId = id => { const c = $(`.card[data-id="${id}"]`); c && c.focus(); };
    if (e.shiftKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){ e.preventDefault(); const ns = STAGES[si + (e.key === 'ArrowRight' ? 1 : -1)]; if (ns){ moveDeal(d.id, ns); focusId(d.id); } return; }
    if (e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){ e.preventDefault(); const up = e.key === 'ArrowUp', tgt = up ? cards[i - 1] : cards[i + 2]; if (up ? i > 0 : i < cards.length - 1){ moveDeal(d.id, d.stage, tgt ? tgt.dataset.id : null); focusId(d.id); } return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = cards[i + (e.key === 'ArrowDown' ? 1 : -1)]; n && n.focus(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); const dir = e.key === 'ArrowRight' ? 1 : -1; for (let c = col; (c = dir > 0 ? c.nextElementSibling : c.previousElementSibling);){ const cs = c.querySelectorAll('.card'); if (cs.length){ cs[Math.min(i, cs.length - 1)].focus(); break; } } return; }
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); return openDrawer(d.id); }
    if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); const n = cards[i + 1] || cards[i - 1]; deleteDeal(d.id); if (n) focusId(n.dataset.id); return; }
  }
  if (k === 'n'){ e.preventDefault(); createDeal(); }
  else if (e.key === '/'){ e.preventDefault(); $('#q').focus(); }
  else if (e.key === '1'){ setView('board'); } else if (e.key === '2'){ setView('table'); }
  else if (e.key === '?'){ openHelp(); }
});

/* ---------- command palette ---------- */
let palItems = [], palI = 0;
function fuzzy(text, query){ text = text.toLowerCase(); let ti = 0, score = 0, streak = 0; for (const ch of query){ const f = text.indexOf(ch, ti); if (f < 0) return -1; streak = f === ti ? streak + 1 : 0; score += 1 + streak * 2 - (f - ti) * .05; if (f === 0) score += 3; ti = f + 1; } return score; }
function commands(){
  const c = [['cNew', () => createDeal(), 'N'], ['cBoard', () => setView('board'), '1'], ['cTable', () => setView('table'), '2'], ['cUndo', undo, 'Ctrl Z'], ['cRedo', redo, 'Ctrl ⇧ Z'], ['cTheme', toggleTheme], ['cLang', toggleLang],
    ['cExport', exportJSON], ['cCsv', exportCSV], ['cImport', () => $('#file').click()], ['cReset', resetDemo], ['cHelp', openHelp, '?'], ['cClear', () => { q = ''; $('#q').value = ''; fOwner = ''; render(); }]].map(([k, run, hint]) => ({ kind:'cmd', label:t(k), run, hint }));
  OWNERS.forEach(o => c.push({ kind:'cmd', label:t('cOwner', { n:o.n }), run:() => { fOwner = o.id; render(); } }));
  const d = byId(selId); if (d) STAGES.filter(s => s !== d.stage).forEach(s => c.push({ kind:'cmd', label:t('cMove', { n:d.title, s:t(s) }), run:() => moveDeal(d.id, s) }));
  return c;
}
function openPal(){ const p = $('#pal'); if (p.open) return p.close(); $$('dialog[open]').forEach(d => d.close()); $('#palQ').value = ''; $('#palQ').placeholder = t('palPh'); p.showModal(); fillPal(); }
function fillPal(){
  const s = $('#palQ').value.trim().toLowerCase(), all = commands().concat(deals.map(d => ({ kind:'deal', label:d.title, sub:d.company + ' · ' + money(d.value), run:() => openDrawer(d.id) })));
  palItems = s ? all.map(x => ({ x, sc:Math.max(fuzzy(x.label, s), x.sub ? fuzzy(x.sub, s) - 1 : -1) })).filter(r => r.sc >= 0).sort((a, b) => b.sc - a.sc).slice(0, 12).map(r => r.x) : all.filter(x => x.kind === 'cmd').slice(0, 13);
  palI = 0; drawPal();
}
function drawPal(){
  $('#palList').innerHTML = palItems.length ? palItems.map((x, i) => `<li role="option" id="po${i}" aria-selected="${i === palI}" data-i="${i}"><span class="k">${t(x.kind === 'cmd' ? 'kCmd' : 'kDeal')}</span><span>${esc(x.label)}</span><small>${esc(x.sub || x.hint || '')}</small></li>`).join('') : `<li class="empty" style="padding:14px">${t('palNone')}</li>`;
  $('#palQ').setAttribute('aria-activedescendant', palItems.length ? 'po' + palI : ''); const el = $('#po' + palI); el && el.scrollIntoView({ block:'nearest' });
}
function runPal(i){ const x = palItems[i]; if (!x) return; $('#pal').close(); x.run(); }
$('#palQ').addEventListener('input', fillPal);
$('#palQ').addEventListener('keydown', e => { if (e.key === 'ArrowDown'){ e.preventDefault(); palI = (palI + 1) % (palItems.length || 1); drawPal(); } else if (e.key === 'ArrowUp'){ e.preventDefault(); palI = (palI - 1 + palItems.length) % (palItems.length || 1); drawPal(); } else if (e.key === 'Enter'){ e.preventDefault(); runPal(palI); } });
$('#palList').addEventListener('click', e => { const li = e.target.closest('[data-i]'); if (li) runPal(+li.dataset.i); });
$('#pal').addEventListener('click', e => { if (e.target === $('#pal')) $('#pal').close(); });

/* ---------- misc actions ---------- */
function setView(v){ view = v; ls.set('lf.view', v); render(); }
function toggleTheme(){ const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = th; ls.set('lf.theme', th); }
function toggleLang(){ lang = lang === 'ro' ? 'en' : 'ro'; ls.set('lf.lang', lang); applyLang(); }
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500); }
function exportJSON(){ download('local-first-crm.json', JSON.stringify({ app:'local-first-crm', v:1, meta, deals }, null, 1), 'application/json'); }
function exportCSV(){ const c = v => /^[=+\-@]/.test(String(v)) ? "'" + v : v, row = a => a.map(v => '"' + String(c(v ?? '')).replace(/"/g, '""') + '"').join(',');
  download('local-first-crm.csv', '﻿' + [row(['title','company','contact','email','value','stage','owner','priority','due','tags'])].concat(deals.map(d => row([d.title, d.company, d.contact, d.email, d.value, d.stage, owner(d.owner).n, d.prio, d.due, d.tags.join(' ')]))).join('\n'), 'text/csv'); }
const validDeal = d => d && typeof d.id === 'string' && typeof d.title === 'string' && STAGES.includes(d.stage) && isFinite(d.value);
function clean(d, i){ return { id:d.id, title:String(d.title).slice(0, 80), company:String(d.company || '').slice(0, 60), contact:String(d.contact || '').slice(0, 60), email:String(d.email || '').slice(0, 80), value:Math.max(0, +d.value || 0), stage:d.stage, owner:owner(d.owner).id, prio:['high','med','low'].includes(d.prio) ? d.prio : 'med',
  due:/^\d{4}-\d\d-\d\d$/.test(d.due) ? d.due : new Date().toISOString().slice(0, 10), tags:Array.isArray(d.tags) ? d.tags.map(x => String(x).slice(0, 20)).slice(0, 4) : [], ord:isFinite(d.ord) ? d.ord : i, created:+d.created || Date.now(), closedAt:d.closedAt || null,
  log:Array.isArray(d.log) ? d.log.filter(l => l && ['created','stage','note'].includes(l.k)).map(l => ({ t:+l.t || Date.now(), k:l.k, a:STAGES.includes(l.a) ? l.a : 'lead', b:STAGES.includes(l.b) ? l.b : 'lead', text:String(l.text || '').slice(0, 500) })) : [] }; }
$('#file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try{ const j = JSON.parse(await f.text()); if (!j || !Array.isArray(j.deals) || !j.deals.every(validDeal)) throw 0; deals = j.deals.map(clean); if (j.meta && isFinite(j.meta.target)) meta.target = +j.meta.target; selId = null; commit(t('tImport', { n:deals.length })); }catch(_){ toast(t('tBad')); } };
function resetDemo(){ deals = seed(); selId = null; commit(t('tReset')); }
let toastT; function toast(m, withUndo){ $('#toastM').textContent = m; $('#toastU').hidden = !withUndo; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('#toast').hidden = true, 4000); }
function say(m){ $('#live').textContent = ''; setTimeout(() => $('#live').textContent = m, 30); }
function openHelp(){ $('#helpBody').innerHTML = `<table>${t('help').map(([k, d]) => `<tr><td><kbd>${k}</kbd></td><td>${d}</td></tr>`).join('')}</table><p style="color:var(--muted);font-size:13px">${t('helpDnd')}</p>`; $('#help').showModal(); }
function applyLang(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria))); $$('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $('#lang').textContent = lang === 'ro' ? 'EN' : 'RO'; $('#lang').setAttribute('aria-label', lang === 'ro' ? 'Switch to English' : 'Schimbă în română');
  document.title = lang === 'ro' ? 'Local-First CRM — pipeline kanban instant, fără server | Laura Andreea' : 'Local-First CRM — instant kanban pipeline, no server | Laura Andreea';
  render(); refreshDrawer();
}
$('#toastU').onclick = () => { $('#toast').hidden = true; undo(); };
$('#q').addEventListener('input', e => { q = e.target.value; render(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape'){ e.target.value = ''; q = ''; render(); e.target.blur(); } });
$('#vBoard').onclick = () => setView('board'); $('#vTable').onclick = () => setView('table');
$('#new').onclick = () => createDeal(); $('#cmd').onclick = openPal; $('#undo').onclick = undo; $('#redo').onclick = redo;
$('#helpB').onclick = openHelp; $('#helpClose').onclick = () => $('#help').close(); $('#theme').onclick = toggleTheme; $('#lang').onclick = toggleLang;

/* ---------- init ---------- */
document.documentElement.dataset.theme = ls.get('lf.theme', 'dark');
(async () => {
  db = await openDB(); const got = await loadDB();
  if (got && got.deals.length){ deals = got.deals.map(clean); if (got.meta && isFinite(got.meta.target)) meta = { target:+got.meta.target }; } else { deals = seed(); persist(); }
  last = snap(); applyLang(); if (!db) $('#save').textContent = t('mem');
  try{ bc = new BroadcastChannel('lf-crm'); bc.onmessage = async () => { const g = await loadDB(); if (!g || pd) return; deals = g.deals.map(clean); if (g.meta) meta = { target:+g.meta.target || 60000 }; last = snap(); undoS.length = redoS.length = 0; render(); refreshDrawer(); $('#save').textContent = t('synced'); }; }catch(e){}
  window.LF = { get deals(){ return deals; }, moveDeal, undo, redo };
})();
})();
</script>
