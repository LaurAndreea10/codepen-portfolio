CREATE TABLE deals (id INTEGER PRIMARY KEY, customer_id INTEGER NOT NULL REFERENCES customers(id), title TEXT NOT NULL, value INTEGER NOT NULL, stage TEXT NOT NULL, created_date TEXT NOT NULL, closed_date TEXT);
CREATE TABLE activities (id INTEGER PRIMARY KEY, deal_id INTEGER NOT NULL REFERENCES deals(id), type TEXT NOT NULL, date TEXT NOT NULL, duration_min INTEGER NOT NULL);
CREATE INDEX idx_deals_customer ON deals(customer_id); CREATE INDEX idx_act_deal ON activities(deal_id);`);
  const r = rng(20261115), pick = a => a[Math.floor(r() * a.length)], day = n => new Date(Date.UTC(2025, 0, 1) + n * 864e5).toISOString().slice(0, 10), END = 669; /* 2026-11-01 */
  const A = ['Atelier', 'Studio', 'Ferma', 'Casa', 'Grup', 'Fabrica', 'Magazin', 'Clinica', 'Hotel', 'Librăria', 'Brutăria', 'Garaj'], B = ['Brad', 'Vector', 'Verde', 'Lumen', 'Nord', 'Carpat', 'Iris', 'Zenit', 'Fir', 'Spic', 'Izvor', 'Tei', 'Codru', 'Albastru', 'Urban', 'Sud', 'Delta', 'Pisc'];
  const cities = ['București', 'București', 'București', 'Cluj-Napoca', 'Cluj-Napoca', 'Iași', 'Iași', 'Timișoara', 'Brașov', 'Constanța', 'Sibiu', 'Oradea'], segs = ['SMB', 'SMB', 'SMB', 'Mid-market', 'Mid-market', 'Enterprise'];
  const titles = ['Abonament anual', 'Implementare CRM', 'Redesign site', 'Automatizări email', 'Dashboard raportare', 'Audit accesibilitate', 'Mentenanță', 'Training echipă', 'Integrare plăți', 'Portal clienți'], types = ['call', 'call', 'email', 'email', 'email', 'meeting', 'demo'];
  db.run('BEGIN');
  [['Ana Popa', 'Nord'], ['Mihai Dinu', 'Nord'], ['Ioana Radu', 'Sud'], ['Radu Toma', 'Sud'], ['Elena Voicu', 'Vest'], ['Paul Ene', 'Vest']].forEach((o, i) => db.run('INSERT INTO owners VALUES (?,?,?)', [i + 1, o[0], o[1]]));
  const used = new Set(), signup = []; let dealId = 1, actId = 1;
  for (let i = 1; i <= 120; i++){
    let nm; do { nm = pick(A) + ' ' + pick(B) + (r() < .25 ? ' ' + pick(['Plus', 'Pro', 'Group', 'Lab']) : ''); } while (used.has(nm)); used.add(nm);
    const seg = pick(segs), sd = Math.floor(r() * 560); signup[i] = sd;
    db.run('INSERT INTO customers VALUES (?,?,?,?,?,?)', [i, nm, pick(cities), seg, day(sd), 1 + Math.floor(r() * 6)]);
    const nDeals = r() < .09 ? 0 : 1 + Math.floor(r() * (seg === 'Enterprise' ? 6 : 4));
    for (let k = 0; k < nDeals; k++){
      const created = sd + Math.floor(r() * (END - sd - 5)), base = seg === 'Enterprise' ? 22000 : seg === 'Mid-market' ? 9000 : 3000, value = Math.round(base * (.4 + r() * 1.8) / 100) * 100, age = END - created;
      const x = r(), stage = age < 25 ? pick(['lead', 'qualified', 'proposal']) : x < .38 ? 'won' : x < .62 ? 'lost' : pick(['lead', 'qualified', 'proposal', 'negotiation']);
      const closed = stage === 'won' || stage === 'lost' ? Math.min(END - 1, created + 6 + Math.floor(r() * (seg === 'Enterprise' ? 80 : 45))) : null;
      db.run('INSERT INTO deals VALUES (?,?,?,?,?,?,?)', [dealId, i, pick(titles), value, stage, day(created), closed == null ? null : day(closed)]);
      const stale = closed == null && r() < .3, lastDay = closed ?? (stale ? Math.min(END - 1, created + 20) : END - 1), nAct = 1 + Math.floor(r() * 5);
      for (let a = 0; a < nAct; a++){ const ty = pick(types); db.run('INSERT INTO activities VALUES (?,?,?,?,?)', [actId++, dealId, ty, day(created + Math.floor(r() * Math.max(1, lastDay - created))), ty === 'email' ? 5 : ty === 'call' ? 10 + Math.floor(r() * 25) : 30 + Math.floor(r() * 60)]); }
      dealId++;
    }
  }
  db.run('COMMIT');
}
function query(sql){ const res = db.exec(sql); return res.length ? res[res.length - 1] : null; }
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function boot(){
  const local = 'vendor/', cdn = 'https://cdn.jsdelivr.net/npm/sql.js@1.16.0/dist/';
  for (const base of [local, cdn]){
    try{ if (!window.initSqlJs) await loadScript(base + 'sql-wasm.js'); SQL = await window.initSqlJs({ locateFile:f => base + f }); break; }catch(e){ SQL = null; }
  }
  if (!SQL){ $('#out').innerHTML = `<div class="err">${t('failLoad')}</div>`; return; }
  seed(); $('#run').disabled = false; renderSchema(); renderCh(); $('#out').innerHTML = ''; run();
}

/* ---------- running ---------- */
function run(check){
  if (!db) return; const sql = $('#sql').value.trim(); if (!sql) return;
  const t0 = performance.now(); let res, err = null, changed = 0;
  try{ res = query(sql); changed = db.getRowsModified(); }catch(e){ err = String(e.message || e); }
  const ms = performance.now() - t0; last = err ? null : res; $('#csv').disabled = !last;
  if (!err){ const h = ls.get('sq.hist', []).filter(x => x !== sql); h.unshift(sql); ls.set('sq.hist', h.slice(0, 15)); renderHist(); renderSchema(); }
  if (check != null) verdict = { i:check, ...judge(check, err ? null : res) }; else if (active != null && !err && res){ const v = judge(active, res); verdict = v.ok ? { i:active, ...v } : null; }
  if (verdict && verdict.ok){ const d = done(); d[verdict.i] = 1; ls.set('sq.done', d); }
  renderCh();
  if (err){ $('#status').textContent = ''; $('#out').innerHTML = `<div class="err" role="alert">${esc(err)}</div>`; return; }
  $('#status').textContent = res ? t('ms', { n:N(res.values.length), t:ms.toFixed(1) }) : '';
  if (!res){ $('#out').innerHTML = `<div class="ok">${changed ? t('changed', { n:N(changed) }) : t('noRows')}</div>`; return; }
  renderOut();
}
const isNum = v => typeof v === 'number';
function renderOut(){
  const res = last, out = $('#out'); if (!res) return;
  if (view === 'chart'){ const c = chart(res); out.innerHTML = c || `<p class="empty">${t('noChart')}</p>`; return; }
  const lim = 500, rows = res.values.slice(0, lim);
  out.innerHTML = `<table class="res"><caption class="sr">${t('rows', { n:res.values.length })}</caption><thead><tr>${res.columns.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => v == null ? '<td class="null">NULL</td>' : `<td${isNum(v) ? ' class="n"' : ''}>${esc(isNum(v) ? N(v, 2) : v)}</td>`).join('')}</tr>`).join('')}</tbody></table>${res.values.length > lim ? `<p class="empty">${t('shown', { n:lim })}</p>` : ''}`;
}
function chart(res){
  const n = res.values.length; if (!n || n > 60 || res.columns.length < 2) return '';
  const yi = res.columns.findIndex((c, i) => i > 0 && res.values.every(r => r[i] == null || isNum(r[i])) && res.values.some(r => isNum(r[i]))); if (yi < 0) return '';
  const labs = res.values.map(r => String(r[0] ?? '—')), ys = res.values.map(r => +r[yi] || 0), max = Math.max(...ys, 1), time = labs.every(l => /^\d{4}-\d{2}(-\d{2})?$/.test(l)), ttl = t('chartOf', { y:res.columns[yi], x:res.columns[0] });
  if (time && n > 1){ const W = 760, H = 320, l = 60, r = 16, top = 16, bot = 270, px = i => l + i / (n - 1) * (W - l - r), py = v => bot - v / max * (bot - top), step = Math.ceil(n / 10);
    return `<svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ttl)}">${[0, .25, .5, .75, 1].map(f => `<line class="grid" x1="${l}" x2="${W - r}" y1="${py(max * f)}" y2="${py(max * f)}"/><text class="ax" x="${l - 6}" y="${py(max * f) + 4}" text-anchor="end">${N(max * f)}</text>`).join('')}<path class="cl" d="M${ys.map((v, i) => px(i).toFixed(1) + ',' + py(v).toFixed(1)).join('L')}"/>${ys.map((v, i) => `<circle class="cd" cx="${px(i)}" cy="${py(v)}" r="3.5"><title>${esc(labs[i])}: ${N(v, 2)}</title></circle>`).join('')}${labs.map((s, i) => i % step ? '' : `<text class="ax" x="${px(i)}" y="${bot + 18}" text-anchor="middle">${esc(s)}</text>`).join('')}</svg>`; }
  const W = 760, rh = Math.max(16, Math.min(34, 420 / n)), l = 200, r = 90, H = n * rh + 16;
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ttl)}">${ys.map((v, i) => { const y = 8 + i * rh, w = Math.max(1, v / max * (W - l - r)); return `<text class="lab" x="${l - 8}" y="${y + rh / 2 + 4}" text-anchor="end">${esc(labs[i].length > 26 ? labs[i].slice(0, 25) + '…' : labs[i])}</text><rect class="cb" x="${l}" y="${y + 3}" width="${w.toFixed(1)}" height="${rh - 6}" rx="3"><title>${esc(labs[i])}: ${N(v, 2)}</title></rect><text class="val" x="${l + w + 6}" y="${y + rh / 2 + 4}">${N(v, 2)}</text>`; }).join('')}</svg>`;
}
/* ---------- challenge judge: compare with the reference query's result, ignoring column names ---------- */
const key = r => r.map(v => isNum(v) ? (Math.round(v * 1000) / 1000).toString() : String(v)).join('\u0001');
function judge(i, res){
  if (!res) return { ok:false, why:t('wErr') };
  const ref = query(REF[i].sql), a = res.values, b = ref.values;
  if (res.columns.length !== ref.columns.length) return { ok:false, why:t('wCols', { a:res.columns.length, b:ref.columns.length }) };
  if (a.length !== b.length) return { ok:false, why:t('wRows', { a:a.length, b:b.length }) };
  const ka = a.map(key), kb = b.map(key);
  if (ka.slice().sort().join('\u0002') !== kb.slice().sort().join('\u0002')) return { ok:false, why:t('wVals') };
  if (REF[i].ordered && ka.join('\u0002') !== kb.join('\u0002')){ /* ties may legitimately differ: compare the ordering column only */ const col = ref.columns.length - 1; if (a.some((r, k) => key([r[col]]) !== key([b[k][col]]))) return { ok:false, why:t('wOrder') }; }
  return { ok:true };
}

/* ---------- panels ---------- */
function renderSchema(){
  if (!db) return; const tabs = query("SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
  const open = new Set($$('details.tb[open]').map(d => d.dataset.t)), first = !$('details.tb');
  $('#schema').innerHTML = (tabs ? tabs.values : []).map(([name]) => { const cols = query(`PRAGMA table_info("${name.replace(/"/g, '""')}")`).values, cnt = query(`SELECT COUNT(*) FROM "${name.replace(/"/g, '""')}"`).values[0][0];
    return `<details class="tb" data-t="${esc(name)}"${open.has(name) || (first && name === 'deals') ? ' open' : ''}><summary>${esc(name)}<small>${N(cnt)}</small></summary><ul>${cols.map(c => `<li>${esc(c[1])}<span>${esc(c[2] || '')}${c[5] ? ' PK' : ''}</span></li>`).join('')}</ul><button class="lnk" style="padding:0 10px 8px" data-sel="${esc(name)}">SELECT * … LIMIT 20</button></details>`; }).join('') + `<p class="empty" style="font-size:12px">${t('today')}</p>`;
  $$('[data-sel]').forEach(b => b.onclick = () => { setSQL(`SELECT * FROM ${b.dataset.sel} LIMIT 20;`); run(); });
}
function setSQL(s){ $('#sql').value = s; ls.set('sq.sql', s); }
function renderEx(){ $('#examples').innerHTML = I[lang].ex.map((e, i) => `<button class="lnk" data-ex="${i}">${esc(e[0])}</button>`).join(''); $$('[data-ex]').forEach(b => b.onclick = () => { setSQL(I[lang].ex[+b.dataset.ex][1]); run(); $('#sql').focus(); }); }
function renderHist(){ const h = ls.get('sq.hist', []); $('#hist').innerHTML = h.length ? h.map((s, i) => `<button class="lnk" data-h="${i}" style="font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(s)}">${esc(s.replace(/\s+/g, ' ').slice(0, 60))}</button>`).join('') : `<p class="empty" style="font-size:12px">${t('histEmpty')}</p>`; $$('[data-h]').forEach(b => b.onclick = () => { setSQL(h[+b.dataset.h]); $('#sql').focus(); }); }
function renderCh(){
  const d = done(), list = I[lang].ch; $('#prog').textContent = '★ ' + t('progress', { n:Object.keys(d).length, t:list.length });
  $('#chs').innerHTML = list.map((c, i) => `<div class="ch${d[i] ? ' done' : ''}${active === i ? ' active' : ''}"><button class="h" data-open="${i}" aria-expanded="${active === i}"><i aria-hidden="true">${d[i] ? '✓' : i + 1}</i>${esc(c[0])}</button>${active === i ? `<div class="body"><p>${esc(c[1])}</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm primary" data-check="${i}">${t('check')}</button>${hints[i] ? '' : `<button class="btn sm" data-hint="${i}">${t('showHint')}</button>`}</div>${hints[i] ? `<p class="hint"><b>${t('hint')}:</b> ${esc(c[2])}</p>` : ''}${verdict && verdict.i === i ? `<p class="verdict ${verdict.ok ? 'y' : 'n'}" role="status">${verdict.ok ? t('right') : t('wrong', { w:verdict.why })}</p>` : ''}</div>` : ''}</div>`).join('');
  $$('[data-open]').forEach(b => b.onclick = () => { const i = +b.dataset.open; active = active === i ? null : i; ls.set('sq.active', active); if (verdict && verdict.i !== active) verdict = null; renderCh(); const nb = $(`[data-open="${i}"]`); nb && nb.focus(); });
  $$('[data-check]').forEach(b => b.onclick = () => { run(+b.dataset.check); const nb = $(`[data-check="${b.dataset.check}"]`); nb && nb.focus(); });
  $$('[data-hint]').forEach(b => b.onclick = () => { hints[+b.dataset.hint] = 1; renderCh(); });
}
function setView(v){ view = v; $('#vT').setAttribute('aria-pressed', v === 'table'); $('#vC').setAttribute('aria-pressed', v === 'chart'); if (last) renderOut(); }
function applyLang(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('#lang').textContent = lang === 'ro' ? 'EN' : 'RO'; $('#lang').setAttribute('aria-label', lang === 'ro' ? 'Switch to English' : 'Schimbă în română');
  document.title = lang === 'ro' ? 'SQL Playground — SQLite în browser peste o bază CRM | Laura Andreea' : 'SQL Playground — SQLite in the browser over a CRM database | Laura Andreea';
  renderEx(); renderHist(); renderSchema(); renderCh(); if (last) renderOut();
}
$('#sql').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
  else if (e.key === 'Tab' && !e.shiftKey && !e.altKey && !e.ctrlKey){ const el = e.target; if (el.selectionStart !== el.selectionEnd || el.value.slice(0, el.selectionStart).split('\n').pop().trim() !== '') return; e.preventDefault(); el.setRangeText('  ', el.selectionStart, el.selectionEnd, 'end'); }
});
$('#sql').addEventListener('input', e => ls.set('sq.sql', e.target.value));
$('#run').onclick = () => run(); $('#vT').onclick = () => setView('table'); $('#vC').onclick = () => setView('chart');
$('#csv').onclick = () => { if (!last) return; const cell = v => { v = v == null ? '' : String(v); if (/^[=+\-@]/.test(v) && isNaN(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }, a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + [last.columns.map(cell).join(',')].concat(last.values.map(r => r.map(cell).join(','))).join('\n')], { type:'text/csv' })); a.download = 'result.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500); };
$('#reset').onclick = () => { if (!SQL) return; seed(); renderSchema(); $('#status').textContent = t('resetDone'); run(); };
$('#theme').onclick = () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = th; ls.set('sq.theme', th); };
$('#lang').onclick = () => { lang = lang === 'ro' ? 'en' : 'ro'; ls.set('sq.lang', lang); applyLang(); };
document.documentElement.dataset.theme = ls.get('sq.theme', 'dark');
$('#sql').value = ls.get('sq.sql', I[lang].ex[1][1]);
applyLang(); boot();
window.SQP = { query:s => query(s), judge, REF };
})();
