.daily b{font-family:var(--display);font-size:17px}

nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel)}

.row.branch{margin-left:22px;border-left:3px solid var(--cyan)}

const weekId=()=>{const d=new Date(),o=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-W'+Math.ceil(((d-o)/864e5+o.getDay()+1)/7)};
const hash=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296};
const dailyDef=()=>{const h=hash(today());return{isle:ISLES[h%12],mod:MODS[(h>>>5)%3],seed:h%46656+1}};
const weeklyDef=()=>{const h=hash(weekId()),r=mulberry(h),ids=ISLES.map(s=>s.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}return{ids:ids.slice(0,3),mod:MODS[h%3],seed:h%46656+1}};
function season(){const d=new Date(),m=d.getMonth()+1,x=d.getDate();if((m===10&&x>=20)||(m===11&&x<=2))return'hw';if(m===12||(m===1&&x<=6))return'xm';if((m===3&&x>=25)||(m===4&&x<=25))return'ea';return null}

const codeOf=(id,level,mi,seed)=>'K'+(((ISLES.findIndex(s=>s.id===id)*5+(level-1))*4+mi)*46656+(seed-1)).toString(36).toUpperCase();
function codeParse(c){c=(c||'').trim().toUpperCase();if(!/^K[0-9A-Z]{1,8}$/.test(c))return null;const n=parseInt(c.slice(1),36);if(!isFinite(n))return null;const seed=n%46656+1,r=Math.floor(n/46656),mi=r%4,q=Math.floor(r/4),level=q%5+1,ii=Math.floor(q/5);if(ii>11)return null;return{id:ISLES[ii].id,level,mi,seed}}

function tone(f,d,type,v,slide,delay,music=false){const a=AC;if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
 o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);
 g.gain.setValueAtTime((v||.1)*(music?(window.KygoUniverse?.prefs.music??100):(window.KygoUniverse?.prefs.sfx??100))/100,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}

 pick(){fxOn()&&tone(820,.09,'triangle',.09,400)},gold(){if(fxOn()){tone(880,.1,'triangle',.11);tone(1320,.18,'triangle',.11,0,.09)}},
 hurt(){fxOn()&&tone(170,.32,'sawtooth',.13,-110)},bark(){if(fxOn()){tone(330,.09,'square',.12,-150);tone(280,.13,'square',.12,-150,.12)}},
 hit(){fxOn()&&tone(240,.05,'square',.07)},boom(){fxOn()&&tone(120,.2,'sawtooth',.1,-70)},click(){fxOn()&&tone(600,.04,'triangle',.06)},
 win(){fxOn()&&[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.11,0,i*.11))},lose(){fxOn()&&[392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.1,0,i*.16))}
};
