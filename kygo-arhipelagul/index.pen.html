<style>
:root{
  /* layout: one portrait column (max 560px), scent-trail map, bottom nav; single dark world by choice */
  --bg:#07101f; --panel:#0e1b31; --line:#1f3352; --text:#e9f1fb; --muted:#8fa5c2;

  color-scheme:dark;
}
:root.hc{--bg:#000;--panel:#0a0a0a;--line:#fff;--text:#fff;--muted:#e6e6e6;--cyan:#6ff;--amber:#ffd000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:18px 16px 24px;min-height:0}
#view.play{padding:0;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px}
p{margin:0}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.top .who{display:flex;gap:12px;align-items:center}
.purse{font:700 15px var(--mono);color:var(--amber);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.btn{background:var(--amber);color:#1a1202;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.daily{border:1px solid var(--line);border-left:4px solid var(--amber);background:var(--panel);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.daily b{font-family:var(--display);font-size:17px}
.trail{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:12px}
.trail li{position:relative}
.trail li::before{content:"";position:absolute;left:-29px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--cyan))}
.isle{width:100%;text-align:left;display:grid;grid-template-columns:48px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 60%);border:1px solid var(--line)}
.isle .glyph{grid-row:1/3;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.isle .nm{font:700 18px var(--display)}
.isle .src{grid-column:2;font-size:12px;color:var(--muted)}
.isle .st{grid-row:1/3;grid-column:3;font:700 13px var(--mono);color:var(--amber);text-align:right}
.isle.locked{opacity:.55}
.isle.locked .st{color:var(--muted)}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.credit{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel)}
nav[hidden]{display:none}
nav button{padding:12px 4px;font:600 13px var(--body);color:var(--muted);min-height:48px}
nav button[aria-current="page"]{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}
.back{color:var(--cyan);font-weight:600;padding:8px 0;margin-bottom:8px}
.rows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.row>div{min-width:0}
.row b{display:block}
.stars{font:700 16px var(--mono);color:var(--amber);letter-spacing:2px}
.info{display:grid;gap:8px;margin:14px 0;padding:14px;border-left:3px solid var(--c,var(--cyan));background:var(--panel);border-radius:0 12px 12px 0}
.info dt{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.info dd{margin:0 0 4px}
.pips{font-family:var(--mono);color:var(--cyan);letter-spacing:3px}
.coats{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.coat{width:64px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;font-size:11px;text-align:center;background:var(--panel)}
.coat i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(255,255,255,.25)}
.coat[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.ach{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ach .ck{font-family:var(--mono);color:var(--muted)} .ach.done .ck{color:var(--good)}
.ach small{grid-column:2;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 12px;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#04202a}
/* play */
.hud{display:grid;grid-template-columns:44px auto 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;font:700 14px var(--mono);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.hud #hL{color:var(--bad);letter-spacing:1px} .hud #hG{text-align:center;color:var(--text)} .hud #hB{color:var(--amber)} .hud #hS{color:var(--cyan)}
.hud button{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;font-weight:700}
#stage{flex:1;position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}
canvas#cv{display:block;touch-action:none;border-radius:0 0 14px 14px;background:#050b17}
#stage>canvas{grid-area:1/1}
canvas#cv.over{background:transparent;position:relative;z-index:1}
canvas#gl{display:block;border-radius:0 0 14px 14px}
#bark{z-index:2}#ov{z-index:3}
#bark{position:absolute;right:14px;bottom:14px;width:76px;height:76px;border-radius:50%;font:700 14px var(--mono);color:#1a1202;
  background:conic-gradient(var(--amber) calc(var(--p,1)*360deg),#5a4a2a 0);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--amber)}
#bark[disabled]{color:#d8c9a8;box-shadow:0 0 0 2px #5a4a2a}
#ov{position:absolute;inset:0;background:rgba(4,9,20,.88);display:grid;place-items:center;padding:20px;overflow:auto}
#ov[hidden]{display:none}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card .stars{font-size:34px}
.card .big{font:700 30px var(--mono);color:var(--cyan)}
.card .acts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--good)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function tone(f,d,type,v,slide,delay){const a=AC;if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
 o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);
 g.gain.setValueAtTime(v||.1,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}

 pick(){fxOn()&&tone(820,.09,'triangle',.09,400)},gold(){if(fxOn()){tone(880,.1,'triangle',.11);tone(1320,.18,'triangle',.11,0,.09)}},
 hurt(){fxOn()&&tone(170,.32,'sawtooth',.13,-110)},bark(){if(fxOn()){tone(330,.09,'square',.12,-150);tone(280,.13,'square',.12,-150,.12)}},
 hit(){fxOn()&&tone(240,.05,'square',.07)},boom(){fxOn()&&tone(120,.2,'sawtooth',.1,-70)},click(){fxOn()&&tone(600,.04,'triangle',.06)},
 win(){fxOn()&&[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.11,0,i*.11))},lose(){fxOn()&&[392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.1,0,i*.16))}
};

  pool('r',g.foods.filter(f=>f.c===g.lastC&&g.chain>0),()=>{const r=mesh(GEO.tor,MB('#ffffff'),cs*.5);r.rotation.x=Math.PI/2;r.castShadow=false;return r},(m,f)=>put(m,px(f),py(f),.06));
  pool('s',g.sn.slice(1),()=>mesh(GEO.sph,A,cs*.42),(m,s,i)=>{put(m,px(s),py(s),cs*.42);m.material=i%2?A:B});
  const h=g.sn[0];put(t3.head,px(h),py(h),cs*.6);t3.head.rotation.y=Math.atan2(g.dir.x,g.dir.y);t3.head.visible=!(R.inv>0&&Math.floor(R.t*12)%2);
  t3.gold.visible=!!g.gold;if(g.gold){put(t3.gold,px(g.gold),py(g.gold),0);spinBone(t3.gold,cs*.6)}
  t3.floor.material.color.set(g.slow>0?'#8fd6ff':'#ffffff');return[px(h),py(h)]}
};

/* ----- Arena ----- */
G3.arena={
 build(){const sc=T.scene,h=H/T.U,hz=h/2,gw=g.gw/T.U,sw=(10-gw)/2,r=g.p.r/T.U;sc.background=new THREE.Color('#07101f');lights(true);
  const tx=ctex(256,512,(x,w,hh)=>{x.fillStyle='#0f2f47';x.fillRect(0,0,w,hh);x.strokeStyle='rgba(98,227,161,.75)';x.lineWidth=4;x.beginPath();x.moveTo(0,hh/2);x.lineTo(w,hh/2);x.stroke();x.beginPath();x.arc(w/2,hh/2,w*.16,0,7);x.stroke();x.strokeRect(4,4,w-8,hh-8)});
  ground(10,h,new THREE.MeshStandardMaterial({map:tx,roughness:.45}));const rail=M('#24506e',{roughness:.6});
  for(const s of[-1,1]){at(mesh(GEO.box,rail,.3,.45,h+.6),s*5.15,.22,0);for(const e of[-1,1])at(mesh(GEO.box,rail,sw,.45,.3),s*(gw/2+sw/2),.22,e*(hz+.15))}
  at(mesh(GEO.box,glow('#ff5d6c',.9),gw,.1,.25),0,.05,-hz-.12);at(mesh(GEO.box,glow('#ffb547',.9),gw,.1,.25),0,.05,hz+.12);
  for(const b of g.bump){const m=mesh(GEO.cyl,M('#ffb547',{roughness:.4}),b.r/T.U,.45,b.r/T.U);put(m,b.x,b.y,.22);sc.add(m)}
  const pad=c=>{const p=new THREE.Group();at(mesh(GEO.cyl,M(c,{roughness:.4}),r,.2,r),0,.1,0,p);at(mesh(GEO.cyl,M(c,{roughness:.4}),r*.4,.3,r*.4),0,.35,0,p);sc.add(p);return p};
  t3.p=pad('#ffb547');const hd=makeHead();hd.scale.setScalar(.75);hd.position.y=.72;t3.p.add(hd);t3.hd=hd;
  t3.a=pad('#ff5d6c');for(const x of[-.14,.14]){at(mesh(GEO.sph,M('#ffffff'),.1),x,.6,.12,t3.a);at(mesh(GEO.sph,M('#14100e'),.05),x,.6,.2,t3.a)}at(mesh(GEO.sph,M('#b0303f',{roughness:.5}),.24),0,.6,0,t3.a);
  t3.stun=mesh(GEO.tor,glow('#ffb547',1),.4);t3.stun.rotation.x=Math.PI/2;sc.add(t3.stun);
  t3.k=mesh(GEO.cyl,M('#f4f8ff',{emissive:'#ffffff',emissiveIntensity:.4,roughness:.3}),g.k.r/T.U,.14,g.k.r/T.U);sc.add(t3.k);fit(50)},
 sync(dt){put(t3.p,g.p.x,g.p.y,0);put(t3.a,g.a.x,g.a.y,0);put(t3.k,g.k.x,g.k.y,.07);t3.hd.visible=!(R.inv>0&&Math.floor(R.t*12)%2);
  t3.stun.visible=g.stun>0;put(t3.stun,g.a.x,g.a.y,1.1);t3.stun.rotation.z=R.t*8;
  pool('g',g.golds,()=>bone3(true,1.4),(m,o)=>{put(m,o.x,o.y,0);spinBone(m,.5)});return[g.p.x,g.p.y]}
};

/* ----- Livada ----- */
G3.livada={
 build(){const sc=T.scene,hz=H/T.U/2;T.wall=true;sc.background=new THREE.Color('#12233a');lights(false);
  const bg=ctex(64,256,(x,w,h)=>{const gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0c1830');gr.addColorStop(.7,'#1b3350');gr.addColorStop(1,'#24482c');x.fillStyle=gr;x.fillRect(0,0,w,h)});
  at(new THREE.Mesh(new THREE.PlaneGeometry(70,60),new THREE.MeshBasicMaterial({map:bg})),0,0,-12);at(mesh(GEO.sph,MB('#fff3c4'),1.3),4.5,hz*.62,-11);
  at(mesh(GEO.sph,M('#1d3a26',{roughness:1}),16,3,4),0,-hz-1.9,-3);
  for(let i=0;i<5;i++){const x=-8+i*4,z=-4-(i%2)*2.5,y=-hz;at(mesh(GEO.cyl,M('#5a3a1c'),.28,3.4,.28),x,y+1.4,z);at(mesh(GEO.sph,M('#2f6238',{roughness:1}),2),x,y+3.9,z);at(mesh(GEO.sph,M('#3a7444',{roughness:1}),1.3),x+.9,y+4.8,z+.4);
   for(const[a,b]of[[-.9,3.6],[.8,4.4],[.1,3.1]])at(mesh(GEO.sph,M(FRUIT[i%4][0]),.22),x+a,y+b,z+1.7)}
  t3.dog=makeDog();t3.dog.scale.setScalar(1.15);t3.dog.position.set(-3.8,-hz+.05,.8);t3.dog.rotation.y=.45;sc.add(t3.dog);fit(0)},
 make(it){const r=it.r/T.U,g=new THREE.Group();if(it.type==='g')return bone3(true,1.7);
  if(it.type==='b'){at(mesh(GEO.sph,M('#3b2d16',{roughness:.9}),r),0,0,0,g);for(const y of[-.35,0,.35]){const t=at(mesh(GEO.tor,glow('#ffd000',.6),r*Math.sqrt(1-y*y)*1.02),0,y*r,0,g);t.rotation.x=Math.PI/2}
   for(let i=0;i<6;i++){const a=i/6*TAU,c=at(mesh(GEO.cone,glow('#ffd000',.6),r*.18,r*.5,r*.18),Math.cos(a)*r*1.1,Math.sin(a)*r*1.1,0,g);c.rotation.z=a-Math.PI/2}return g}
  const f=FRUIT[it.kind],m=M(f[0],{roughness:.45});if(it.kind===3){at(mesh(GEO.sph,m,r*.8,r*.9,r*.8),0,-r*.15,0,g);at(mesh(GEO.sph,m,r*.52),0,r*.6,0,g)}else at(mesh(GEO.sph,m,r),0,0,0,g);
  at(mesh(GEO.cyl,M('#5a3a1c'),.035,r*.5,.035),0,r*1.1,0,g);at(mesh(GEO.sph,M('#62e3a1'),.16,.04,.09),.14,r*1.2,0,g);return g},
 sync(dt){animDog(t3.dog,false);pool('i',g.it,this.make,(m,it)=>{put(m,it.x,it.y,0);if(it.type==='g')spinBone(m,0);else{m.rotation.z=it.rot;m.rotation.x=it.rot*.6}});return[W*.12,H-40]},
 ov2d(){cx.lineCap='round';for(const s of g.trail){const a=T.proj(s.x1,s.y1),b=T.proj(s.x2,s.y2);cx.strokeStyle='rgba(255,255,255,'+clamp(s.l*5,0,1)+')';cx.lineWidth=5*s.l/.18+1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
  if(g.kb){const q=T.proj(g.cur.x,g.cur.y);cx.strokeStyle='#ffb547';cx.lineWidth=2;cx.beginPath();cx.arc(q.x,q.y,12,0,TAU);cx.stroke();cx.beginPath();cx.moveTo(q.x-18,q.y);cx.lineTo(q.x+18,q.y);cx.moveTo(q.x,q.y-18);cx.lineTo(q.x,q.y+18);cx.stroke()}}
};

/* ----- Conacul ----- */
G3.conac={
 build(){const sc=T.scene,cs=t3.cs=g.cs/T.U,bw=g.cols*cs,bh=g.rows*cs;sc.background=new THREE.Color('#06050f');
  t3.amb=new THREE.AmbientLight(0x9a90ff,.13);sc.add(t3.amb);t3.lamp=new THREE.PointLight(0xffdcaa,2.6,cs*5,1.2);sc.add(t3.lamp);
  const tx=ctex(64,64,x=>{x.fillStyle='#4a3f86';x.fillRect(0,0,64,64);x.fillStyle='#3e3474';x.fillRect(0,0,32,32);x.fillRect(32,32,32,32)});tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(g.cols,g.rows);
  ground(bw,bh,new THREE.MeshStandardMaterial({map:tx,roughness:1}));
  const segs=[],X=x=>gx(g.ox+x*g.cs),Z=y=>gz(g.oy+y*g.cs);
  for(let y=0;y<g.rows;y++)for(let x=0;x<g.cols;x++){const o=g.open[y*g.cols+x];if(!(o&1))segs.push([X(x+.5),Z(y),1]);if(!(o&8))segs.push([X(x),Z(y+.5),0]);if(y===g.rows-1)segs.push([X(x+.5),Z(y+1),1]);if(x===g.cols-1)segs.push([X(x+1),Z(y+.5),0])}
  const im=new THREE.InstancedMesh(GEO.box,M('#9d8cf5',{roughness:.8}),segs.length),mt=new THREE.Matrix4(),q=new THREE.Quaternion(),p=V3(),s=V3();
  segs.forEach(([x,z,hz],i)=>{p.set(x,.45,z);s.set(hz?cs+.14:.14,.9,hz?.14:cs+.14);mt.compose(p,q,s);im.setMatrixAt(i,mt)});sc.add(im);
  t3.dog=makeDog();t3.dog.scale.setScalar(cs*.62);sc.add(t3.dog);fit(60)},
 sync(dt){const cs=t3.cs,pp=G.pos(g.p),p=g.p,mv=p.t!==null;put(t3.dog,pp.x,pp.y,0);if(mv)t3.dog.rotation.y=Math.atan2(p.cx-p.fx,p.cy-p.fy);animDog(t3.dog,mv);
  t3.lamp.position.set(gx(pp.x),1.4,gz(pp.y));t3.amb.intensity=lerp(t3.amb.intensity,g.rev>0?.95:.13,.15);
  const px=c=>g.ox+(c.x+.5)*g.cs,py=c=>g.oy+(c.y+.5)*g.cs;
  pool('gh',g.ghosts.filter(o=>!o.f),()=>{const gr=new THREE.Group(),w=M('#eef1ff',{roughness:.6});at(mesh(GEO.sph,w,cs*.3),0,cs*.62,0,gr);at(mesh(GEO.cyl,w,cs*.3,cs*.4,cs*.3),0,cs*.42,0,gr);for(const x of[-.1,.1])at(mesh(GEO.sph,M('#17132b'),cs*.055),x*cs,cs*.66,cs*.27,gr);return gr},
   (m,o)=>{put(m,px(o),py(o),Math.sin(R.t*3+o.x)*.06+.05)});
  pool('go',g.golds.filter(o=>!o.f),()=>bone3(true,cs*1.1),(m,o)=>{put(m,px(o),py(o),0);spinBone(m,cs*.5)});
  pool('sh',g.sh,()=>{const gr=new THREE.Group(),b=mesh(GEO.ico,M('#9c2040',{flatShading:true,roughness:.6}),cs*.34);b.position.y=cs*.42;gr.add(b);gr.userData.body=b;for(const x of[-.11,.11])at(mesh(GEO.sph,MB('#ffd000'),cs*.06),x*cs,cs*.5,cs*.3,gr);return gr},
   (m,s)=>{const q=G.pos(s);put(m,q.x,q.y,0);if(g.rev<=0){m.userData.body.rotation.y+=dt*3;m.userData.body.rotation.x+=dt*2}});
  return[pp.x,pp.y]}
};
