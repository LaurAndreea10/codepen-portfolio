<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diplomă · Grădina Curioasă</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Georgia,"DejaVu Serif",serif;background:#e9efe6;color:#193147;min-height:100vh;display:grid;place-items:center;padding:16px}
.sheet{width:min(1000px,100%);aspect-ratio:297/210;background:#fffdf5;position:relative;padding:4.5% 6%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 40px #0003;border-radius:6px;overflow:hidden}
.sheet::before{content:"";position:absolute;inset:2.2%;border:6px double #c99a06;border-radius:4px;pointer-events:none}
.sheet::after{content:"";position:absolute;inset:3.6%;border:2px solid #ffc978;border-radius:2px;pointer-events:none}
.corner{position:absolute;font-size:clamp(20px,4vw,40px)}.tl{top:5%;left:5%}.tr{top:5%;right:5%}.bl{bottom:5%;left:5%}.br{bottom:5%;right:5%}
.brand{font-family:system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#9b4f12;font-size:clamp(10px,1.6vw,15px)}
h1{font-size:clamp(28px,6.4vw,64px);margin:.2em 0 .1em;color:#7b2cbf;letter-spacing:.04em}
.to{font-style:italic;font-size:clamp(13px,2vw,20px);margin:.3em 0}
.name{font-size:clamp(30px,6vw,60px);font-weight:700;border-bottom:2px solid #ffc978;padding:0 .6em .05em;margin:.1em 0 .3em;color:#193147}
.badge{display:flex;align-items:center;gap:.5em;font-size:clamp(16px,2.8vw,28px);font-weight:700;margin:.2em 0}.badge .icon{font-size:1.4em}
.desc{font-size:clamp(12px,1.9vw,19px);margin:.2em 0 .8em;color:#405c67}
.foot{display:flex;justify-content:space-between;align-items:flex-end;width:78%;margin-top:auto;font-family:system-ui,sans-serif;font-size:clamp(10px,1.5vw,14px);color:#405c67}
.foot .sig{display:flex;align-items:center;gap:.4em}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-family:system-ui,sans-serif}
.actions button,.actions a{font:inherit;font-weight:800;border:2px solid #193147;background:#ffc978;color:#193147;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none}
.actions a{background:#fff}
.hint{font-family:system-ui,sans-serif;font-size:13px;color:#405c67;text-align:center;margin:6px 0 0}
@media print{body{background:#fff;padding:0;display:block}.sheet{width:297mm;height:210mm;aspect-ratio:auto;box-shadow:none;border-radius:0}.actions,.hint{display:none}}
</style>
</head>
<body>
<main>
<div class="sheet" id="sheet">
  <span class="corner tl">🌸</span><span class="corner tr">⭐</span><span class="corner bl">🌱</span><span class="corner br">🦋</span>
  <div class="brand" id="brand">Grădina Curioasă</div>
  <h1 id="title">Diplomă</h1>
  <div class="to" id="to">se acordă lui / ei</div>
  <div class="name" id="name">Explorator</div>
  <div class="badge"><span class="icon" id="icon">🏅</span><span id="badge">Insignă</span></div>
  <div class="desc" id="desc"></div>
  <div class="foot"><span id="date"></span><span class="sig"><span id="bia"></span><span id="sign">Bia și echipa Grădinii Curioase</span></span></div>
</div>
<div class="actions"><button type="button" id="print">🖨️ Tipărește sau salvează PDF</button><a href="./" id="back">← Înapoi la joc</a></div>
<p class="hint" id="hint">Pentru PDF, alege „Salvează ca PDF” în fereastra de tipărire.</p>
</main>
<script src="art.js"></script>
<script>
(()=>{
const T={ro:{title:'Diplomă',to:'se acordă lui / ei',sign:'Bia și echipa Grădinii Curioase',print:'🖨️ Tipărește sau salvează PDF',back:'← Înapoi la joc',hint:'Pentru PDF, alege „Salvează ca PDF” în fereastra de tipărire.',anon:'Explorator curios',brand:'Grădina Curioasă'},
en:{title:'Certificate',to:'is awarded to',sign:'Bia and the Curious Garden team',print:'🖨️ Print or save as PDF',back:'← Back to the game',hint:'For a PDF, choose “Save as PDF” in the print window.',anon:'Curious explorer',brand:'Curious Garden'},
hu:{title:'Oklevél',to:'kitüntetettje',sign:'Bia és a Kíváncsi Kert csapata',print:'🖨️ Nyomtatás vagy mentés PDF-be',back:'← Vissza a játékhoz',hint:'PDF-hez válaszd a „Mentés PDF-ként” lehetőséget a nyomtatási ablakban.',anon:'Kíváncsi felfedező',brand:'Kíváncsi Kert'},
uk:{title:'Грамота',to:'вручається',sign:'Бія та команда Цікавого саду',print:'🖨️ Надрукувати або зберегти PDF',back:'← Назад до гри',hint:'Щоб отримати PDF, оберіть «Зберегти як PDF» у вікні друку.',anon:'Цікавий дослідник',brand:'Цікавий сад'}};
const q=new URLSearchParams(location.search),lang=T[q.get('lang')]?q.get('lang'):'ro',t=T[lang],$=id=>document.getElementById(id);
const clip=(v,n)=>String(v||'').replace(/\s+/g,' ').trim().slice(0,n);
document.documentElement.lang=lang;document.title=`${t.title} · ${t.brand}`;
$('brand').textContent=t.brand;$('title').textContent=t.title;$('to').textContent=t.to;$('sign').textContent=t.sign;$('print').textContent=t.print;$('back').textContent=t.back;$('hint').textContent=t.hint;
$('name').textContent=clip(q.get('name'),40)||t.anon;$('badge').textContent=clip(q.get('badge'),60);$('desc').textContent=clip(q.get('desc'),120);$('icon').textContent=clip(q.get('icon'),8)||'🏅';
const d=q.get('date');const when=/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T12:00:00'):new Date();$('date').textContent=when.toLocaleDateString({ro:'ro-RO',en:'en-GB',hu:'hu-HU',uk:'uk-UA'}[lang],{day:'numeric',month:'long',year:'numeric'});
if(window.gardenArt)$('bia').append(gardenArt('ladybug',34));
$('print').onclick=()=>window.print();
})();
</script>
</body></html>
