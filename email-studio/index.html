let toastT; function toast(m){ const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200); }
function say(m){ $('#live').textContent = ''; setTimeout(() => $('#live').textContent = m, 30); }
const tabs = ['blk', 'glb', 'chk'];
function showTab(k){ tabs.forEach(x => { const on = x === k; $('#tab-' + x).setAttribute('aria-selected', on); $('#tab-' + x).tabIndex = on ? 0 : -1; $('#p-' + x).hidden = !on; }); }
tabs.forEach((k, i) => { const b = $('#tab-' + k); b.onclick = () => showTab(k); b.onkeydown = e => { const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (d){ const x = tabs[(i + d + 3) % 3]; showTab(x); $('#tab-' + x).focus(); } }; });
function applyLang(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('#lang').textContent = lang === 'ro' ? 'EN' : 'RO'; $('#lang').setAttribute('aria-label', lang === 'ro' ? 'Switch to English' : 'Schimbă în română');
  $('#tpl').innerHTML = `<option value="">${t('tplPick')}</option><option value="news">${t('tplNews')}</option><option value="promo">${t('tplPromo')}</option><option value="welcome">${t('tplWelcome')}</option>`;
  $('#sample').innerHTML = `<option value="-1">${t('sNone')}</option>` + SAMPLES.map((s, i) => `<option value="${i}"${i === sample ? ' selected' : ''}>${s.first_name} · ${s.company}</option>`).join('');
  document.title = lang === 'ro' ? 'Email Studio — builder de emailuri cu export HTML compatibil Outlook | Laura Andreea' : 'Email Studio — email builder with Outlook-safe HTML export | Laura Andreea';
  renderPalette(); render();
}
document.addEventListener('keydown', e => { const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); e.shiftKey ? redo() : undo(); } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing){ e.preventDefault(); redo(); } else if (e.key === '?' && !typing && !$('dialog[open]')) openHelp(); });
function openHelp(){ $('#helpBody').innerHTML = t('help'); $('#help').showModal(); }
$$('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; render(); });
$('#sample').onchange = e => { sample = +e.target.value; render(); };
$('#undo').onclick = undo; $('#redo').onclick = redo; $('#copy').onclick = copyHTML; $('#dl').onclick = downloadHTML; $('#helpB').onclick = openHelp;
$('#json').onclick = () => $('#proj').showModal(); $$('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
$('#pExp').onclick = () => download('email-studio.json', JSON.stringify({ app:'email-studio', v:1, ...doc }, null, 1), 'application/json');
$('#pImp').onclick = () => $('#file').click();
$('#pNew').onclick = () => { if (!doc.blocks.length || confirm(t('confirmNew'))){ doc = { g:doc.g, blocks:[] }; sel = null; commit(); $('#proj').close(); } };
$('#file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try{ const d = cleanDoc(JSON.parse(await f.text())); if (!d) throw 0; loadDoc(d, true); $('#proj').close(); toast(t('loaded')); }catch(_){ toast(t('bad')); } };
$('#tpl').onchange = e => { if (e.target.value){ loadDoc(template(e.target.value), true); e.target.value = ''; } };
$('#theme').onclick = () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = th; ls.set('es.theme', th); };
$('#lang').onclick = () => { lang = lang === 'ro' ? 'en' : 'ro'; ls.set('es.lang', lang); applyLang(); };

/* ---------- init ---------- */
document.documentElement.dataset.theme = ls.get('es.theme', 'dark');
doc = cleanDoc(ls.get('es.doc', null)) || template('news'); if (!doc.blocks.length && !ls.get('es.doc', null)) doc = template('news');
last = snap(); applyLang();
window.ES = { buildHTML, checks, template, loadDoc, get doc(){ return doc; } };
})();
</script>
</body>
</html>
