  ch:['Efficient welcome', 'Fast sprint', 'Retention master'], axisX:'Unsubscribes (%) →', axisY:'Conversion (%)',
  cap:'Each dot is a flow. The green zone shows the conversion and unsubscribe thresholds; some challenges also cap messages or days, so a dot inside the zone can stay grey. Dots with a yellow outline are the app’s templates.',
  thFlow:'Flow', thConv:'Conversion', thUnsub:'Unsubscribes', thDays:'Days', thMsgs:'Messages',
  flows:{ tplW:'Template: welcome series', tplC:'Template: abandoned cart', tplR:'Template: win-back', f1:'1 email, check after 2 days', f0:'1 email, immediate check', f2:'2 emails, 2 days each', f3a:'3 emails, 1 day each', f3b:'3 emails, 2 days each', f4:'4 emails, 2 days each', f3t:'3 emails, the third only to openers' },
  e5:'Testing', h2e:'What broke along the way',
  bugs:[
    ['Purchase checks chained forever', 'The first version of the model gave a fresh chance to buy at every “Purchased?” step, even with no new message. Ten checks in a row meant free conversion. Now the chance counts once per message and grows with the days waited.'],
    ['The “Stop” button was always visible', 'The hidden attribute was overridden by display:inline-flex from the button class. One rule, [hidden]{display:none!important}, fixed every case of this kind.'],
    ['The win-back template was losing contacts', 'The “Last chance” email had no outgoing connection, so everyone who reached it vanished from the simulation. The app’s own warning for unconnected outputs is what exposed it.'],
    ['On a phone, the palette covered the editor', 'The horizontal-row style sat on the wrong container, and auto-fit shrank the flow until it was unreadable. Now the palette is a scrolling strip and zoom never drops below 45%.'],
    ['The automatic insight pointed at the wrong step', 'The “most contacts stop at…” message pointed at the Exit node, where everyone who does not buy ends up by definition. It was replaced with useful observations: unconnected outputs and a high unsubscribe rate.'],
    ['An ROI of tens of thousands of percent', 'The cost of an email is so small that the computed ROI looked absurd and did not help comparison. The metric became “revenue per contact”.']
  ],
  e6:'Verification', h2f:'What is tested and what is not', vYes:'Tested automatically in Chromium', vNo:'Not verified',
  yes:['Adding, moving and connecting steps, by mouse and from the panel', 'Undo and redo', 'Animated and instant simulation, with identical results', 'The three challenges and the three templates', 'Share link and JSON import', 'Widths of 1440, 1200 and 390 px'],
  no:['Physical phones and real touch screens', 'Safari and Firefox', 'Screen readers', 'Flows with hundreds of nodes'],
  e7:'Next', h2g:'What would be worth adding', next:['Multi-select and moving several steps at once, a minimap for large flows and export as an image. On the model side, weekdays and send times would bring the simulation closer to a real tool.', 'These remain ideas, not promises: nothing on this list has been started.']
}};
const t = k => T[lang][k];
let chI = ls.get('jbcs.ch', 0);
function model(){
  const n = +$('#mN').value - 1, d = +$('#mD').value, e = +$('#mE').value, open = 35 * Math.pow(.92, n), unsub = .8 * (1 + .6 * n), buy = 4 * [1, 2, 4][e] * Math.min(1, .4 + .3 * d);
  $('#mNV').textContent = n + 1; $('#mDV').textContent = d;
  $('#mOut').innerHTML = [[t('oOpen'), open, 40], [t('oUnsub'), unsub, 4], [t('oBuy'), buy, 16]].map(([l, v, mx]) => `<div class="o"><small>${l}</small><b>${N(v, 1)}%</b><div class="bar"><i style="width:${Math.min(100, v / mx * 100)}%"></i></div></div>`).join('');
}
function plot(){
  const c = CH[chI], W = 760, H = 380, l = 50, r = 20, top = 16, bot = 330, mx = 6, my = 22, X = v => l + v / mx * (W - l - r), Y = v => bot - v / my * (bot - top), F = T[lang].flows;
  $$('#chBtns button').forEach((b, i) => b.setAttribute('aria-pressed', i === chI));
  const lblSide = { f3b:'r', f4:'l', f3a:'r', f2:'l', f3t:'l', f1:'r', f0:'r', tplW:'r', tplC:'r', tplR:'l' };
  $('#plot').innerHTML = [0, 5, 10, 15, 20].map(v => `<line class="gl" x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${l - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('') + [0, 1, 2, 3, 4, 5, 6].map(v => `<text class="ax" x="${X(v)}" y="${bot + 18}" text-anchor="middle">${v}</text>`).join('') +
    `<rect class="zone" x="${X(0)}" y="${Y(my)}" width="${X(c.unsub) - X(0)}" height="${Y(c.conv) - Y(my)}"/><text class="ax" x="${W - r}" y="${bot + 36}" text-anchor="end">${t('axisX')}</text><text class="ax" x="${l}" y="${top - 2}">${t('axisY')}</text>` +
    FLOWS.map(f => { const ok = pass(f, c), x = X(f.v[1]), y = Y(f.v[0]), left = lblSide[f.k] === 'l'; return `<circle class="pt${ok ? ' pass' : ''}${f.tpl ? ' tpl' : ''}" cx="${x}" cy="${y}" r="7"><title>${F[f.k]}: ${N(f.v[0], 2)}% / ${N(f.v[1], 2)}%</title></circle><text class="pl" x="${x + (left ? -11 : 11)}" y="${y + 4}" text-anchor="${left ? 'end' : 'start'}">${F[f.k].replace(/^(Șablon|Template): /, '◆ ')}</text>`; }).join('');
  $('#plotCap').textContent = t('cap');
  $('#tbl').innerHTML = `<thead><tr><th scope="col">${t('thFlow')}</th><th scope="col" class="n">${t('thConv')}</th><th scope="col" class="n">${t('thUnsub')}</th><th scope="col" class="n">${t('thDays')}</th><th scope="col" class="n">${t('thMsgs')}</th></tr></thead><tbody>` + FLOWS.map(f => `<tr class="${pass(f, c) ? 'pass' : ''}"><td>${F[f.k]}</td><td class="n">${N(f.v[0], 2)}%</td><td class="n">${N(f.v[1], 2)}%</td><td class="n">${N(f.v[2], 2)}</td><td class="n">${N(f.v[3], 2)}</td></tr>`).join('') + '</tbody>';
}
function render(){
  document.documentElement.lang = lang; $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $('#lang').textContent = lang === 'ro' ? 'EN' : 'RO'; $('#lang').setAttribute('aria-label', lang === 'ro' ? 'Switch to English' : 'Schimbă în română'); $('#theme').setAttribute('aria-label', lang === 'ro' ? 'Schimbă tema' : 'Toggle theme');
  document.title = lang === 'ro' ? 'Journey Builder — studiu de caz: decizii, model de simulare și ce s-a stricat pe drum | Laura Andreea' : 'Journey Builder — case study: decisions, simulation model and what broke along the way | Laura Andreea';
  $$('a[href="./"]').forEach(a => a.href = lang === 'en' ? './?lang=en' : './');
  $('#facts').innerHTML = t('facts').map(f => `<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
  $('#problem').innerHTML = t('problem').map(p => `<p>${p}</p>`).join('');
  $('#decisions').innerHTML = t('decisions').map(d => `<article class="card"><h3>${d[0]}</h3><p><span class="k">${t('why')}</span>${d[1]}</p><p class="cost"><span class="k">${t('cost')}</span>${d[2]}</p></article>`).join('');
  const e = $('#mE').value || '1'; $('#mE').innerHTML = [t('eNone'), t('eOpen'), t('eClick')].map((x, i) => `<option value="${i}">${x}</option>`).join(''); $('#mE').value = e;
  $('#formula').textContent = t('formula');
  $('#chBtns').innerHTML = t('ch').map((c, i) => `<button class="btn" data-ch="${i}" aria-pressed="${i === chI}">${i + 1} · ${c}</button>`).join(''); $$('[data-ch]').forEach(b => b.onclick = () => { chI = +b.dataset.ch; ls.set('jbcs.ch', chI); plot(); });
  $('#bugs').innerHTML = t('bugs').map(b => `<li><b>${b[0]}</b><span>${b[1]}</span></li>`).join('');
  $('#verify').innerHTML = `<div class="card"><h3>✓ ${t('vYes')}</h3><ul>${t('yes').map(x => `<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>? ${t('vNo')}</h3><ul>${t('no').map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  $('#next').innerHTML = t('next').map(p => `<p>${p}</p>`).join('');
  model(); plot();
}
['mN', 'mD', 'mE'].forEach(id => $('#' + id).addEventListener('input', model));
$('#theme').onclick = () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = th; ls.set('jb.theme', th); };
$('#lang').onclick = () => { lang = lang === 'ro' ? 'en' : 'ro'; ls.set('jb.lang', lang); render(); };
document.documentElement.dataset.theme = ls.get('jb.theme', 'dark');
if (!(chI >= 0 && chI < 3)) chI = 0;
render();
window.CS = { FLOWS, CH, pass };
})();
</script>
