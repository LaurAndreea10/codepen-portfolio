<!doctype html>
<html lang="ro" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox CRM — Atribuire reversibilă</title><meta name="description" content="Inbox CRM bilingv accesibil cu atribuire și anulare. Practice Lab 14."><link rel="canonical" href="https://laurandreea10.github.io/codepen-portfolio/crm-inbox-undo.html"><style>
:root{color-scheme:dark;--bg:#091322;--panel:#14243a;--ink:#f1f6ff;--muted:#bdcce0;--line:#486383;--accent:#98c4ff;--focus:#ffda77}
[data-theme=light]{color-scheme:light;--bg:#edf3fc;--panel:#fff;--ink:#15263d;--muted:#455c78;--line:#8a9eb9;--accent:#174c9d;--focus:#874200}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,sans-serif}main{width:min(58rem,100% - 2rem);margin:2rem auto}header,.controls{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}a{color:var(--accent)}button{font:inherit;min-height:44px;padding:.6rem 1rem;border:1px solid var(--line);border-radius:.7rem;background:var(--panel);color:var(--ink);cursor:pointer}button:disabled{opacity:.65;cursor:default}:focus-visible{outline:3px solid var(--focus);outline-offset:4px}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.1}p{color:var(--muted)}ul{list-style:none;padding:0;display:grid;gap:1rem}article{border:1px solid var(--line);border-radius:1rem;padding:1.25rem;background:var(--panel);overflow-wrap:anywhere}h2{margin:0;font-size:1.3rem}.status{font-weight:700;color:var(--ink)}#feedback{min-height:3.2em}.skip{position:absolute;top:-100px}.skip:focus{top:0}@media(min-width:700px){ul{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(forced-colors:active){article,button{border:2px solid CanvasText}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><a class="skip" href="#content">Sari la conținut / Skip to content</a><main id="content"><header><a href="evolution-lab.html">Evolution Lab</a><div class="controls"><button id="language" type="button">English</button><button id="theme" type="button"></button></div></header><p>Practice Lab · 14</p><h1 id="title"></h1><p id="intro"></p><p id="count"></p><ul id="requests"></ul><button id="undo" type="button" disabled></button><p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p><noscript>Activează JavaScript pentru acest demo / Enable JavaScript for this demo.</noscript></main>
<script>
(()=>{"use strict";
const requests=[{id:"r1",client:"Atelier Nova",assigned:false},{id:"r2",client:"Studio Iris",assigned:false},{id:"r3",client:"Nord Design",assigned:false}];
let lastAction=null,language="ro",theme="dark",message=null;
const copy={ro:{title:"Inbox CRM",intro:"Date demonstrative. Preia o solicitare și anulează ultima atribuire, fără limită de timp.",assign:"Preia",assigned:"Atribuită mie",unassigned:"Neatribuită",undo:"Anulează ultima atribuire",count:n=>n===1?"1 solicitare neatribuită":n+" solicitări neatribuite",done:n=>"Solicitarea pentru "+n+" a fost atribuită.",undone:n=>"Atribuirea pentru "+n+" a fost anulată.",light:"Temă deschisă",dark:"Temă închisă"},en:{title:"CRM Inbox",intro:"Demo data. Assign a request and undo the last assignment, with no time limit.",assign:"Assign to me",assigned:"Assigned to me",unassigned:"Unassigned",undo:"Undo last assignment",count:n=>n+" unassigned request"+(n===1?"":"s"),done:n=>"Request for "+n+" assigned.",undone:n=>"Assignment for "+n+" undone.",light:"Light theme",dark:"Dark theme"}};
const $=id=>document.getElementById(id),t=()=>copy[language];
function assignRequest(id){const request=requests.find(item=>item.id===id);if(!request||request.assigned)return false;lastAction={id,previous:request.assigned};request.assigned=true;message={key:"done",client:request.client};return true}
function undoAssignment(){if(!lastAction)return null;const action=lastAction,request=requests.find(item=>item.id===action.id);if(!request)return null;request.assigned=action.previous;lastAction=null;message={key:"undone",client:request.client};return action.id}
function render(){document.documentElement.lang=language;document.documentElement.dataset.theme=theme;$("title").textContent=t().title;$("intro").textContent=t().intro;$("language").textContent=language==="ro"?"English":"Română";$("language").lang=language==="ro"?"en":"ro";$("theme").textContent=t()[theme==="dark"?"light":"dark"];$("count").textContent=t().count(requests.filter(item=>!item.assigned).length);$("undo").textContent=t().undo;$("undo").disabled=!lastAction;requests.forEach(request=>{const row=document.getElementById(request.id);row.querySelector(".status").textContent=t()[request.assigned?"assigned":"unassigned"];const button=row.querySelector("button");button.textContent=t().assign;button.setAttribute("aria-label",t().assign+" — "+request.client);button.disabled=request.assigned});$("feedback").textContent=message?t()[message.key](message.client):""}
requests.forEach(request=>{const li=document.createElement("li"),article=document.createElement("article"),heading=document.createElement("h2"),status=document.createElement("p"),button=document.createElement("button");article.id=request.id;heading.textContent=request.client;status.className="status";button.type="button";button.dataset.requestId=request.id;article.append(heading,status,button);li.append(article);$("requests").append(li)});
$("requests").addEventListener("click",event=>{const button=event.target.closest("button[data-request-id]");if(!button)return;if(assignRequest(button.dataset.requestId)){render();$("undo").focus()}});
$("undo").addEventListener("click",()=>{const id=undoAssignment();render();if(id)document.getElementById(id).querySelector("button").focus()});
$("language").addEventListener("click",()=>{language=language==="ro"?"en":"ro";render()});
$("theme").addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";render()});
render();
})();
</script></body></html>
