<!doctype html><html lang="ro" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preferințe accesibile — Practice Lab 15</title><meta name="description" content="Panou RO/EN cu temă automată, reducerea mișcării și preferințe validate."><link rel="canonical" href="https://laurandreea10.github.io/codepen-portfolio/accessible-preferences.html"><style>
:root{color-scheme:light;--bg:#edf3fc;--panel:#fff;--ink:#14263e;--muted:#425977;--line:#8197b3;--accent:#174f9f;--focus:#874300}[data-theme=dark]{color-scheme:dark;--bg:#091322;--panel:#14243b;--ink:#f2f6ff;--muted:#bdcde3;--line:#526d8e;--accent:#9bc6ff;--focus:#ffda77}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,sans-serif}main{width:min(42rem,100% - 2rem);margin:2rem auto}header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}a{color:var(--accent)}h1{line-height:1.15;font-size:clamp(2rem,7vw,3rem)}fieldset,.card{min-width:0;border:1px solid var(--line);padding:1.25rem;border-radius:1rem;background:var(--panel);margin:1rem 0}legend{font-weight:750}label{display:flex;align-items:center;gap:.7rem;min-height:44px;cursor:pointer}input{width:1.2rem;height:1.2rem;accent-color:var(--accent)}button{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:.7rem;padding:.6rem 1rem;background:var(--panel);color:var(--ink);cursor:pointer}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}p{color:var(--muted)}.card{transition:transform .2s ease}.card:hover,.card:focus-within{transform:translateY(-3px)}[data-reduce-motion=true] .card{transition:none;transform:none}#storageStatus{min-height:1.6em}@media(prefers-reduced-motion:reduce){.card{transition:none!important;transform:none!important}}@media(forced-colors:active){fieldset,.card,button{border:2px solid CanvasText}}
</style></head><body><main><header><a href="evolution-lab.html">Evolution Lab</a><button id="language" type="button">English</button></header><p>Practice Lab · 15</p><h1 data-copy="title">Preferințe accesibile</h1><fieldset id="themeOptions"><legend data-copy="legend">Tema interfeței</legend><label><input type="radio" name="theme" value="auto" checked><span data-copy="auto">Automată</span></label><label><input type="radio" name="theme" value="light"><span data-copy="light">Deschisă</span></label><label><input type="radio" name="theme" value="dark"><span data-copy="dark">Închisă</span></label></fieldset><label><input id="reduceMotion" type="checkbox"><span data-copy="reduce">Redu mișcarea</span></label><p id="applied" role="status" aria-live="polite"></p><article class="card"><h2 data-copy="preview">Previzualizare card CRM</h2><p data-copy="previewHelp">Treci cu cursorul peste card pentru o tranziție discretă. Reducerea mișcării dezactivează efectul.</p></article><button id="reset" type="button" data-copy="reset">Restabilește valorile implicite</button><p id="storageStatus" role="status" aria-live="polite"></p><noscript>Activează JavaScript / Enable JavaScript.</noscript></main><script>
(()=>{"use strict";
const KEY="laurai-accessible-preferences-v1",defaults=()=>({theme:"auto",reduceMotion:false});
function validatePreferences(value){return value&&typeof value==="object"&&!Array.isArray(value)&&["auto","light","dark"].includes(value.theme)&&typeof value.reduceMotion==="boolean"?{theme:value.theme,reduceMotion:value.reduceMotion}:defaults()}
function derivePreferences(value,dark,motion){return{theme:value.theme==="auto"?(dark?"dark":"light"):value.theme,reduceMotion:value.reduceMotion||motion}}
let preferences=defaults(),language="ro",storageMessage="";
try{preferences=validatePreferences(JSON.parse(localStorage.getItem(KEY)||"null"))}catch{}
const systemTheme=matchMedia("(prefers-color-scheme: dark)"),systemMotion=matchMedia("(prefers-reduced-motion: reduce)");
const copy={ro:{title:"Preferințe accesibile",legend:"Tema interfeței",auto:"Automată",light:"Deschisă",dark:"Închisă",reduce:"Redu mișcarea",preview:"Previzualizare card CRM",previewHelp:"Treci cu cursorul peste card pentru o tranziție discretă. Reducerea mișcării dezactivează efectul.",reset:"Restabilește valorile implicite",applied:"Tema aplicată",motion:"Mișcare redusă",yes:"da",no:"nu",saveError:"Preferințele sunt aplicate, dar nu au putut fi salvate.",resetError:"Valorile implicite sunt aplicate, dar stocarea nu a putut fi curățată.",resetDone:"Valorile implicite au fost restabilite."},en:{title:"Accessible preferences",legend:"Interface theme",auto:"Automatic",light:"Light",dark:"Dark",reduce:"Reduce motion",preview:"CRM card preview",previewHelp:"Hover over the card for a subtle transition. Reduced motion disables the effect.",reset:"Restore defaults",applied:"Applied theme",motion:"Reduced motion",yes:"yes",no:"no",saveError:"Preferences were applied but could not be saved.",resetError:"Defaults were applied but storage could not be cleared.",resetDone:"Defaults restored."}};
function applyPreferences(){const effective=derivePreferences(preferences,systemTheme.matches,systemMotion.matches),t=copy[language];document.documentElement.dataset.theme=effective.theme;document.documentElement.dataset.reduceMotion=String(effective.reduceMotion);document.documentElement.lang=language;document.querySelectorAll("[data-copy]").forEach(node=>node.textContent=t[node.dataset.copy]);document.querySelectorAll('input[name="theme"]').forEach(input=>input.checked=input.value===preferences.theme);document.getElementById("reduceMotion").checked=preferences.reduceMotion;document.getElementById("applied").textContent=t.applied+": "+t[effective.theme]+". "+t.motion+": "+t[effective.reduceMotion?"yes":"no"]+".";document.getElementById("storageStatus").textContent=storageMessage?t[storageMessage]:"";const button=document.getElementById("language");button.textContent=language==="ro"?"English":"Română";button.lang=language==="ro"?"en":"ro"}
function save(){storageMessage="";try{localStorage.setItem(KEY,JSON.stringify(preferences))}catch{storageMessage="saveError"}applyPreferences()}
document.getElementById("themeOptions").addEventListener("change",event=>{if(event.target.name!=="theme")return;preferences.theme=event.target.value;save()});
document.getElementById("reduceMotion").addEventListener("change",event=>{preferences.reduceMotion=event.target.checked;save()});
systemTheme.addEventListener("change",()=>{if(preferences.theme==="auto")applyPreferences()});systemMotion.addEventListener("change",applyPreferences);
document.getElementById("language").addEventListener("click",()=>{language=language==="ro"?"en":"ro";applyPreferences()});
document.getElementById("reset").addEventListener("click",()=>{preferences=defaults();storageMessage="resetDone";try{localStorage.removeItem(KEY)}catch{storageMessage="resetError"}applyPreferences()});
applyPreferences();
})();
</script></body></html>
