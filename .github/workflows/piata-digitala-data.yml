name: Piața digitală · Eurostat snapshot

# Refreshes the fallback snapshot for piata-digitala/ once a month (Eurostat publishes ICT data yearly).
on:
  schedule:
    - cron: "23 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch Eurostat queries
        run: node scripts/fetch-eurostat.mjs
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add piata-digitala/data/snapshot.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Piața digitală: refresh Eurostat snapshot"
          git push
