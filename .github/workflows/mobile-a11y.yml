name: Recent projects mobile accessibility

concurrency:
  group: recent-mobile-a11y-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "gimnaziu-space/**"
      - "projects/examspace-v-viii.html"
      - "ghost-talk/**"
      - "crm-offline-queue.html"
      - "livada/**"
      - "booscary/**"
      - "scripts/recent-project-*.mjs"
      - "scripts/serve-portfolio.mjs"
      - "serpent-prism/**"
      - "pentarena/**"
      - "slidestorm-arena/**"
      - "odyssey-quest/**"
      - "curious-garden/**"
      - "canva-collection.html"
      - "en/canva-collection.html"
      - "skydreams-portal/**"
      - "kygo-world/**"
      - "en/index.html"
      - "data/portfolio-evidence.json"
      - "scripts/mobile-a11y.mjs"
      - ".github/workflows/mobile-a11y.yml"
  pull_request:
    paths:
      - "gimnaziu-space/**"
      - "projects/examspace-v-viii.html"
      - "ghost-talk/**"
      - "crm-offline-queue.html"
      - "livada/**"
      - "booscary/**"
      - "scripts/recent-project-*.mjs"
      - "scripts/serve-portfolio.mjs"
      - "serpent-prism/**"
      - "pentarena/**"
      - "slidestorm-arena/**"
      - "odyssey-quest/**"
      - "curious-garden/**"
      - "canva-collection.html"
      - "en/canva-collection.html"
      - "skydreams-portal/**"
      - "kygo-world/**"
      - "en/index.html"
      - "data/portfolio-evidence.json"
      - "scripts/mobile-a11y.mjs"
  schedule:
    - cron: "20 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser audit tools
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Audit 360, 390 and 412 px
        run: node scripts/mobile-a11y.mjs
      - name: Verify RO/EN, light/dark, reduced motion and forced colours
        if: always()
        run: node scripts/recent-project-matrix.mjs
      - name: Publish real mobile captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-projects-mobile-390
          path: audit-artifacts/recent-projects/
          if-no-files-found: warn
