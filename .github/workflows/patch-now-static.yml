name: One-time static Now patch

on:
  push:
    paths:
      - '.github/workflows/patch-now-static.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Now section with static content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('    <section id="now" aria-labelledby="now-title">')
          marker = '    <section id="marketing-tech" class="gh-section" aria-labelledby="marketing-tech-title">'
          marketing = s.index(marker, start)
          divider_start = s.rfind('    <div class="section-divider"></div>', start, marketing)

          now = '''    <section id="now" aria-labelledby="now-title">
      <div class="container">
        <article class="about-card glass">
          <div class="now-head">
            <div>
              <span class="eyebrow eyebrow-green">&#x26A1; Now</span>
              <h2 id="now-title" class="now-title">La ce lucrez acum</h2>
            </div>
            <p class="now-badge">Actualizat: <time id="now-datetime" datetime="2026-08-15">15 August 2026</time></p>
          </div>

          <div class="now-tabs" role="tablist" aria-label="Activitate curent&#x103;">
            <button class="now-tab now-tab-active" role="tab" aria-selected="true" aria-controls="now-panel-active" id="now-tab-active" type="button">&#x1F504; &Icirc;n curs</button>
            <button class="now-tab" role="tab" aria-selected="false" aria-controls="now-panel-done" id="now-tab-done" type="button">&#x2705; Finalizat recent</button>
            <button class="now-tab" role="tab" aria-selected="false" aria-controls="now-panel-history" id="now-tab-history" type="button">&#x1F4C5; Istoric</button>
          </div>

          <div class="now-panel" id="now-panel-active" role="tabpanel" aria-labelledby="now-tab-active">
            <ul class="now-checklist">
              <li class="now-item now-item-active" data-static-now-item="active">
                <span class="now-status" aria-hidden="true">&#x1F504;</span>
                <span>
                  <strong>ClientOps Suite Premium &mdash; status &amp; demo alignment</strong>
                  <span class="now-item-copy">Cur&#x103;&#x21B; starea proiectului astfel &icirc;nc&acirc;t demo-ul, repo-ul &#x219;i mesajele din portofoliu s&#x103; spun&#x103; acela&#x219;i lucru.</span>
                  <span class="now-next"><b>Pasul urm&#x103;tor:</b> verific demo-ul live, elimin ETA-ul vechi &#x219;i aliniez CTA-urile cu starea real&#x103;.</span>
                  <span class="now-tag">Product polish</span>
                </span>
              </li>
              <li class="now-item now-item-active" data-static-now-item="active">
                <span class="now-status" aria-hidden="true">&#x1F504;</span>
                <span>
                  <strong>Case study accessibility pass</strong>
                  <span class="now-item-copy">Auditez case study-urile principale pentru navigare cu tastatura, focus vizibil &#x219;i descrieri utile pentru capturi.</span>
                  <span class="now-next"><b>Pasul urm&#x103;tor:</b> Alpis Fusion, ClientFlow &#x219;i Link Video Editor &mdash; keyboard + focus + alt text.</span>
                  <span class="now-tag">Accessibility</span>
                </span>
              </li>
              <li class="now-item now-item-active" data-static-now-item="active">
                <span class="now-status" aria-hidden="true">&#x1F504;</span>
                <span>
                  <strong>Technical proof &amp; README consistency</strong>
                  <span class="now-item-copy">Fac dovezile tehnice mai u&#x219;or de verificat: stack, arhitectur&#x103;, ownership, setup &#x219;i link direct spre cod.</span>
                  <span class="now-next"><b>Pasul urm&#x103;tor:</b> aplic acela&#x219;i format README &#x219;i proof card pe cele 3 proiecte-cheie.</span>
                  <span class="now-tag">Engineering proof</span>
                </span>
              </li>
            </ul>
          </div>

          <div class="now-panel now-panel-hidden" id="now-panel-done" role="tabpanel" aria-labelledby="now-tab-done">
            <ul class="now-checklist">
              <li class="now-item now-item-done" data-static-now-item="done">
                <span class="now-status" aria-hidden="true">&#x2705;</span>
                <span><strong>Email Alerts</strong> &mdash; publicat cu RO/EN, accesibilitate, dark mode &#x219;i istoric de versiuni. <a class="now-item-link" href="https://laurandreea10.github.io/Email-Alerts/" target="_blank" rel="noopener noreferrer">Deschide proiectul</a></span>
              </li>
              <li class="now-item now-item-done" data-static-now-item="done">
                <span class="now-status" aria-hidden="true">&#x2705;</span>
                <span><strong>MoonMail &mdash; Cosmic Receipt Email</strong> &mdash; challenge email finalizat &#x219;i publicat. <a class="now-item-link" href="https://laurandreea10.github.io/MoonMail-Cosmic-Receipt-Email/" target="_blank" rel="noopener noreferrer">Deschide proiectul</a></span>
              </li>
            </ul>
          </div>

          <div class="now-panel now-panel-hidden" id="now-panel-history" role="tabpanel" aria-labelledby="now-tab-history">
            <div class="now-history">
              <div class="now-history-week">
                <strong>Finalizate &icirc;nainte de aceast&#x103; actualizare</strong>
                <ul class="now-checklist">
                  <li class="now-item"><span class="now-status" aria-hidden="true">&#x2705;</span><span>Case study screenshots &amp; before/after visuals</span></li>
                  <li class="now-item"><span class="now-status" aria-hidden="true">&#x2705;</span><span>Project metrics &amp; validation notes</span></li>
                  <li class="now-item"><span class="now-status" aria-hidden="true">&#x2705;</span><span>Recruiter / reviewer quick path</span></li>
                </ul>
              </div>
            </div>
          </div>

          <p class="now-note">O list&#x103; scurt&#x103; &#x219;i inten&#x21B;ionat actual&#x103;: ce este activ, de ce conteaz&#x103; &#x219;i care este urm&#x103;torul pas concret.</p>

          <noscript>
            <style>
              #now .now-tabs{display:none!important}
              #now .now-panel-hidden{display:block!important}
              #now .now-panel{margin-top:1rem}
              #now .now-panel::before{display:block;font-weight:700;margin:0 0 .6rem}
              #now-panel-active::before{content:'&#x1F504; In curs'}
              #now-panel-done::before{content:'&#x2705; Finalizat recent'}
              #now-panel-history::before{content:'&#x1F4C5; Istoric'}
            </style>
          </noscript>

          <script>
            (function(){
              var tabs=document.querySelectorAll('#now .now-tab');
              var panels=document.querySelectorAll('#now .now-panel');
              tabs.forEach(function(tab){
                tab.addEventListener('click',function(){
                  var target=tab.getAttribute('aria-controls');
                  tabs.forEach(function(t){t.classList.remove('now-tab-active');t.setAttribute('aria-selected','false');});
                  panels.forEach(function(p){p.classList.add('now-panel-hidden');});
                  tab.classList.add('now-tab-active');tab.setAttribute('aria-selected','true');
                  document.getElementById(target).classList.remove('now-panel-hidden');
                });
              });
            })();
          </script>
        </article>
      </div>
    </section>

    <div class="section-divider"></div>

'''

          s = s[:start] + now + s[marketing:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Keep JS from erasing static Now content
        shell: bash
        run: |
          cat > main.js <<'JS'
          (() => {
            'use strict';

            const PREVIOUS_MAIN = 'https://cdn.jsdelivr.net/gh/LaurAndreea10/codepen-portfolio@c02951956477eacc6cb791b932b30c41d6d1b7da/main.js';

            const ACTIVE_RO = [
              ['ClientOps Suite Premium — status & demo alignment','Curăț starea proiectului astfel încât demo-ul, repo-ul și mesajele din portofoliu să spună același lucru.','verific demo-ul live, elimin ETA-ul vechi și aliniez CTA-urile cu starea reală.','Product polish'],
              ['Case study accessibility pass','Auditez case study-urile principale pentru navigare cu tastatura, focus vizibil și descrieri utile pentru capturi.','Alpis Fusion, ClientFlow și Link Video Editor — keyboard + focus + alt text.','Accessibility'],
              ['Technical proof & README consistency','Fac dovezile tehnice mai ușor de verificat: stack, arhitectură, ownership, setup și link direct spre cod.','aplic același format README și proof card pe cele 3 proiecte-cheie.','Engineering proof']
            ];
            const ACTIVE_EN = [
              ['ClientOps Suite Premium — status & demo alignment','Align the project state so the live demo, repository and portfolio messaging tell the same story.','verify the live demo, remove the stale ETA and align CTAs with the real project state.','Product polish'],
              ['Case study accessibility pass','Audit the main case studies for keyboard navigation, visible focus and useful screenshot descriptions.','Alpis Fusion, ClientFlow and Link Video Editor — keyboard + focus + alt text.','Accessibility'],
              ['Technical proof & README consistency','Make technical proof easier to verify: stack, architecture, ownership, setup and direct code links.','apply one README and proof-card format across the three flagship projects.','Engineering proof']
            ];

            function en(){ return document.documentElement.lang === 'en'; }
            function activeHtml(){
              const items = en() ? ACTIVE_EN : ACTIVE_RO;
              return items.map(x => `<li class="now-item now-item-active" data-static-now-item="active"><span class="now-status" aria-hidden="true">🔄</span><span><strong>${x[0]}</strong><span class="now-item-copy">${x[1]}</span><span class="now-next"><b>${en()?'Next step':'Pasul următor'}:</b> ${x[2]}</span><span class="now-tag">${x[3]}</span></span></li>`).join('');
            }
            function doneHtml(){
              return en()
                ? `<li class="now-item now-item-done" data-static-now-item="done"><span class="now-status">✅</span><span><strong>Email Alerts</strong> — published with RO/EN, accessibility, dark mode and version history. <a class="now-item-link" href="https://laurandreea10.github.io/Email-Alerts/" target="_blank" rel="noopener noreferrer">Open project</a></span></li><li class="now-item now-item-done" data-static-now-item="done"><span class="now-status">✅</span><span><strong>MoonMail — Cosmic Receipt Email</strong> — completed and published email challenge. <a class="now-item-link" href="https://laurandreea10.github.io/MoonMail-Cosmic-Receipt-Email/" target="_blank" rel="noopener noreferrer">Open project</a></span></li>`
                : `<li class="now-item now-item-done" data-static-now-item="done"><span class="now-status">✅</span><span><strong>Email Alerts</strong> — publicat cu RO/EN, accesibilitate, dark mode și istoric de versiuni. <a class="now-item-link" href="https://laurandreea10.github.io/Email-Alerts/" target="_blank" rel="noopener noreferrer">Deschide proiectul</a></span></li><li class="now-item now-item-done" data-static-now-item="done"><span class="now-status">✅</span><span><strong>MoonMail — Cosmic Receipt Email</strong> — challenge email finalizat și publicat. <a class="now-item-link" href="https://laurandreea10.github.io/MoonMail-Cosmic-Receipt-Email/" target="_blank" rel="noopener noreferrer">Deschide proiectul</a></span></li>`;
            }
            function restoreNow(){
              const active=document.querySelector('#now-panel-active .now-checklist');
              const done=document.querySelector('#now-panel-done .now-checklist');
              if(active) active.innerHTML=activeHtml();
              if(done) done.innerHTML=doneHtml();
              const title=document.getElementById('now-title');
              if(title) title.textContent=en()?'What I am working on now':'La ce lucrez acum';
              const note=document.querySelector('#now .now-note');
              if(note) note.textContent=en()?'A small, intentionally current list: what is active, why it matters, and the next concrete step.':'O listă scurtă și intenționat actuală: ce este activ, de ce contează și care este următorul pas concret.';
            }
            function styles(){
              if(document.getElementById('static-now-styles')) return;
              const s=document.createElement('style');
              s.id='static-now-styles';
              s.textContent='#now-panel-active .now-item>span:last-child{display:grid;gap:6px}#now .now-item-copy,#now .now-next{display:block;color:var(--muted,#aeb7c8);font-size:13px;line-height:1.5;max-width:900px}#now .now-next b{color:var(--text,#eef3fb);font-weight:600}#now-panel-active .now-tag{width:max-content;font-size:11px}';
              document.head.appendChild(s);
            }
            function guard(){
              const now=document.getElementById('now');
              if(!now||now.dataset.staticGuard) return;
              now.dataset.staticGuard='1';
              let busy=false;
              new MutationObserver(()=>{ if(busy)return; busy=true; queueMicrotask(()=>{busy=false; if(document.querySelectorAll('#now-panel-active [data-static-now-item="active"]').length!==3||document.querySelectorAll('#now-panel-done [data-static-now-item="done"]').length!==2) restoreNow();}); }).observe(now,{childList:true,subtree:true});
              new MutationObserver(restoreNow).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
            }
            function init(){
              styles(); restoreNow(); guard();
              const script=document.createElement('script');
              script.src=PREVIOUS_MAIN; script.async=true; script.onload=restoreNow; script.onerror=restoreNow; document.head.appendChild(script);
              window.addEventListener('load',restoreNow,{once:true});
              [300,900,1800,3500].forEach(ms=>setTimeout(restoreNow,ms));
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init,{once:true}); else init();
          })();
          JS

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-now-static.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html main.js .github/workflows/patch-now-static.yml
          git commit -m 'Make Now section static and current'
          git push origin HEAD:main
