name: One-time static Now patch

on:
  push:
    paths:
      - '.github/workflows/patch-now-static.yml'
      - '.github/patch_now_static.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply static Now patch
        run: python .github/patch_now_static.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Now section static and current"
          git push origin HEAD:main
