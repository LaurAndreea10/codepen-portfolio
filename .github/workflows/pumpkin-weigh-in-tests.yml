name: Pumpkin Weigh-In tests

# Jest with full coverage for pumpkin.js, then Chromium checks of the page and the in-browser test runner.
on:
  push:
    paths:
      - 'pumpkin-weigh-in/**'
      - '.github/workflows/pumpkin-weigh-in-tests.yml'
  pull_request:
    paths:
      - 'pumpkin-weigh-in/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pumpkin-weigh-in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Jest
        run: npm install --no-audit --no-fund
      - name: Jest with coverage
        run: npm run test:coverage

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Serve the repository
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
      - name: Page (390 and 1280 px) and in-browser test results
        env:
          PUMPKIN_URL: http://localhost:8000/pumpkin-weigh-in/
          PUMPKIN_SHOTS: ${{ runner.temp }}/pumpkin-shots
        run: python pumpkin-weigh-in/tests/test_page.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-weigh-in-screenshots
          path: ${{ runner.temp }}/pumpkin-shots
          if-no-files-found: ignore
