name: Candy Route checks
on:
  pull_request:
    paths:
      - 'candy-route/**'
      - '.github/workflows/candy-route.yml'
  push:
    branches: [main]
    paths:
      - 'candy-route/**'
      - '.github/workflows/candy-route.yml'
permissions:
  contents: read
jobs:
  candy-route:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candy-route
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:jest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:studio-ui
      - run: npm run test:adventure-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candy-route-browser-results
          path: |
            candy-route/browser-results.json
            candy-route/studio-browser-results.json
            candy-route/adventure-browser-results.json
