name: Lighthouse CI

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Wait for GitHub Pages deployment
        if: github.event_name == 'push'
        run: node scripts/wait-for-pages.mjs

      - name: Run Lighthouse CI
        env:
          LHCI_TARGET: ${{ github.event_name == 'pull_request' && 'local' || 'production' }}
        run: lhci autorun --config=.lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
