name: Weekly Lighthouse evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deploy
        if: github.event_name == 'push'
        run: sleep 90
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://laurandreea10.github.io/codepen-portfolio/portfolio.html
            https://laurandreea10.github.io/codepen-portfolio/en/
            https://laurandreea10.github.io/codepen-portfolio/project-health.html
            https://laurandreea10.github.io/codepen-portfolio/growth-suite.html
            https://laurandreea10.github.io/codepen-portfolio/en/growth-suite.html
            https://laurandreea10.github.io/codepen-portfolio/evolution-lab.html
            https://laurandreea10.github.io/codepen-portfolio/portfolio-summary.html
            https://laurandreea10.github.io/-BUGFLOW/
          uploadArtifacts: true
          temporaryPublicStorage: true
