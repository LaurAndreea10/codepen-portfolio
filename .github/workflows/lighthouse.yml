name: Weekly Lighthouse evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Audit the live deployment with the shared mobile budgets
        run: |
          node scripts/lighthouse-live-config.mjs
          lhci autorun --config=audit-artifacts/lighthouse-live.json
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
