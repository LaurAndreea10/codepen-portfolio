name: One-time CodePen count 82 patch

on:
  push:
    paths:
      - '.github/workflows/patch-codepen-count-82.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize CodePen count to 82
        run: python .github/patch_codepen_count_82.py
      - name: Commit normalized counts
        run: |
          rm -f .github/workflows/patch-codepen-count-82.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize CodePen count to 82 across portfolio'
          git push origin HEAD:main
